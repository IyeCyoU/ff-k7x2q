/* ---- budgets ---- */
function budgetFor(mk){
  const v=S.plan.budgets.filter(x=>x.from<=mk).sort((a,b)=>b.from.localeCompare(a.from))[0];
  if(!v)return null;
  const r=fxAt(S.data,v.cur,mk+'-01');if(r===null)return null;
  const out={};for(const[k,a]of Object.entries(v.amounts))out[k]=a*r;
  return{v,out};
}
function budgetCompare(s,e){
  const ix=S.ix,cap=e>ix.latest?ix.latest:e,rows={};let has=false;
  if(cap<s)return{has:false,list:[],tot:{budget:0,full:0,actual:0},cap,a:actual(S.data,s,s,ix)};
  for(let m=monthStart(s);m<=cap;m=addMonths(m,1)){
    const b=budgetFor(m.slice(0,7));if(!b)continue;has=true;
    const mEnd=endMonth(m),dim=daysBetween(m,mEnd),from=m<s?s:m;
    const f1=daysBetween(from,mEnd<cap?mEnd:cap)/dim,f2=daysBetween(from,mEnd<e?mEnd:e)/dim;
    for(const[k,v]of Object.entries(b.out)){if(/^(@|Income › |\+)/.test(k))continue;const r=(rows[k]??={budget:0,full:0,actual:0});r.budget+=v*f1;r.full+=v*f2}
  }
  const a=actual(S.data,s,cap,ix);
  for(const l of a.exLines){(rows[catKey(l)]??={budget:0,full:0,actual:0}).actual+=l.value}
  const list=Object.entries(rows).map(([k,r])=>({key:k,...r,variance:r.budget-r.actual})).sort((x,y)=>Math.max(y.budget,y.actual)-Math.max(x.budget,x.actual));
  const tot=list.reduce((t,r)=>({budget:t.budget+r.budget,full:t.full+r.full,actual:t.actual+r.actual}),{budget:0,full:0,actual:0});
  return{has,list,tot,cap,a};
}

function attention(){
  const ix=S.ix,[s,e]=range(),items=[];
  if(ix.errors.length)items.push({k:'bad',t:ix.errors.length+' transaction'+(ix.errors.length>1?'s are':' is')+' left out of the totals.',go:'data'});
  const age=Math.floor((Date.now()-D(ix.latest).getTime())/86400000);
  if(age>14&&!S.meta.sample)items.push({k:'warn',t:'Your data ends '+age+' days ago. Import a fresh export to bring it up to date.',act:'import'});
  const bc=budgetCompare(s,e);
  if(bc.has){const over=bc.list.filter(r=>r.budget>0&&r.actual>r.budget*1.0001);if(over.length)items.push({k:'warn',t:over.length+' categor'+(over.length>1?'ies are':'y is')+' over budget so far in this period.',go:'plan',tab:'budget'})}

  const o=outlook(),chg=activeRecurring().filter(r=>r.changed);
  if(chg.length)items.push({k:'info',t:chg.length+' repeating payment'+(chg.length>1?'s':'')+' changed in price, for example '+(chg[0].desc||'one item')+'.',go:'plan',tab:'repeat'});
  if(o.reserve>0&&o.lowest.cash<o.reserve)items.push({k:'bad',t:'Available cash is projected to drop below your reserve by '+fmonLong(o.lowest.month)+'.',go:'plan',tab:'outlook'});
  else if(o.lowest.cash<0)items.push({k:'bad',t:'Available cash is projected to go negative by '+fmonLong(o.lowest.month)+'.',go:'plan',tab:'outlook'});
  const a=actual(S.data,s,e>ix.latest?ix.latest:e,ix),pr=prevRange(s,e),pa=pr?actual(S.data,pr[0],pr[1],ix):null;
  if(pa&&pa.expense>0&&a.expense>pa.expense*1.2)items.push({k:'warn',t:'Spending is '+S.cur+' '+fmt(a.expense-pa.expense)+' ('+Math.round((a.expense/pa.expense-1)*100)+'%) higher than '+prevText(e).replace('vs ','')+'.',go:'spending'});
  const big=a.exLines.reduce((m,l)=>l.value>(m?m.value:0)?l:m,null);
  if(big&&a.expense>0&&big.value>a.expense*.3&&a.exLines.length>5)items.push({k:'info',t:'One payment, '+(big.description||'a single transaction')+', is '+Math.round(big.value/a.expense*100)+'% of spending in this period.',go:'activity'});
  return items;
}

  const remaining=Math.max(0,g.target-have),left=g.date?Math.max(0,monthsBetween(L,g.date)):null,planned=g.monthly||0;
  const required=remaining<=0?0:left===null?0:left>0?remaining/left:Infinity;
  let status,k;
  if(remaining<=0){status='Funded';k='good'}else if(left===null){status=planned>0?'On track':'No date set';k=planned>0?'good':'warn'}else if(left===0){status='Past target date';k='bad'}else if(planned>=required-.005){status='On track';k='good'}else{status='Behind';k='warn'}
  const finish=remaining>0&&planned>0?addMonths(monthStart(L),Math.ceil(remaining/planned)):null;
  return{have,remaining,left,required,planned,status,k,finish,shortfall:Math.max(0,required-planned)};
}

function pdfEnc(t){

  for(const ch of String(t??'')){let c=ch.codePointAt(0);if(WINANSI[c])c=WINANSI[c];else if(c>255||(c>=0x80&&c<=0x9F))c=0x3F;o+=c>=32?String.fromCharCode(c):' '}
  return o;
}
function pdfWidth(t,size,bold){
  let w=0;for(const ch of pdfEnc(t)){const c=ch.charCodeAt(0);w+=(c>=32&&c<=126?(bold?HB:HW)[c-32]:556)}
  return w*size/1000;
}
function pdfFit(t,size,bold,max){
  t=String(t??'');if(pdfWidth(t,size,bold)<=max)return t;
  while(t.length>1&&pdfWidth(t+'...',size,bold)>max)t=t.slice(0,-1);
  return t+'...';
}
class PdfDoc{
  constructor(){this.W=595.28;this.H=841.89;this.pages=[];this.newPage()}
  newPage(){this.cur=[];this.pages.push(this.cur);return this}
  op(s){this.cur.push(s)}
  static rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(v=>v.toFixed(3)).join(' ')}
  text(x,y,t,{size=10,bold=false,color='#15233b',align='l',page}={}){
    const s=pdfEnc(t).replace(/[\\()]/g,'\\$&'),w=pdfWidth(t,size,bold);
    const px=align==='r'?x-w:align==='c'?x-w/2:x;
    (page||this.cur).push(`BT ${PdfDoc.rgb(color)} rg /${bold?'F2':'F1'} ${size} Tf ${px.toFixed(2)} ${(this.H-y).toFixed(2)} Td (${s}) Tj ET`);
  }
  rect(x,top,w,h,fill,page){(page||this.cur).push(`${PdfDoc.rgb(fill)} rg ${x.toFixed(2)} ${(this.H-top-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`)}
  round(x,top,w,h,r,fill){
    const k=.5523*r,x0=x,y0=this.H-top-h,x1=x+w,y1=this.H-top,f=n=>n.toFixed(2);
    this.op(`${PdfDoc.rgb(fill)} rg ${f(x0+r)} ${f(y0)} m ${f(x1-r)} ${f(y0)} l ${f(x1-r+k)} ${f(y0)} ${f(x1)} ${f(y0+r-k)} ${f(x1)} ${f(y0+r)} c ${f(x1)} ${f(y1-r)} l ${f(x1)} ${f(y1-r+k)} ${f(x1-r+k)} ${f(y1)} ${f(x1-r)} ${f(y1)} c ${f(x0+r)} ${f(y1)} l ${f(x0+r-k)} ${f(y1)} ${f(x0)} ${f(y1-r+k)} ${f(x0)} ${f(y1-r)} c ${f(x0)} ${f(y0+r)} l ${f(x0)} ${f(y0+r-k)} ${f(x0+r-k)} ${f(y0)} ${f(x0+r)} ${f(y0)} c f`);
  }
  tri(cx,cy,size,up,color){
    const h=this.H,f=n=>n.toFixed(2),a=size/2;
    this.op(`${PdfDoc.rgb(color)} rg ${f(cx-a)} ${f(h-(up?cy+a*.8:cy-a*.8))} m ${f(cx+a)} ${f(h-(up?cy+a*.8:cy-a*.8))} l ${f(cx)} ${f(h-(up?cy-a*.9:cy+a*.9))} l f`);
  }
  line(x1,y1,x2,y2,color='#dde4ee',w=.6,page){(page||this.cur).push(`${PdfDoc.rgb(color).split(' ').join(' ')} RG ${w} w ${x1.toFixed(2)} ${(this.H-y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H-y2).toFixed(2)} l S`)}
  bytes(title){
    const n=this.pages.length,objs=[];
    objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
    objs[2]=`<< /Type /Pages /Kids [${this.pages.map((_,i)=>(6+2*i)+' 0 R').join(' ')}] /Count ${n} >>`;
    objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    const d=new Date(),p2=x=>String(x).padStart(2,'0');
    objs[5]=`<< /Title (${pdfEnc(title).replace(/[\\()]/g,'\\$&')}) /Producer (Money status) /CreationDate (D:${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}) >>`;
    this.pages.forEach((ops,i)=>{
      const body=ops.join('\n');
      objs[6+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${7+2*i} 0 R >>`;
      objs[7+2*i]=`<< /Length ${body.length} >>\nstream\n${body}\nendstream`;
    });
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';const offs=[];
    for(let i=1;i<objs.length;i++){offs[i]=out.length;out+=`${i} 0 obj\n${objs[i]}\nendobj\n`}
    const xr=out.length;
    out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length} /Root 1 0 R /Info 5 0 R >>\nstartxref\n${xr}\n%%EOF`;
    const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
    return u;
  }
}

const PDFC={ink:'#15233b',muted:'#5d6c85',line:'#dde4ee',navy:'#0f1c33',soft:'#eef2f8',good:['#e4f4ec','#156643'],bad:['#fbe8ec','#a53a4c'],flat:['#eef2f8','#5d6c85']};
function pdfChip(doc,d,rightX,top){
  if(!d)return;
  const pal=S.look&&S.look.variance==='bo'?{good:['#dbeafe','#1d4ed8'],bad:['#ffe8d1','#9a4506'],flat:PDFC.flat}:PDFC;
  const [bg,fg]=pal[d.tone]||PDFC.flat,size=7.5,tw=pdfWidth(d.text,size,true),w=tw+(d.dir==='flat'?12:24),x=rightX-w;
  doc.round(x,top,w,12.5,6.2,bg);
  if(d.dir!=='flat')doc.tri(x+9,top+6.4,5.2,d.dir==='up',fg);
  doc.text(x+(d.dir==='flat'?6:15),top+9.3,d.text,{size,bold:true,color:fg});
}
/* A small layout engine: rows flow down the page and break to new pages. */
class PdfFlow{
  constructor(doc){this.doc=doc;this.y=44;this.L=40;this.R=doc.W-40;this.first=true}
  ensure(h){if(this.y+h>this.doc.H-52){this.doc.newPage();this.y=64}}
  title(t,sub){
    this.ensure(70);
    this.doc.text(this.L,this.y+16,t,{size:this.first?20:14,bold:true,color:PDFC.navy});this.y+=this.first?26:20;
    if(sub){this.doc.text(this.L,this.y+9,sub,{size:9.5,color:PDFC.muted});this.y+=16}
    this.first=false;this.y+=6;
  }
  para(t,{size=8.5,color=PDFC.muted,gap=4}={}){
    const words=String(t).split(' '),max=this.R-this.L;let line='';
    for(const w of words){const test=line?line+' '+w:w;if(pdfWidth(test,size,false)>max&&line){this.ensure(13);this.doc.text(this.L,this.y+9,line,{size,color});this.y+=12;line=w}else line=test}
    if(line){this.ensure(13);this.doc.text(this.L,this.y+9,line,{size,color});this.y+=12}
    this.y+=gap;
  }
  table(rows,{mid=false,headers=null}={}){
    const d=this.doc,amtR=mid?this.L+245:this.L+300,midR=this.L+325,chipR=this.R;
    if(headers){this.ensure(24);d.text(amtR,this.y+9,headers[0],{size:8,color:PDFC.muted,align:'r'});if(mid&&headers[2])d.text(midR,this.y+9,headers[2],{size:8,color:PDFC.muted,align:'r'});d.text(chipR,this.y+9,headers[1],{size:8,color:PDFC.muted,align:'r'});d.line(this.L,this.y+13,this.R,this.y+13);this.y+=15}
    for(const r of rows){
      const head=r.cls==='head',total=r.cls==='total',small=r.cls==='check',h=head?28:19;
      this.ensure(head?h+40:h);
      if(head){d.text(this.L,this.y+19,r.label,{size:11,bold:true,color:PDFC.navy});if(r.v!==null&&r.v!==undefined)d.text(amtR,this.y+19,typeof r.v==='string'?r.v:fmt(r.v,r.dec??0),{size:9.5,bold:true,color:PDFC.ink,align:'r'});d.line(this.L,this.y+24,this.R,this.y+24,'#b9c4d6',.9);this.y+=h;continue}
      if(total)d.rect(this.L,this.y,this.R-this.L,h-1,PDFC.soft);
      const indent=r.cls==='sub'||r.cls==='row'?10:total?4:0,size=small?8.5:9.5;
      d.text(this.L+indent,this.y+13,pdfFit(r.label,size,total,amtR-this.L-indent-(mid?70:60)-(r.mid?0:0)),{size,bold:total,color:small?PDFC.muted:(r.cls==='sub'?'#33415a':PDFC.ink)});
      if(r.v!==null&&r.v!==undefined)d.text(amtR,this.y+13,typeof r.v==='string'?r.v:fmt(r.v,r.dec??0),{size,bold:total,color:small?PDFC.muted:PDFC.ink,align:'r'});
      if(mid&&r.mid)d.text(midR,this.y+13,r.mid,{size:8.5,color:PDFC.muted,align:'r'});
      pdfChip(d,r.vd,chipR-3,this.y+3);
      if(!total)d.line(this.L,this.y+h-1,this.R,this.y+h-1);
      this.y+=h;
    }
    this.y+=8;
  }
  tableHeight(rows,headers){let h=headers?15:0;for(const r of rows)h+=r.cls==='head'?28:19;return h+8}
  block(title,sub,rows,opts={}){
    const need=(sub?44:36)+this.tableHeight(rows,opts.headers),avail=this.doc.H-52-64;
    this.ensure(need<=avail?need:120);
    this.title(title,sub);this.table(rows,opts);
  }

}
function pdfFinish(doc,title,periodText,dataThrough){
  const n=doc.pages.length,now=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  doc.pages.forEach((pg,i)=>{
    doc.text(40,24,'Money status',{size:8.5,bold:true,color:PDFC.navy,page:pg});
    doc.text(doc.W-40,24,periodText,{size:8.5,color:PDFC.muted,align:'r',page:pg});
    doc.line(40,30,doc.W-40,30,PDFC.line,.6,pg);
    doc.line(40,doc.H-40,doc.W-40,doc.H-40,PDFC.line,.6,pg);
    doc.text(40,doc.H-27,`Data through ${dataThrough} · Created ${now} · Amounts in ${S.cur}`,{size:7.5,color:PDFC.muted,page:pg});
    doc.text(doc.W-40,doc.H-27,`Page ${i+1} of ${n}`,{size:7.5,color:PDFC.muted,align:'r',page:pg});
  });
  return doc.bytes(title);
}

/* ---- what goes in the PDFs ---- */
function pdfRows(rows){return rows.map(([label,v,cls,vdt,mid])=>({label,v,cls:cls||'row',vd:vdt||null,mid:mid||'',dec:2}))}
function spendingModel(s,e){
  const d=S.data,ix=S.ix,a=actual(d,s,e,ix),bl=baseline(s),f=pace(s,e),tree={};
  for(const l of a.exLines){const mn=l.main||'Uncategorised',kn=l.level2||l.label,M=(tree[mn]??={v:0,kids:{}});M.v+=l.value;M.kids[kn]=(M.kids[kn]||0)+l.value}
  const total=a.expense,rows=[];
  for(const[mn,M]of Object.entries(tree).sort((x,y)=>y[1].v-x[1].v)){
    rows.push({label:mn,v:M.v,cls:'total',vd:bl?vd(M.v-(bl.byMain[mn]||0)*f,true,'avg'):null,mid:pct(total>0?M.v/total:null),dec:0});
    for(const[kn,v]of Object.entries(M.kids).sort((x,y)=>y[1]-x[1]))rows.push({label:kn,v,cls:'sub',vd:bl?vd(v-(bl.byKey[mn+'|'+kn]||0)*f,true,'avg'):null,mid:pct(total>0?v/total:null),dec:0});
  }
  return{rows,total,bl};
}
function pdfBudgetRows(s,e){
  const bc=budgetCompare(s,e);if(!bc.has)return null;
  const rows=bc.list.map(r=>({label:r.key,v:r.actual,cls:'sub',dec:0,mid:r.budget>0?'of '+fmt(r.budget):'no budget',vd:r.budget>0?vd(r.actual-r.budget,true,'budget'):null}));
  rows.push({label:'Total',v:bc.tot.actual,cls:'total',dec:0,mid:'of '+fmt(bc.tot.budget),vd:bc.tot.budget>0?vd(bc.tot.actual-bc.tot.budget,true,'budget'):null});
  return rows;
}
function buildPdf(kind){
  const wasMasked=S.mask;S.mask=false;
  try{
    const ix=S.ix,[s,e]=range(),doc=new PdfDoc(),fl=new PdfFlow(doc),per=periodLabel(),through=fdate(ix.latest);
    const bo=S.look&&S.look.variance==='bo',legend=bo?'Blue is better for you and orange is worse. Spending above your average is orange and below is blue; income and savings above average are blue.':'Green is better for you and red is worse. Spending above your average is red and below is green; income and savings above average are green.';
    if(kind==='close'){
      const mk=closeMonthKey(),cm=closeModel(mk),st=closedStatus(S.data,ix);
      fl.title('Month-end close · '+fmonLong(cm.s),S.cur);
      fl.table(cm.items.flatMap(i=>{const t=itemStatus(i);return[{label:i.label,v:'',cls:'row',vd:{dir:t.dir,tone:t.tone,text:t.t},mid:'',dec:0},{label:i.note,v:null,cls:'check',vd:null,mid:''}]}),{headers:['','Status']});
      fl.block('Figures for the month',S.cur,[{label:'Income',v:cm.figs.income,cls:'row',dec:0},{label:'Spending',v:cm.figs.expense,cls:'row',dec:0},{label:'Surplus or deficit',v:cm.figs.income-cm.figs.expense,cls:'total',dec:0},{label:'Net worth at month-end',v:cm.figs.net,cls:'row',dec:0},{label:'Transactions',v:String(cm.figs.tx),cls:'row'}],{});
      fl.block('Closed months','Snapshots kept when you closed them',st.slice(0,14).map(x=>({label:fmonLong(x.mk+'-01')+' · closed '+new Date(x.snap.at).toLocaleDateString('en-GB'),v:'',cls:'sub',vd:{dir:x.changed?'down':'up',tone:x.changed?'bad':'good',text:x.changed?'Changed since closing':'Unchanged'}})).concat(st.length?[]:[{label:'No months closed yet',v:'',cls:'check'}]),{});
      return{bytes:pdfFinish(doc,'Month-end close '+mk,fmonLong(cm.s),through),name:'Money-status-month-end-close-'+mk+'.pdf'};
    }
    if(kind==='year'){
      const ym=yearModel(),yp=(ym.partial?'Year to date ':'Year ')+ym.y;
      fl.title('Year in review '+ym.y+(ym.partial?' (to date)':''),ym.hasPrev?'Compared with the same period last year':'There is no earlier year to compare with');
      fl.para(bo?'Blue is better for you and orange is worse. Spending above last year is orange and below is blue; income and savings above last year are blue.':'Green is better for you and red is worse. Spending above last year is red and below is green; income and savings above last year are green.');
      fl.table(pdfRows(ym.rows),{headers:['Amount','Against last year']});
      fl.block('Where the money went',S.cur+' · biggest categories',ym.catRows,{mid:true,headers:['Spent','Against last year','Share']});
      fl.block('Month by month',S.cur,ym.months,{mid:true,headers:['Income','Result','Spending']});
      fl.block('Largest single payments',S.cur,ym.big,{headers:['Amount']});
      fl.para('Amounts are converted at the exchange rates in your export unless you entered your own monthly rates. Transfers between accounts, investment purchases, loan principal and card payments are not counted as income or spending.',{gap:0});
      return{bytes:pdfFinish(doc,'Year in review '+ym.y,yp,through),name:'Money-status-year-in-review-'+ym.y+'.pdf'};
    }
    if(kind==='summary'){
      const b=balances(S.data,e,ix),a=actual(S.data,s,e,ix),bl=baseline(s),f=pace(s,e),V=(x,low)=>bl?vd(x,low,'avg'):null;
      fl.title('Financial summary',`${per} · ${S.cur}`);
      fl.para(legend);
      fl.table(pdfRows([
        ['Net worth as of '+fdate(b.asOf),b.networth,'total'],['Total assets',b.assets],['Total liabilities',b.debt],['Cash and bank',b.cash],
        ['Income',a.income,'row',V(a.income-(bl?bl.income*f:0),false)],['Spending',a.expense,'row',V(a.expense-(bl?bl.expense*f:0),true)],
        ['Surplus or deficit',a.surplus,'row',V(a.surplus-(bl?(bl.income-bl.expense)*f:0),false)],['Savings rate',pct(a.savingsRate),'row',ptsd(a.savingsRate,bl)]]),{headers:['Amount','Against your average']});
      for(const k of ['income','position','cash','ratios']){const m=reportModel(k,s,e);fl.block(m.title,m.sub,pdfRows(m.rows),{headers:k==='ratios'?['Value','Rule of thumb']:m.rows.some(r=>r[3])?['Amount','Against your average']:null});}
      const sp=spendingModel(s,e);fl.block('Spending by category',`${per} · ${S.cur}`,sp.rows,{mid:true,headers:['Amount','Against your average','Share']});
      const br=pdfBudgetRows(s,e);if(br)fl.block('Budget and actual',`${per} · ${S.cur}`,br,{mid:true,headers:['Spent','Against budget','Budget']});
      fl.para('The average is your last three full months before this period, scaled to the days counted. Amounts are converted at the exchange rates in your export unless you entered your own monthly rates. Transfers between accounts, investment purchases, loan principal and card payments are not counted as income or spending.',{gap:0});
      return{bytes:pdfFinish(doc,'Financial summary '+per,per,through),name:'Money-status-summary-'+periodSlug(s,e)+'.pdf'};
    }
    const m=reportModel(kind,s,e);
    fl.title(m.title,m.sub);
    if(m.bl!==undefined)fl.para(legend);
    fl.table(pdfRows(m.rows),{headers:kind==='ratios'?['Value','Rule of thumb']:m.rows.some(r=>r[3])?['Amount','Against your average']:null});
    if(m.note)fl.para(m.note,{gap:0});
    return{bytes:pdfFinish(doc,m.title+' '+per,per,through),name:'Money-status-'+({position:'balance-sheet',income:'income-statement',cash:'cash-flow',ratios:'financial-ratios'}[kind]||kind)+'-'+periodSlug(s,e)+'.pdf'};
  }finally{S.mask=wasMasked}
}
const periodSlug=(s,e)=>S.per.mode==='month'?s.slice(0,7):S.per.mode==='year'?String(S.per.y):s+'_to_'+e;

/* ---- saving the file wherever the page is running ---- */
const isFramed=()=>{try{return window.top!==window.self}catch(e){return true}};
const savePdf=(bytes,filename)=>saveFile(new Blob([bytes],{type:'application/pdf'}),filename,'PDF');
async function exportPdf(kind){
  try{const r=buildPdf(kind);await savePdf(r.bytes,r.name)}catch(e){toast('The PDF could not be created: '+e.message)}
}

const clampN=(x,a,b)=>Math.min(b,Math.max(a,x));
const HEX=/^#[0-9a-f]{6}$/i;
function h2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function rgb2h(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clampN(v,0,255)).toString(16).padStart(2,'0')).join('')}
function h2hsl(hex){

  if(d){s=d/(1-Math.abs(2*l-1));h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}

function hsl2h(h,s,l){
  h=((h%360)+360)%360;const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2;

  return rgb2h((r+m)*255,(g+m)*255,(b+m)*255);

function relLum(hex){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)},[r,g,b]=h2rgb(hex);return .2126*f(r)+.7152*f(g)+.0722*f(b)}

/* Builds every colour and size from a template plus the person's own choices,
   and always keeps text readable whatever they pick. */
function lookTokens(look,dark){
  const P=PRESETS[look.preset]||PRESETS.ledger,t={};
  const rawPanel=HEX.test(look.panel)?look.panel:P.panel;
  let[h,s,l]=h2hsl(rawPanel);if(l>.22)l=.16;s=clampN(s,0,.7);
  const panel=hsl2h(h,s,l),s1=clampN(s*.5,.04,.3),acc0=HEX.test(look.accent)?look.accent:P.accent;
  if(!dark){
    t['--bg']=hsl2h(h,s1,.96);t['--surface']='#ffffff';t['--soft']=hsl2h(h,s1,.93);t['--line']=hsl2h(h,s1*.9,.88);
    t['--ink']=hsl2h(h,clampN(s,.15,.45),.15);t['--muted']=hsl2h(h,.14,.4);
    t['--navy']=panel;t['--navy2']=hsl2h(h,s,clampN(l+.07,0,.4));
    const acc=fitColor(acc0,'#ffffff',4.5,false);
    t['--blue']=acc;t['--teal']=fitColor(P.teal,'#ffffff',3,false);t['--violet']=fitColor(P.violet,'#ffffff',3,false);
    t['--on-accent']=contrastRatio(acc,'#ffffff')>=contrastRatio(acc,'#0b1322')?'#ffffff':'#0b1322';
  }else{
    const surf=hsl2h(h,s1,.115),nav=hsl2h(h,s,l*.62);
    t['--bg']=hsl2h(h,s1,.075);t['--surface']=surf;t['--soft']=hsl2h(h,s1,.16);t['--line']=hsl2h(h,s1,.22);
    t['--ink']=hsl2h(h,.3,.92);t['--muted']=hsl2h(h,.16,.68);
    t['--navy']=nav;t['--navy2']=hsl2h(h,s,l*.62+.07);
    const acc=fitColor(acc0,surf,4.5,true);
    t['--blue']=acc;t['--teal']=fitColor(P.teal,surf,3.5,true);t['--violet']=fitColor(P.violet,surf,3.5,true);
    t['--on-accent']=contrastRatio(acc,'#ffffff')>=contrastRatio(acc,'#0b1322')?'#ffffff':'#0b1322';
  }
  t['--hero-line']=fitColor(acc0,t['--navy'],5,true);
  if(look.variance==='bo'){
    if(!dark)Object.assign(t,{'--good-bg':'#dbeafe','--good-fg':'#1d4ed8','--bad-bg':'#ffe8d1','--bad-fg':'#9a4506','--green':'#1d4ed8','--red':'#c2570c'});
    else Object.assign(t,{'--good-bg':'#1a2c50','--good-fg':'#9ec0ff','--bad-bg':'#3b2610','--bad-fg':'#f5b27a','--green':'#7fa8ff','--red':'#f59e5b'});
    Object.assign(t,{'--hero-up':'#93c5fd','--hero-down':'#fdba74'});
  }
  if(look.density==='compact')Object.assign(t,{'--pad':'14px','--rowpad':'8px','--gap':'14px'});
  if(look.radius==='sharp')Object.assign(t,{'--r':'4px','--rs':'3px'});
  else if(look.radius==='round')Object.assign(t,{'--r':'20px','--rs':'14px'});
  if(FONTS[look.font]&&FONTS[look.font].css)t['--serif']=FONTS[look.font].css;
  return t;
}

/* ---- pasted exchange rates ---- */
function parseRates(text){
  const out={},bad=[],MN={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    let y,m,rest,x;
    if(x=line.match(/^(\d{4})[-\/.](\d{1,2})(?:[-\/.]\d{1,2})?[\s,;:=\t]+(.+)$/)){y=+x[1];m=+x[2];rest=x[3]}
    else if(x=line.match(/^(\d{1,2})[-\/.](\d{4})[\s,;:=\t]+(.+)$/)){m=+x[1];y=+x[2];rest=x[3]}
    else if(x=line.match(/^([A-Za-z]{3,9})\.?[\s,\-]*(\d{4})[\s,;:=\t]+(.+)$/)){m=MN[x[1].toLowerCase().slice(0,3)];y=+x[2];rest=x[3]}
    let n=rest===undefined?'':String(rest).trim().split(/\s+/)[0];
    if(n.includes('.')&&n.includes(','))n=n.replace(/,/g,'');else if(n.includes(','))n=n.replace(',','.');
    const v=parseFloat(n);
    if(m>=1&&m<=12&&y>=1990&&y<=2100&&v>0&&Number.isFinite(v))out[y+'-'+String(m).padStart(2,'0')]=v;else bad.push(line);
  }
  return{rates:out,bad};
}

     if(!keys.length){$('pr-note').textContent='No months could be read. Use a month, then a rate, on each line.';return}
     let n=0;keys.forEach(k=>{const el=document.querySelector(`[data-fx="${cur}|${k}"]`);if(el){el.value=r.rates[k];n++}});

   }}]);
}

/* ---- reconcile against Moneydance ---- */
function reconcileCompare(cur,date,nw,month,inc,sp){
  const ix=S.ix,rows=[],add=(label,md,app)=>{const diff=app-md,tol=Math.max(1,Math.abs(md)*.001);rows.push({label,md,app,diff,ok:Math.abs(diff)<=tol})};
  if(nw!==null&&Number.isFinite(nw)){const b=balances(S.data,date,ix);add('Net worth as of '+fdate(date>ix.latest?ix.latest:date),nw,fromBase(b.networth,cur,date))}
  if(month&&(Number.isFinite(inc)||Number.isFinite(sp))){
    const s=month+'-01',e=endMonth(s),a=actual(S.data,s,e,ix);
    if(Number.isFinite(inc))add('Income in '+fmonLong(s),inc,fromBase(a.income,cur,e));
    if(Number.isFinite(sp))add('Spending in '+fmonLong(s),sp,fromBase(a.expense,cur,e));
  }
  return rows;
}

/* ---- plan file (save on one device, load on another) ---- */
async function saveFile(blob,filename,what='file'){
  let dl=null;
  if(window.claude&&typeof window.claude.use==='function'){try{dl=await window.claude.use('downloads')}catch(e){dl=null}}
  if(dl){
    try{await dl.save({filename,data:blob});toast('Saved '+filename+'.')}
    catch(e){if(!(e&&e.code==='declined'))toast('The '+what+' could not be saved here: '+((e&&e.message)||'not available')+'.')}
    return;
  }
  if(isFramed()){toast('Saving files is not available in this view. Open the app from its own address to save files.');return}
  const file=new File([blob],filename,{type:blob.type});
  const touch=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
  if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast('Ready: '+filename+'. Look in your Downloads.');
}
function planPayload(withLook){
  return{app:'money-status',kind:'plan',v:1,savedAt:new Date().toISOString(),plan:S.plan,targets:S.targets,...(withLook?{look:S.look}:{})};
}
async function buildPlanFile(withLook,password){
  const text=JSON.stringify(planPayload(withLook));
  if(!password)return text;
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await CR.derive(password,salt),o=await CR.enc(key,text);
  return JSON.stringify({app:'money-status',kind:'plan',v:1,enc:true,salt:b64(salt),iv:b64(o.iv),ct:b64(o.ct)});
}
async function readPlanFile(text,password){
  const obj=JSON.parse(text);
  if(!obj||obj.app!=='money-status'||obj.kind!=='plan')throw new Error('This is not a Money status plan file.');
  if(obj.enc){
    if(!password)return{needsPassword:true};
    try{const key=await CR.derive(password,unb64(obj.salt));return{payload:JSON.parse(await CR.dec(key,{iv:unb64(obj.iv),ct:unb64(obj.ct)}))}}
    catch(e){throw new Error('That password did not open the file.')}
  }
  return{payload:obj};
}
function planSummary(p){
  const pl=p.plan||{};

/* ---- repeating payments ---- */
function activeRecurring(){return detectRecurring().filter(r=>!r.ignored)}
/* ---- debts ---- */
function amortize(balance,apr,pay){
  if(!(balance>0))return{months:0,interest:0};
  if(!(pay>0))return null;
  const r=apr/1200;let b=balance,m=0,interest=0;
  if(r>0&&pay<=b*r)return{never:true};
  while(b>0.005&&m<1200){const i=b*r;interest+=i;b=b+i-pay;m++;if(b<0)b=0}
  return{months:m,interest};
}
function loanList(){
  const ix=S.ix,b=balances(S.data,ix.latest,ix);
  return b.rows.filter(a=>a.group==='Liability'&&(a.type==='LIABILITY'||a.type==='LOAN')&&a.native<-0.005).map(a=>{
    const pays={};for(const l of ix.good)if(l.account===a.id&&l.amount>0){const k=l.date.slice(0,7);pays[k]=(pays[k]||0)+l.amount}
    const recent=Object.keys(pays).sort().slice(-6).map(k=>pays[k]);
    return{id:a.id,name:a.label,cur:a.currency,balance:-a.native,detected:recent.length?median(recent):0};
  });
}
function pDebt(){
  const ls=loanList(),L=S.ix.latest;
  const card=l=>{
    const cfg=S.plan.loans[l.id]||{},apr=+cfg.apr||0,pay=cfg.payment!=null&&cfg.payment!==''?+cfg.payment:l.detected,extra=+cfg.extra||0;
    const base=amortize(l.balance,apr,pay),fast=extra>0?amortize(l.balance,apr,pay+extra):null;
    let body;
    if(!(pay>0))body='<p class="sub">Add your monthly payment to see a payoff date.</p>';
    else if(base&&base.never)body=`<p class="sub" style="color:var(--red)">A payment of ${fmtIn(pay,l.cur,0)} does not cover the interest, so the balance never falls.</p>`;
    else body=`<p class="sub">At ${fmtIn(pay,l.cur,0)} a month${apr?' and '+apr+'% a year':''}: paid off <strong>${esc(fmonLong(addMonths(monthStart(L),base.months)))}</strong> (${base.months} months), interest about ${fmtIn(base.interest,l.cur,0)}.</p>${fast&&!fast.never?`<p class="sub">With ${fmtIn(extra,l.cur,0)} extra a month: ${esc(fmonLong(addMonths(monthStart(L),fast.months)))}, <span class="vchip good">▼ ${base.months-fast.months} months sooner</span> <span class="vchip good">▼ ${fmtIn(base.interest-fast.interest,l.cur,0)} less interest</span></p>`:''}`;
    return`<article class="goal"><div class="head" style="margin-bottom:6px"><h3>${esc(l.name)}</h3>${pill(l.cur,'')}</div><div class="goal-amt">${fmtIn(l.balance,l.cur,0)} <small class="muted">owed</small></div>${body}<p class="footnote">${cfg.payment!=null&&cfg.payment!==''?'Payment set by you.':l.detected>0?'Payment taken from your recent history.':''}</p><button class="btn small" data-loan="${esc(l.id)}">Edit terms</button></article>`;
  };
  $('ptab').innerHTML=`<section class="card"><div class="head"><div><h2>Debt payoff</h2><p class="sub">Loans and other debts with a balance. Add the interest rate and payment to see when each is paid off, and what extra payments would save.</p></div></div>${ls.length?`<div class="goals">${ls.map(card).join('')}</div>`:'<div class="empty">No loans with a balance found. Credit cards are not included here.</div>'}</section>`;
  document.querySelectorAll('[data-loan]').forEach(b=>b.onclick=()=>editLoan(ls.find(x=>x.id===b.dataset.loan)));

/* ---- year in review (PDF) ---- */
function yearBounds(){
  const ix=S.ix,y=S.per.mode==='year'?S.per.y:+ix.latest.slice(0,4),s=y+'-01-01',end=y+'-12-31',e=end>ix.latest?ix.latest:end;
  return{y,s,e,partial:end>ix.latest};
}
function yearModel(){
  const ix=S.ix,d=S.data,{y,s,e,partial}=yearBounds(),ps=shiftYear(s,-1),pe=shiftYear(e,-1),hasPrev=pe>=ix.earliest;
  const a=actual(d,s,e,ix),pa=hasPrev?actual(d,ps,pe,ix):null,b1=balances(d,e,ix),b0=balances(d,addDays(s,-1),ix),bp=hasPrev?balances(d,pe,ix):null;
  const V=(cur,prev,low)=>pa&&prev!==undefined?vd(cur-prev,low,'yoy'):null;
  const rows=[['Income',a.income,'row',pa?V(a.income,pa.income,false):null],['Spending',a.expense,'row',pa?V(a.expense,pa.expense,true):null],['Surplus or deficit',a.surplus,'total',pa?V(a.surplus,pa.surplus,false):null],
    ['Savings rate',pct(a.savingsRate),'check',pa&&a.savingsRate!==null&&pa.savingsRate!==null?(()=>{const pts=(a.savingsRate-pa.savingsRate)*100;return{dir:Math.abs(pts)<.05?'flat':pts>0?'up':'down',tone:Math.abs(pts)<.05?'flat':pts>0?'good':'bad',text:Math.abs(pts)<.05?'Unchanged':Math.abs(pts).toFixed(1)+' pts '+(pts>0?'above':'below')+' last year'}})():null],
    ['Net worth at '+fdate(e),b1.networth,'total',bp?V(b1.networth,bp.networth,false):null],['Net worth change over the year',b1.networth-b0.networth,'row',null]];
  const cats={},pcats={};
  for(const l of a.exLines){const k=catKey(l);cats[k]=(cats[k]||0)+l.value}
  if(pa)for(const l of pa.exLines){const k=catKey(l);pcats[k]=(pcats[k]||0)+l.value}
  const catRows=Object.entries(cats).sort((x,y)=>y[1]-x[1]).slice(0,14).map(([k,v])=>({label:k,v,cls:'sub',dec:0,mid:pct(a.expense>0?v/a.expense:null),vd:pa?vd(v-(pcats[k]||0),true,'yoy'):null}));
  const months=[];for(let m=monthStart(s);m<=e;m=addMonths(m,1)){const x=actual(d,m,endMonth(m)>e?e:endMonth(m),ix),sur=x.income-x.expense;months.push({label:fmonLong(m),v:x.income,cls:'sub',dec:0,mid:fmt(x.expense),vd:{dir:sur>=0?'up':'down',tone:Math.abs(conv(sur))<.5?'flat':sur>0?'good':'bad',text:fmt(Math.abs(sur))+(sur>=0?' saved':' overspent')}})}
  const big=a.exLines.slice().sort((p,q)=>q.value-p.value).slice(0,6).map(l=>({label:(l.description||'(no description)')+' · '+fdate(l.date),v:l.value,cls:'sub',dec:0}));
  return{y,s,e,partial,hasPrev,rows,catRows,months,big,a};
}

/* ---- month-end close ---- */
const latestFullMonth=()=>{const L=S.ix.latest;let m=monthStart(L);if(endMonth(m)>L)m=addMonths(m,-1);return m.slice(0,7)};
const chosenMonth=()=>S.per.mode==='month'?`${S.per.y}-${String(S.per.m).padStart(2,'0')}`:null;
const closeMonthKey=()=>{const sel=chosenMonth();return sel&&endMonth(sel+'-01')<=S.ix.latest?sel:latestFullMonth()};
function monthFigs(d,ix,mk){
  const s=mk+'-01',e=endMonth(s),cap=e>ix.latest?ix.latest:e,a=actual(d,s,cap,ix),b=balances(d,e,ix);
  return{income:a.income,expense:a.expense,net:b.networth,tx:ix.txs.filter(t=>t.date>=s&&t.date<=e).length};
}
function closedStatus(d,ix){
  return Object.entries(S.plan.closes||{}).sort((x,y)=>y[0].localeCompare(x[0])).map(([mk,snap])=>{
    if(mk+'-01'>ix.latest)return{mk,snap,changed:false,diffs:[],future:true};
    const cur=monthFigs(d,ix,mk),diffs=[];
    if(Math.abs(cur.income-snap.income)>.5)diffs.push(['Income',cur.income-snap.income]);
    if(Math.abs(cur.expense-snap.expense)>.5)diffs.push(['Spending',cur.expense-snap.expense]);
    if(Math.abs(cur.net-snap.net)>.5)diffs.push(['Net worth',cur.net-snap.net]);
    if(cur.tx!==snap.tx)diffs.push(['Transactions',cur.tx-snap.tx]);
    return{mk,snap,cur,changed:diffs.length>0,diffs};
  });
}
function closeModel(mk){
  const ix=S.ix,d=S.data,s=mk+'-01',e=endMonth(s),errs=ix.errors.filter(x=>x.date>=s&&x.date<=e),base=baseCurrency(d),foreign=currencies().filter(c=>c!==base),hist=S.plan.fxh||{};
  const miss=foreign.filter(c=>!(hist[c]&&hist[c][mk])),chk=(S.plan.closeChecks||{})[mk]||{};

    {k:'fx',label:'Exchange rates entered for the month',ok:!foreign.length||!miss.length,level:'warn',note:!foreign.length?'Only one currency is in use.':miss.length?'Missing for '+miss.join(', ')+'. The export’s current rate is used instead.':'Entered for '+foreign.join(', ')+'.'},
    {k:'budget',label:'A budget is in force for the month',ok:!!budgetFor(mk),level:'warn',note:budgetFor(mk)?'Budget from '+fmonLong(budgetFor(mk).v.from+'-01')+'.':'No budget covers this month.'},
    {k:'recon',label:'Checked against Moneydance',manual:true,ok:!!chk.recon,level:'warn',note:'Use Data > Check against Moneydance, then tick this.'},

  return{mk,s,e,items,figs:monthFigs(d,ix,mk),canClose:items.filter(i=>i.level==='fail').every(i=>i.ok),snap:(S.plan.closes||{})[mk]||null};
}
function itemStatus(i){return i.ok?{t:'Pass',k:'good',tone:'good',dir:'up'}:i.level==='fail'?{t:'Fix',k:'bad',tone:'bad',dir:'down'}:{t:'Check',k:'warn',tone:'flat',dir:'flat'}}

function spark(vals,color){

  const pts=vals.map((t,i)=>Number.isFinite(t)?x(i).toFixed(1)+','+y(t).toFixed(1):null).filter(Boolean),last=pts.at(-1).split(',');
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="var(--${color})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--${color})"/></svg>`;
}

  const cx=84,cy=84,R=72,r=46;let ang=-Math.PI/2,paths='';

    else{
      const p=(rad,t)=>[(cx+rad*Math.cos(t)).toFixed(2),(cy+rad*Math.sin(t)).toFixed(2)],big=frac>.5?1:0,[x0,y0]=p(R,ang),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,ang);
      paths+=`<path class="dn dn${i}" d="M${x0} ${y0} A${R} ${R} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z"><title>${esc(k)}: ${esc(S.cur)} ${fmt(v)}</title></path>`;

  const results=q=>{

      const cats=[...new Set(ix.good.filter(l=>l.group==='Expense'||l.group==='Income').map(l=>catKey(l)))].filter(k=>k.toLowerCase().includes(t)).slice(0,5);
      cats.forEach(k=>out.push({g:'Categories',label:k,run:go('activity',()=>{S.q=k.split(' › ').pop();S.acct='';S.type='all';S.per={...S.per,mode:'all'}})}));
      ix.txs.filter(x=>x.q.includes(t)||x.cat.toLowerCase().includes(t)).slice(0,8).forEach(x=>out.push({g:'Transactions',label:x.description,sub:fdate(x.date)+' · '+(x.cat||x.kind),run:()=>txModal(x.tx)}));

  let act=0,cur=[];
  const draw=()=>{
    cur=results($('qs-in').value);act=Math.min(act,Math.max(0,cur.length-1));let g='';
    $('qs-out').innerHTML=cur.map((r,i)=>{const head=r.g!==g?`<div class="qs-g">${esc(r.g)}</div>`:'';g=r.g;return head+`<button class="row qs-r" role="option" aria-selected="${i===act}" data-qi="${i}"><div><span class="t">${esc(r.label)}</span>${r.sub?`<small>${esc(r.sub)}</small>`:''}</div></button>`}).join('')||'<div class="empty" style="padding:20px 0">Nothing found.</div>';
    document.querySelectorAll('.qs-r').forEach(b=>{b.onclick=()=>{const r=cur[+b.dataset.qi];$('modal').close();r.run()}});
  };
  $('qs-in').oninput=()=>{act=0;draw()};
  $('qs-in').onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(cur.length-1,act+1);draw();document.querySelector('.qs-r[aria-selected="true"]')?.scrollIntoView({block:'nearest'})}
    else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);draw();document.querySelector('.qs-r[aria-selected="true"]')?.scrollIntoView({block:'nearest'})}
    else if(e.key==='Enter'&&cur[act]){e.preventDefault();const r=cur[act];$('modal').close();r.run()}

const NAV={stack:[],i:-1,busy:false,t:0,perPush:false};
const navFields=()=>({page:S.page,per:{...S.per},ptab:S.ptab,report:S.report,q:S.q,acct:S.acct,type:S.type,pg:S.pg,amin:S.amin,amax:S.amax,mv:S.mv?{k:S.mv.k,a:[...S.mv.a]}:null});
const navKey=n=>JSON.stringify({page:n.page,per:n.per,ptab:n.ptab,report:n.report,q:n.q,acct:n.acct,type:n.type,pg:n.pg,amin:n.amin,amax:n.amax,mv:n.mv});
function navButtons(){
  const b=$('nav-back'),f=$('nav-fwd');if(!b)return;
  const on=!!S.data&&!S.locked;
  b.hidden=f.hidden=!on;b.disabled=NAV.i<=0;f.disabled=NAV.i>=NAV.stack.length-1;
  const mb=$('mnav-back'),mf=$('mnav-fwd');
  if(mb){$('mnav').hidden=!(on&&S.mv);mb.disabled=b.disabled;mf.disabled=f.disabled}
}
function navReset(){NAV.stack=[];NAV.i=-1;navButtons()}
function navCommit(){
  if(NAV.busy||!S.data||S.locked)return;
  const cur=navFields(),top=NAV.stack[NAV.i];
  if(top&&navKey(top)===navKey(cur)){navButtons();return}
  if(top)top.scroll=window.scrollY;
  const onlyPeriod=!!top&&navKey({...top,per:cur.per})===navKey(cur);
  if(onlyPeriod&&NAV.perPush&&NAV.i===NAV.stack.length-1&&Date.now()-NAV.t<1500)NAV.stack[NAV.i]={...cur,scroll:top.scroll};
  else{NAV.stack=NAV.stack.slice(0,NAV.i+1);NAV.stack.push({...cur,scroll:0});NAV.i++;NAV.perPush=onlyPeriod;if(NAV.stack.length>80){NAV.stack.shift();NAV.i--}}
  NAV.t=Date.now();navButtons();
}
function navTouch(){const t=NAV.stack[NAV.i];if(t&&!NAV.busy&&!S.mv)NAV.stack[NAV.i]={...navFields(),scroll:t.scroll}}
function navTo(j){
  if(j<0||j>=NAV.stack.length||j===NAV.i)return;
  const cur=NAV.stack[NAV.i];if(cur)cur.scroll=window.scrollY;
  NAV.busy=true;NAV.i=j;const n=NAV.stack[j];
  Object.assign(S,{page:n.page,per:{...n.per},ptab:n.ptab,report:n.report,q:n.q,acct:n.acct,type:n.type,pg:n.pg,amin:n.amin,amax:n.amax});
  S.mv=null;S.ctlOpen=false;
  if($('modal').open)$('modal').close();
  S.anim=true;render();
  if(n.mv){try{restoreMv(n.mv)}catch(e){}}
  NAV.busy=false;navButtons();
  requestAnimationFrame(()=>window.scrollTo(0,n.scroll||0));
}
const navBack=()=>navTo(NAV.i-1),navFwd=()=>navTo(NAV.i+1);
function restoreMv(mv){
  if(mv.k==='tx')txModal(mv.a[0]);
  else if(mv.k==='lines')openLines(...mv.a);
  else if(mv.k==='explain'){const[s,e]=range();explainCategory(mv.a[0],s,e)}
  else if(mv.k==='accts')openAccounts(...mv.a);
}
$('nav-back').onclick=navBack;$('nav-fwd').onclick=navFwd;$('mnav-back').onclick=navBack;$('mnav-fwd').onclick=navFwd;
$('modal').addEventListener('close',()=>{
  if($('modal').open||NAV.busy||!S.mv)return;
  S.mv=null;
  const cur=NAV.stack[NAV.i];
  if(cur&&cur.mv){
    const prev=NAV.stack[NAV.i-1],base={...cur,mv:null};
    if(prev&&navKey(prev)===navKey(base)){NAV.i--;navButtons()}else navCommit();
  }
});
window.addEventListener('keydown',e=>{
  if(S.locked||!S.data)return;
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();navBack()}

window.addEventListener('mouseup',e=>{
  if(S.locked||!S.data)return;
  if(e.button===3){e.preventDefault();navBack()}else if(e.button===4){e.preventDefault();navFwd()}

/* ---- balance sheet groups and account drill-downs ---- */
function bsKey(a){
  if(a.group==='Asset'){if(isCash(a))return'Asset|Cash and bank';if(a.type==='SECURITY'||a.type==='INVESTMENT')return'Asset|Investments';return'Asset|'+(a.main||'Other assets')}
  if(a.group==='Liability'){if(a.type==='CREDIT CARD')return'Liability|Credit cards';return'Liability|'+(a.main||'Other liabilities')}
  return null;
}
function bsRows(b){
  const A={},Lb={};
  for(const r of b.rows){
    if(r.value===null||(Math.abs(r.native)<=.005&&Math.abs(r.value)<=.005))continue;
    const k=bsKey(r);if(!k)continue;
    if(k.startsWith('Asset'))A[k]=(A[k]||0)+r.value;else Lb[k]=(Lb[k]||0)-r.value;
  }
  const order=(o,first)=>Object.entries(o).sort((x,y)=>{const fx=first.indexOf(x[0]),fy=first.indexOf(y[0]);return(fx<0?99:fx)-(fy<0?99:fy)||Math.abs(y[1])-Math.abs(x[1])});
  const sub=e=>e.map(([k,v])=>[k.split('|')[1],v,'sub',null,'',k]);
  return[['Assets',null,'head'],...sub(order(A,['Asset|Cash and bank','Asset|Investments'])),['Total assets',b.assets,'total'],
    ['Liabilities',null,'head'],...sub(order(Lb,['Liability|Credit cards'])),['Total liabilities',b.debt,'total'],['Net worth',b.networth,'total']];
}
function openAccounts(kind,key){
  const ix=S.ix,d=S.data,[s,e]=range();let title,sub,rows;
  if(kind==='bs'){
    const b=balances(d,e,ix),sec=key.split('|')[0],sg=sec==='Liability'?-1:1;
    title=key.split('|')[1];sub='As of '+fdate(b.asOf);
    rows=b.rows.filter(a=>bsKey(a)===key&&a.value!==null&&(Math.abs(a.native)>.005||Math.abs(a.value)>.005)).map(a=>({code:a.code,name:pathOf(a).join(' › '),cur:a.currency,native:sg*a.native,value:sg*a.value}));
  }else{
    const parts=key.split('|'),cap=e>ix.latest?ix.latest:e,a=actual(d,s,cap,ix),inc=parts[0]==='inc';
    const lines=(inc?a.incLines:a.exLines).filter(l=>(l.main||'Uncategorised')===parts[1]&&(parts[2]==null||(l.level2||l.label)===parts[2])),g={};
    for(const l of lines){const k=l.catId||l.account;(g[k]??={code:l.code,name:pathOf(l).join(' › '),cur:l.a.currency,native:0,value:0})}
    for(const l of lines){const k=l.catId||l.account;g[k].native+=inc?-l.amount:l.amount;g[k].value+=inc?-l.value:l.value}
    title=parts.slice(1).join(' › ');sub=periodLabel();rows=Object.values(g);

   <div class="list"><div class="row"><div><span class="t">Total</span></div><div class="amt"><strong>${fmt(total,2)}</strong></div></div>${rows.map(r=>`<div class="row"><div><span class="t">${r.code?esc(r.code)+' · ':''}${esc(r.name)}</span><small>${esc(r.cur)}${r.cur!==S.cur?' · '+natf(r.native,2,2)+' '+esc(r.cur):''}</small></div><div class="amt">${fmt(r.value,2)}</div></div>`).join('')}</div>`);
  S.mv={k:'accts',a:[kind,key]};navCommit();

function openLines(mn,kn,ln){
  const[s,e]=range(),ix=S.ix,cap=e>ix.latest?ix.latest:e,a=actual(S.data,s,cap,ix);
  const ls=a.exLines.filter(l=>(l.main||'Uncategorised')===mn&&(l.level2||l.label)===kn&&l.label===ln).sort((x,y)=>y.date.localeCompare(x.date));

function mergePlans(cur,inc){

  for(const c in I.fxh)out.fxh[c]={...(out.fxh[c]||{}),...I.fxh[c]};
  const bk=new Map(out.budgets.map(b=>[b.from,b]));I.budgets.forEach(b=>bk.set(b.from,b));out.budgets=[...bk.values()].sort((a,b)=>a.from.localeCompare(b.from));
  const gs=new Map(out.goals.map(g=>[g.id,g]));I.goals.forEach(g=>gs.set(g.id,g));out.goals=[...gs.values()];
  const cmm=new Map((out.commitments||[]).map(c=>[c.id,c]));(I.commitments||[]).forEach(c=>cmm.set(c.id,c));out.commitments=[...cmm.values()];
  const cl=new Map((out.customLines||[]).map(c=>[c.key,c]));(I.customLines||[]).forEach(c=>cl.set(c.key,c));out.customLines=[...cl.values()];
  const dflFc=defaultPlan().fc;if(JSON.stringify({...out.fc,events:[]})===JSON.stringify({...dflFc,events:[]}))out.fc={...out.fc,...I.fc,events:out.fc.events};
  const ev=[...out.fc.events];for(const e of I.fc.events)if(!ev.some(x=>x.name===e.name&&x.month===e.month&&x.amount===e.amount&&x.cur===e.cur))ev.push(e);out.fc.events=ev;

}

const STATUSES=['Active','Paused','Review'],PRIOS=['High','Medium','Low'];
const CLS_ORDER={inc:0,needs:1,wants:2,other:3},CLS_NAME={inc:'Income',needs:'Needs',wants:'Wants',other:'Other spending'};
const addMonthKeepDay=(d,n,day)=>{const a=D(d),t=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+n,1)),last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(day,last));return iso(t)};
function commitDates(c,from,to){
  const out=[];if(!c.start)return out;const end=c.end||'9999-12-31',day=+c.start.slice(8,10);let d=c.start,i=0,guard=0;
  while(d<=to&&d<=end&&guard++<1200){
    if(d>from)out.push(d);
    if(c.freq==='once')break;
    if(c.freq==='weekly')d=addDays(d,7);else{const n=FREQ_M[c.freq]||1;i+=n;d=addMonthKeepDay(c.start,i,day)}
  }
  return out;
}
const commitBase=(c,date)=>{const r=fxAt(S.data,c.cur,date);return r===null?0:c.amount*r};
const commitSrc=t=>t==='Income'?'income':t==='P&L Expense'?'spending':'transfer';
const commitSign=t=>t==='Income'?1:-1;
const adoptedKeys=()=>new Set((S.plan.commitments||[]).filter(c=>c.srcKey&&c.status!=='Review').map(c=>c.srcKey));
const completeMonthsList=n=>{const ix=S.ix,L=ix.latest,cm=[];for(let m=monthStart(L);cm.length<n&&endMonth(m)>=ix.earliest;m=addMonths(m,-1))if(endMonth(m)<=L)cm.push(m);return cm};
function expenseCategories(){
  const seen=new Map();
  for(const a of S.data.accounts)if(a.leaf&&a.group==='Expense'){const k=catKey(a);if(!seen.has(k))seen.set(k,{key:k,cls:S.plan.classMap[k]||defaultClass(a),name:NW.test(a.main)?(a.level2||a.label):(a.main||'Uncategorised')})}
  return[...seen.values()].sort((x,y)=>CLS_ORDER[x.cls]-CLS_ORDER[y.cls]||x.name.localeCompare(y.name));
}
function editVersionKey(){return S.plan.bfrom||(budgetFor(S.ix.latest.slice(0,7))?budgetFor(S.ix.latest.slice(0,7)).v.from:S.ix.latest.slice(0,7))}
function ensureEditVersion(){
  const mk=editVersionKey();let v=S.plan.budgets.find(x=>x.from===mk);
  if(!v){const prev=[...S.plan.budgets].filter(x=>x.from<mk).sort((a,b)=>b.from.localeCompare(a.from))[0];
    v={from:mk,cur:prev?prev.cur:S.cur,amounts:prev?{...prev.amounts}:{}};S.plan.budgets.push(v);S.plan.budgets.sort((a,b)=>a.from.localeCompare(b.from))}
  return v;
}

/* One planned line per category: your amount if you typed one, otherwise the recent average */
function planModel(fromKey){
  const ix=S.ix,d=S.data,L=ix.latest,pl=S.plan;
  const cm=completeMonthsList(3),n=cm.length,st=cm.map(monthStat),avg=f=>n?sum(st,f)/n:0;
  const verObj=fromKey?(()=>{const v=pl.budgets.find(x=>x.from===fromKey);if(!v)return null;const r=fxAt(d,v.cur,L);if(r===null)return null;const out={};for(const[k,a]of Object.entries(v.amounts))out[k]=a*r;return{v,out}})():budgetFor(L.slice(0,7));
  const man=k=>verObj&&verObj.out[k]!==undefined?verObj.out[k]:null;
  const cats=new Map(),ensure=(key,name,cls,main)=>{if(!cats.has(key))cats.set(key,{key,name,cls,main,accts:[],custom:false});return cats.get(key)};
  for(const a of d.accounts){
    if(!a.leaf)continue;
    if(a.group==='Expense'){const key=catKey(a);ensure(key,NW.test(a.main)?(a.level2||a.label):(a.main||'Uncategorised'),pl.classMap[key]||defaultClass(a),a.main).accts.push(a)}
    else if(a.group==='Income'){const key='Income › '+(a.main||'Income');ensure(key,a.main||'Income','inc',a.main||'Income').accts.push(a)}
  }
  for(const c of pl.customLines||[]){const x=ensure(c.key,c.name,c.cls,'');x.custom=true}
  const lines=[...cats.values()].map(c=>{
    const trailing=c.cls==='inc'?avg(x=>x.incMain[c.main]||0):avg(x=>x.byCat[c.key]||0);
    const acc=c.accts.map(a=>({id:a.id,code:a.code,name:a.label,path:pathOf(a).join(' › '),trailing:c.cls==='inc'?0:avg(x=>x.byAcct[a.id]||0),manual:man('@'+a.id)}));
    const manual=man(c.key),anyA=acc.some(a=>a.manual!==null);
    const planned=manual!==null?manual:anyA?sum(acc,a=>a.manual!==null?a.manual:a.trailing):trailing;
    return{...c,trailing,manual,planned,acc,basis:manual!==null?'yours':anyA?'accounts':'average'};
  }).sort((x,y)=>CLS_ORDER[x.cls]-CLS_ORDER[y.cls]||x.name.localeCompare(y.name));
  const y=L.slice(0,4),last=cm[0];let ytdM=0;const ytdA={};
  if(last&&last.slice(0,4)===y){
    ytdM=+last.slice(5,7);const a=actual(d,y+'-01-01',endMonth(last),ix);
    for(const l of a.exLines){const k=catKey(l);ytdA[k]=(ytdA[k]||0)+l.value;const id='@'+(l.catId||l.account);ytdA[id]=(ytdA[id]||0)+l.value}
    for(const l of a.incLines){const k='Income › '+(l.main||'Income');ytdA[k]=(ytdA[k]||0)-l.value}
  }
  const tot=cls=>sum(lines.filter(l=>l.cls===cls),l=>l.planned);
  return{lines,cm,n,ver:verObj&&verObj.v,ytdM,ytdA,tot:{inc:tot('inc'),needs:tot('needs'),wants:tot('wants'),other:tot('other')},window:n?fmon(cm.at(-1))+' to '+fmon(cm[0]):'no full month yet'};
}
const planExpenses=PM=>PM.tot.needs+PM.tot.wants+PM.tot.other;

/* ---- scenarios: Base, Lean, Stretch ---- */
const SCEN_DEF={base:{label:'Base',inc:0,needs:0,wants:0,savings:0,debt:0,assets:0},cautious:{label:'Lean',inc:-5,needs:-5,wants:-30,savings:-20,debt:0,assets:0},optimistic:{label:'Stretch',inc:5,needs:0,wants:-10,savings:20,debt:0,assets:0}};
function scenFactors(fc){
  const out={};
  for(const[k,d]of Object.entries(SCEN_DEF)){
    const x=(fc.scen||{})[k]||{},g=f=>{let v=x[f];if(v==null&&x.sp!=null&&(f==='needs'||f==='wants'))v=x.sp;return v!=null?+v:d[f]};
    const p={inc:g('inc'),needs:g('needs'),wants:g('wants'),savings:g('savings'),debt:g('debt'),assets:g('assets')};
    out[k]={label:d.label,...Object.fromEntries(Object.entries(p).map(([a,b])=>[a,1+b/100])),pct:p,
      note:k==='base'?'Your plan as it is':'Income '+(p.inc>=0?'+':'')+p.inc+'%, needs '+(p.needs>=0?'+':'')+p.needs+'%, wants '+(p.wants>=0?'+':'')+p.wants+'%, savings '+(p.savings>=0?'+':'')+p.savings+'%'};
  }
  return out;
}
const eventTreat=e=>e.treat||(e.amount>=0?'Income':'P&L Expense');
const eventOn=(e,sc)=>(e.status||'Active')==='Active'&&(!e.scenario||e.scenario==='all'||e.scenario===sc);

/* ---- upcoming payments: repeating found in history plus your commitments ---- */
function upcomingAll(days,detected,commits){
  const L=S.ix.latest,end=addDays(L,days),out=upcoming(detected,days).map(u=>({...u,mine:false}));
  for(const c of commits)for(const d of commitDates(c,L,end))out.push({desc:c.desc,date:d,amt:commitSign(c.treat)*commitBase(c,d),src:commitSrc(c.treat),every:c.freq,mine:true,cat:c.cat});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---- the forecast, category by category ---- */
function outlook(){
  const ix=S.ix,d=S.data,L=ix.latest,b=balances(d,L,ix),fc=S.plan.fc,fcur=fc.cur||S.cur;
  const PM=planModel(),SC=scenFactors(fc),scKey=SC[fc.scenario]?fc.scenario:'base',sc=SC[scKey],H=fc.horizon===24?24:12;
  const adopted=adoptedKeys(),detected=activeRecurring().filter(r=>!adopted.has(r.key));
  const commits=(S.plan.commitments||[]).filter(c=>c.status==='Active');
  const up30=upcomingAll(30,detected,commits);
  const cm=PM.cm;let inc=0,sp=0;for(const m of cm){const a=monthStat(m);inc+=a.income;sp+=a.expense}
  const avgInc=cm.length?inc/cm.length:0,avgSp=cm.length?sp/cm.length:0;
  const ovInc=fc.income!=null&&fc.income!==''?toBase(+fc.income,fcur,L):null,ovSp=fc.spend!=null&&fc.spend!==''?toBase(+fc.spend,fcur,L):null;
  const planInc=PM.tot.inc,planExp=planExpenses(PM);
  const kInc=ovInc!==null&&planInc>0?ovInc/planInc:1,kExp=ovSp!==null&&planExp>0?ovSp/planExp:1;
  const incBase=ovInc!==null&&planInc<=0?ovInc:planInc*kInc,spBase=ovSp!==null&&planExp<=0?ovSp:planExp*kExp;
  const manualLines=PM.lines.filter(l=>l.basis!=='average').length;
  const incSrc=ovInc!==null?'Your override':manualLines&&PM.lines.some(l=>l.cls==='inc'&&l.basis!=='average')?'Your plan, rest from the average':cm.length?'Average of the last '+cm.length+' full month'+(cm.length>1?'s':''):'No full month yet';
  const spSrc=ovSp!==null?'Your override':manualLines?'Your plan by category, rest from the average':cm.length?'Average of the last '+cm.length+' full month'+(cm.length>1?'s':''):'No full month yet';
  const goals=(S.plan.goals||[]).filter(g=>(g.status||'Active')==='Active'&&g.monthly>0),goalsMonthly=sum(goals,g=>toBase(g.monthly,g.cur,L)||0);
  const detTr=sum(detected.filter(r=>r.src==='transfer'),r=>r.every==='monthly'?r.amt:r.amt/3);
  const factorOf=cls=>cls==='inc'?sc.inc*kInc:(cls==='wants'?sc.wants:sc.needs)*kExp;
  const trOut=detTr,incScen=incBase*sc.inc,spScen=planExp>0?(PM.tot.needs*sc.needs+PM.tot.wants*sc.wants+PM.tot.other*sc.needs)*kExp:spBase*sc.needs;
  const reserve=fc.reserve?toBase(+fc.reserve,fcur,L)||0:0,avail=b.cash-b.cards;
  const mtd=actual(d,monthStart(L),L,ix),mtdCat={};
  for(const l of mtd.exLines){const k=catKey(l);mtdCat[k]=(mtdCat[k]||0)+l.value}
  for(const l of mtd.incLines){const k='Income › '+(l.main||'Income');mtdCat[k]=(mtdCat[k]||0)-l.value}
  const mEnd=endMonth(L),curMk=L.slice(0,7),cols=[];
  if(mEnd>L)cols.push({k:0,month:mEnd,label:'Rest of '+fmon(L),mk:curMk});
  for(let k=1;k<=H;k++){const m=addMonths(monthStart(L),k);cols.push({k,month:endMonth(m),label:fmon(m),mk:m.slice(0,7)})}
  const rows=new Map(),row=(key,label,grp,link)=>{if(!rows.has(key))rows.set(key,{key,label,grp,link,vals:cols.map(()=>0)});return rows.get(key)};
  const evs=(fc.events||[]).filter(e=>eventOn(e,scKey)),pmCache={},vers=[...S.plan.budgets].sort((a,b)=>b.from.localeCompare(a.from));
  const pmFor=mk=>{const v=vers.find(x=>x.from<=mk);return v?(pmCache[v.from]??=planModel(v.from)):PM};
  cols.forEach((c,ci)=>{
    const rest=c.k===0,ms=c.mk+'-01',me=endMonth(ms),P=pmFor(c.mk);
    for(const l of P.lines){
      let v=l.planned*factorOf(l.cls);if(rest)v=Math.max(0,v-(mtdCat[l.key]||0));
      if(ovInc!==null&&planInc<=0&&l.cls==='inc')v=0;
      if(Math.abs(v)>1e-9)row(l.key,l.name,l.cls,l.key).vals[ci]=(l.cls==='inc'?1:-1)*v;
    }
    if(ovInc!==null&&planInc<=0){const v=rest?Math.max(0,incBase*sc.inc-mtd.income):incBase*sc.inc;row('inc:override','Income (your figure)','inc').vals[ci]=v}
    if(ovSp!==null&&planExp<=0){const v=rest?Math.max(0,spBase*sc.needs-mtd.expense):spBase*sc.needs;row('exp:override','Spending (your figure)','needs').vals[ci]=-v}
    for(const cmt of commits){
      for(const dd of commitDates(cmt,rest?L:addDays(ms,-1),me)){
        let amt=commitBase(cmt,dd);const t=cmt.treat;
        if(t==='Debt Principal')amt*=sc.debt;else if(t==='Asset Purchase')amt*=sc.assets;else if(t==='Savings Transfer')amt*=sc.savings;else if(t==='Income')amt*=sc.inc;else amt*=(cmt.cls==='wants'?sc.wants:sc.needs);
        if(cmt.inBaseline&&(t==='P&L Expense'||t==='Income'))continue;
        const cat=cmt.cat&&PM.lines.find(l=>l.key===cmt.cat);
        if(t==='P&L Expense'){const r=cat?row(cmt.cat,cat.name,cat.cls,cmt.cat):row('c:'+cmt.id,cmt.desc,cmt.cls==='wants'?'wants':'needs');r.vals[ci]-=amt}
        else if(t==='Income')row('c:'+cmt.id,cmt.desc,'inc').vals[ci]+=amt;
        else row('c:'+cmt.id,cmt.desc,t==='Debt Principal'?'debt':t==='Asset Purchase'?'assets':'savings').vals[ci]-=amt;
      }
    }
    if(!rest){
      for(const g of goals)row('g:'+g.id,g.name,'savings').vals[ci]-=(toBase(g.monthly,g.cur,L)||0)*sc.savings;
      if(Math.abs(detTr)>1e-9)row('det:transfers','Regular transfers found in your history','savings').vals[ci]+=detTr;
    }else{
      const trs=sum(upcoming(detected.filter(r=>r.src==='transfer'),daysBetween(L,mEnd)-1),r=>r.amt);
      if(Math.abs(trs)>1e-9)row('det:transfers','Regular transfers found in your history','savings').vals[ci]+=trs;
    }
    for(const e of evs.filter(e=>e.month===c.mk)){
      const t=eventTreat(e),val=toBase(e.amount,e.cur,c.mk+'-15')||0;
      const g=t==='Income'?'inc':t==='P&L Expense'?(e.cls==='wants'?'wants':'needs'):t==='Debt Principal'?'debt':t==='Asset Purchase'?'assets':'savings';
      row('e:'+(e.name||'event'),e.name||'One-off item',g).vals[ci]+=val;
    }
  });
  const list=[...rows.values()];
  const ORD={inc:0,needs:1,wants:2,other:3,debt:4,assets:5,savings:6};
  list.sort((x,y)=>(ORD[x.grp]-ORD[y.grp])||x.label.localeCompare(y.label));
  const pl=r=>r.grp==='inc'||r.grp==='needs'||r.grp==='wants'||r.grp==='other';
  let cash=avail,nw=b.networth;const pts=[{month:L,cash,nw,label:'Now'}],net=[],netNw=[],closing=[];
  cols.forEach((c,ci)=>{
    const dn=sum(list,r=>r.vals[ci]),dp=sum(list.filter(pl),r=>r.vals[ci]);
    net.push(dn);netNw.push(dp);cash+=dn;nw+=dp;closing.push(cash);pts.push({month:c.month,cash,nw});
  });
  const lowest=pts.reduce((a,p)=>p.cash<a.cash?p:a,pts[0]);
  const out30=-sum(up30.filter(u=>u.amt<0),u=>u.amt),in30=sum(up30.filter(u=>u.amt>0),u=>u.amt);
  const safe=avail-reserve-out30+(fc.countIncome?in30:0);
  return{b,rec:detected,up30,avail,avgInc,avgSp,incBase,spBase,incScen,spScen,incSrc,spSrc,trOut,sc,SC,H,reserve,pts,lowest,out30,in30,safe,runway:avgSp>0?avail/avgSp:null,cm,fcur,PM,cols,rows:list,net,netNw,closing,goalsMonthly,commits,scKey};
}
const ROWGRP={inc:'Income',needs:'Needs',wants:'Wants',other:'Other spending',debt:'Debt principal',assets:'Asset purchases',savings:'Savings, goals and transfers'};

function forecastTable(o){
  const detail=S.fcDetail,cols=o.cols;
  const head=`<thead><tr><th class="fx-name">${detail?'Category':'Group'}</th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead>`;
  const groups=Object.keys(ROWGRP).filter(g=>o.rows.some(r=>r.grp===g));
  const body=groups.map(g=>{
    const rs=o.rows.filter(r=>r.grp===g),tot=cols.map((_,i)=>sum(rs,r=>r.vals[i]));
    return`<tr class="fx-g"><th class="fx-name">${ROWGRP[g]}</th>${tot.map(v=>`<td class="${v<0?'neg':v>0?'pos':''}">${fmt(v)}</td>`).join('')}</tr>`+(detail?rs.map(r=>`<tr class="fx-r"><th class="fx-name">${esc(r.label)}</th>${r.vals.map(v=>`<td>${Math.abs(v)<1e-9?'':fmt(v)}</td>`).join('')}</tr>`).join(''):'');
  }).join('');
  const foot=`<tr class="fx-t"><th class="fx-name">Net change in cash</th>${o.net.map(v=>`<td class="${v<0?'neg':'pos'}">${fmt(v)}</td>`).join('')}</tr><tr class="fx-t"><th class="fx-name">Cash at the end</th>${o.closing.map(v=>`<td>${fmt(v)}</td>`).join('')}</tr>`;
  return`<div class="fx-wrap"><table class="fx">${head}<tbody>${body}${foot}</tbody></table></div>`;
}

function pOutlook(){
  const o=outlook(),fc=S.plan.fc;
  S.charts.fc={type:'line',id:'fc',tone:'light',points:o.pts.map(p=>({month:p.month,v:p.cash})),label:'Projected available cash',ref:o.reserve>0?o.reserve:undefined,h:window.innerWidth<600?190:230,rest:'Touch or hover the chart to read a month.'};
  const reserveTxt=o.reserve>0?' · reserve '+fmt(o.reserve):'';

  const upRows=o.up30.slice(0,14).map(u=>`<div class="row"><div><span class="t">${esc(u.desc||'(no description)')}</span><small>${esc(fdate(u.date))} · ${esc(lab(u))} · ${u.src==='income'?'Money in':u.src==='spending'?'Spending':'Transfer out of cash'}${u.mine?' · yours':''}</small></div><div class="amt ${u.amt>0?'pos':'neg'}">${u.amt>0?'+':''}${fmt(u.amt)}</div></div>`).join('');

    <div class="seg" role="group" aria-label="Scenario">${Object.entries(o.SC).map(([k,v])=>`<button data-scen="${k}" aria-pressed="${fc.scenario===k}">${v.label}</button>`).join('')}</div></div>
    <div class="chart" data-chart="fc"></div><div class="readout muted" id="fc-read" style="min-height:20px;font-size:13px;margin-top:6px">Touch or hover the chart to read a month.</div>
    <div class="kpis" style="margin-top:14px"><div class="kpi card">${'<div class="label">Lowest cash</div><strong>'+fmt(o.lowest.cash)+'</strong><div class="detail">'+esc(o.lowest.label||fmonLong(o.lowest.month))+'</div>'}</div><div class="kpi card"><div class="label">Cash in ${o.H} months</div><strong>${fmt(o.pts.at(-1).cash)}</strong><div class="detail">${esc(fmonLong(o.pts.at(-1).month))}</div></div><div class="kpi card"><div class="label">Net worth in ${o.H} months</div><strong>${fmt(o.pts.at(-1).nw)}</strong><div class="detail">${fmt(o.pts.at(-1).nw-o.b.networth)} vs now, before market moves</div></div></div>
  </section>
  <section class="card block"><div class="head"><div><h2>Forecast by category</h2><p class="sub">${esc(S.cur)} · every line comes from your plan by category, your commitments, goals and one-off items. Negative is money out.</p></div>
    <div class="seg" role="group" aria-label="Detail"><button data-fxd="0" aria-pressed="${!S.fcDetail}">Groups</button><button data-fxd="1" aria-pressed="${!!S.fcDetail}">Every category</button></div></div>${forecastTable(o)}</section>
  <div class="grid two">
   <section class="card"><div class="head"><div><h2>Assumptions</h2><p class="sub">What the forecast is built from. Nothing is hidden.</p></div><button class="btn small" id="edit-fc">Edit</button></div>
    <div class="list">

     <div class="row"><div><span class="t">Regular transfers out of cash</span><small>Loan, savings or investment payments found in your history</small></div><div class="amt">${fmt(o.trOut)}</div></div>
     <div class="row"><div><span class="t">One-off items</span><small>${(fc.events||[]).filter(e=>eventOn(e,o.scKey)).length} in this scenario</small></div><div class="amt"></div></div>
    </div>
    <p class="footnote">Net worth assumes no market moves or exchange-rate changes. Loans, savings and investment transfers lower cash but not net worth. The rest of the current month uses what is still expected after this month’s actuals.</p></section>

   <label class="fld"><span>Status</span><select id="cm-status">${opt(STATUSES,v.status)}</select></label>
   <label class="fld"><span>Priority</span><select id="cm-prio">${opt(PRIOS,v.priority||'Medium')}</select></label>
   <label class="fld"><span>Currency</span><select id="cm-cur">${cs.map(x=>`<option ${x===v.cur?'selected':''}>${esc(x)}</option>`).join('')}</select></label>

   <label class="fld"><span>How often</span><select id="cm-freq">${FREQS.map(([k,t])=>`<option value="${k}" ${k===v.freq?'selected':''}>${t}</option>`).join('')}</select></label>
   <label class="fld"><span>First or next date</span><input id="cm-start" type="date" value="${v.start||''}"></label>

   <label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="cm-base" ${v.inBaseline?'checked':''}> Already inside my monthly averages (do not add it again to the forecast)</label>
   <label class="fld"><span>Notes</span><input id="cm-notes" type="text" maxlength="120" value="${esc(v.notes||'')}"></label>`,
   [...(c?[{label:'Delete',run:()=>{S.plan.commitments=S.plan.commitments.filter(x=>x.id!==c.id);savePlan();$('modal').close();render()}}]:[]),{label:'Cancel',run:()=>$('modal').close()},{label:'Save',primary:true,run:()=>{
     const desc=$('cm-desc').value.trim(),amt=+$('cm-amt').value,start=$('cm-start').value,end=$('cm-end').value;
     if(!desc||!(amt>0)||!start){toast('Add a description, an amount above zero and a date.');return}

function pRepeat(){
  const all=detectRecurring(),act=all.filter(r=>!r.ignored),mo=r=>r.every==='monthly'?r.amt:r.amt/3,L=S.ix.latest;
  const cms=(S.plan.commitments||[]),ad=adoptedKeys();
  const per=c=>c.freq==='once'?0:commitBase(c,L)*(c.freq==='weekly'?52/12:1/(FREQ_M[c.freq]||1));
  const activeC=cms.filter(c=>c.status==='Active');
  const sumT=t=>sum(activeC.filter(c=>c.treat===t),per);
  const spend=-sum(act.filter(r=>r.src==='spending'&&!ad.has(r.key)),mo)+sumT('P&L Expense'),inc=sum(act.filter(r=>r.src==='income'&&!ad.has(r.key)),mo)+sumT('Income');
  const tr=-sum(act.filter(r=>r.src==='transfer'&&!ad.has(r.key)),mo)+sumT('Debt Principal')+sumT('Asset Purchase')+sumT('Savings Transfer');
  const nextOf=r=>{let d=addDays(r.last,r.interval);if(d<=L){if(daysBetween(d,L)-1>10){while(d<=L)d=addDays(d,r.interval)}else d=addDays(L,1)}return d};
  const sect=(title,src)=>{
    const rs=all.filter(r=>r.src===src).sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt));if(!rs.length)return'';
    return`<div class="section-h"><span>${title}</span><span>${rs.filter(r=>!r.ignored).length} active</span></div>`+rs.map(r=>{
      const chip=r.changed?chipHTML(vd(Math.abs(r.lastAmt)-Math.abs(r.prevMed),src!=='income','prev')):'',taken=ad.has(r.key);
      return`<div class="row" style="${r.ignored?'opacity:.55':''}"><div><span class="t">${esc(r.desc||'(no description)')}</span><small>${r.every==='monthly'?'Monthly':'Quarterly'} · seen ${r.n} times · last ${esc(fdate(r.last))}${r.ignored?'':' · next about '+esc(fdate(nextOf(r)))}${taken?' · you added it as a commitment':''}</small>${chip?`<small style="margin-top:4px">${chip} the last payment changed: paid ${fmt(Math.abs(r.lastAmt))}, before ${fmt(Math.abs(r.prevMed))}</small>`:''}</div><div class="amt ${r.amt>0?'pos':'neg'}">${r.amt>0?'+':''}${fmt(r.amt)}<small>${taken?'':`<button class="btn small" data-adopt="${esc(r.key)}">Add as commitment</button> `}<button class="btn small" data-rignore="${esc(r.key)}">${r.ignored?'Include again':'Ignore'}</button></small></div></div>`;
    }).join('');
  };
  const changes=act.filter(r=>r.changed).length;
  const cRow=c=>{const nx=commitNext(c);return`<div class="row" style="${c.status==='Active'?'':'opacity:.6'}"><div><span class="t">${esc(c.desc)}</span><small>${esc(c.treat)}${c.cat?' · '+esc(c.cat):''} · ${esc(FREQ_LABEL[c.freq])} · ${nx?'next '+esc(fdate(nx)):'no date ahead'} · ${esc(c.priority||'Medium')} priority${c.inBaseline?' · already in averages':''}</small></div><div class="amt ${c.treat==='Income'?'pos':'neg'}">${c.treat==='Income'?'+':'−'}${fmtIn(c.amount,c.cur,0)} ${esc(c.cur)}<small>${pill(c.status,c.status==='Active'?'good':c.status==='Review'?'warn':'')} <button class="btn small" data-editc="${esc(c.id)}">Edit</button></small></div></div>`};
  const order=[...cms].sort((a,b)=>(a.status==='Active'?0:1)-(b.status==='Active'?0:1)||(commitNext(a)||'9').localeCompare(commitNext(b)||'9'));
  $('ptab').innerHTML=`<div class="kpis four">${kpi('Repeating spending',fmt(spend),'A month, on average')}${kpi('Repeating income',fmt(inc),'A month, on average')}${kpi('Regular transfers out',fmt(tr),'Loans, savings, investing')}${kpi('Price changes',String(changes),changes?'Check the flagged items':'None found')}</div>
   <section class="card block"><div class="head"><div><h2>Your commitments</h2><p class="sub">Things you know will happen: rent, insurance, school fees, loan payments, a salary raise. Give each a category, an amount and how often. Only Active ones feed the forecast, and “already in my averages” stops them being counted twice.</p></div><button class="btn small" id="add-commit">Add a commitment</button></div>
   ${cms.length?order.map(cRow).join(''):'<div class="empty" style="padding:24px 0">No commitments yet. Add one, or turn a repeating payment found below into a commitment.</div>'}</section>
   <section class="card block"><div class="head"><div><h2>Found in your history</h2><p class="sub">Paid about monthly or quarterly at least three times, or twice for quarterly. Ignore anything that is not really regular. Add the useful ones as commitments to set a category and control them.</p></div></div>${sect('Spending','spending')}${sect('Income','income')}${sect('Transfers out of cash','transfer')}${all.length?'':'<div class="empty">Nothing repeating found yet.</div>'}</section>`;
  $('add-commit').onclick=()=>editCommitment();
  document.querySelectorAll('[data-editc]').forEach(b=>b.onclick=()=>editCommitment(S.plan.commitments.find(c=>c.id===b.dataset.editc)));
  document.querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>{
    const r=all.find(x=>x.key===b.dataset.adopt),treat=r.src==='income'?'Income':r.src==='spending'?'P&L Expense':'Savings Transfer';
    const catLine=S.ix.txs.find(t=>t.description===r.desc&&t.cat);const key=catLine?catLine.lines.map(catKey).find(k=>expenseCategories().some(e=>e.key===k)):'';
    editCommitment(null,{desc:r.desc,treat,cat:treat==='P&L Expense'?(key||''):'',cur:baseCurrency(S.data)||S.cur,amount:Math.round(Math.abs(r.amt)),freq:r.every==='quarterly'?'quarterly':'monthly',start:nextOf(r),srcKey:r.key});
  });
  document.querySelectorAll('[data-rignore]').forEach(b=>b.onclick=()=>{const k=b.dataset.rignore;if(S.plan.ignoreRec[k])delete S.plan.ignoreRec[k];else S.plan.ignoreRec[k]=true;savePlan();render()});
}

function diffHTML(df,p){

async function handleFile(file){
  try{
    if(S.locked||!file)return;
    if(file.size>40e6)throw new Error('That file is over 40 MB. Export just the accounts you need, or ask for help.');
    toast('Reading '+file.name+'…');
    const text=await file.text(),p=parseTXT(text,file.name);
    if(p.errors.length){modal('This file could not be imported',`<p>The export has problems, so nothing was changed:</p><ul>${p.errors.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);return}
    if(!S.data||S.meta.sample){await commitImport(p,text);S.page='overview';render();toast('Imported '+p.txCount.toLocaleString()+' transactions from '+p.accounts.length+' accounts.');return}
    const df=diffData(p);
    modal('Review changes before replacing',diffHTML(df,p),[{label:'Cancel',run:()=>$('modal').close()},{label:'Replace data',primary:true,run:async()=>{await commitImport(p,text);$('modal').close();render();toast('Data replaced. The previous export is kept under Import history.')}}]);
  }catch(e){toast(e.message)}
}

async function tryUnlock(){
  const rec=store.lock(),pass=$('lock-pass').value;if(!rec||!pass)return;
  $('lock-go').disabled=true;$('lock-err').textContent='';
  try{
    const key=await CR.derive(pass,unb64(rec.salt));
    const chk=await CR.dec(key,{iv:unb64(rec.check.iv),ct:unb64(rec.check.ct)});
    if(chk!=='ok')throw new Error('bad');
    S.key=key;S.locked=false;$('lock').hidden=true;$('lock-pass').value='';S.lastActive=Date.now();
    await loadAll();render();
  }catch(e){$('lock-err').textContent='That passcode did not work. Try again.'}
  $('lock-go').disabled=false;
}

  if(S.meta.sample)banner+=notice('You are looking at sample data. Import your own Moneydance export to see your finances.',true);
  if(ix.errors.length)banner+=notice(ix.errors.length+' transaction'+(ix.errors.length>1?'s are':' is')+' left out of the totals because they do not balance. <button data-go="data">See the checks</button>');
  if(showControls&&S.page!=='accounts'&&S.page!=='plan'&&e>ix.latest&&(S.per.mode==='month'||S.per.mode==='custom'))banner+=notice('Your export ends '+fdate(ix.latest)+', so this period is not complete yet.',true).replace('class="notice info"','class="notice info desk"');
  $('banner').innerHTML=banner;
  $('banner').querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{S.page='data';render()});
  if(S.page!=='overview')S.arr=false;
  S.charts={};
  ({overview:vOverview,spending:vSpending,accounts:vAccounts,plan:vPlan,reports:vReports,activity:vActivity,data:vData})[S.page]();
  paintCharts();
  if(S.anim){const v=$('view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');S.anim=false}
  navCommit();navButtons();
}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.data&&!S.locked)paintCharts()},160)});

(async function init(){
  const st=store.get();if(st.cur)S.cur=st.cur;if(st.theme)S.theme=st.theme;if(st.targets)S.targets={...S.targets,...st.targets};
  if(typeof st.mask==='boolean')S.mask=st.mask;if(typeof st.autoLock==='number')S.autoLock=st.autoLock;
  S.look={...defaultLook(),...(st.look||{})};if(st.layout&&typeof st.layout==='object')S.layout=st.layout;
  applyTheme();
  if(store.lock()){S.locked=true;$('lock').hidden=false;setTimeout(()=>$('lock-pass').focus(),80);return}
  await loadAll();render();
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}
</script>
