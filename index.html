<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Fund</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>:root{
  --bg:#EDF0EB;--surface:#FBFCFA;--surface2:#F1F4EF;--ink:#14241E;--ink2:#46564F;--mute:#76837C;
  --line:#D3DAD3;--line2:#E4E9E3;--accent:#0D5B49;--accent2:#0A4638;--onaccent:#FFFFFF;--brass:#B5822A;
  --pos:#1B7A52;--posbg:#DDEFE5;--warn:#9A6508;--warnbg:#F6EAD0;--neg:#B03625;--negbg:#F6DDD8;--info:#2A5A8C;--infobg:#DEE8F3;--muteBg:#E7EBE6;
  --c1:#2A5A8C;--c2:#0F8A69;--c3:#B5822A;--c4:#8A4B7A;--grid:#DEE4DE;--hero:#0B4536;
  --r:12px;--shadow:0 1px 2px rgba(16,32,26,.05),0 8px 20px -12px rgba(16,32,26,.16);
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --sans:'Hanken Grotesk','Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1613;--surface:#14211D;--surface2:#1A2B26;--ink:#E7EEE9;--ink2:#B2C0B9;--mute:#84948C;
    --line:#293A34;--line2:#213029;--accent:#3DBB98;--accent2:#5BD1AF;--onaccent:#062119;--brass:#D9A648;
    --pos:#56C796;--posbg:#173A2C;--warn:#E3B04B;--warnbg:#3A2F14;--neg:#F08A78;--negbg:#3F1F1A;--info:#7EB1E6;--infobg:#172F47;--muteBg:#22322C;
    --c1:#6FA6E0;--c2:#3CC49F;--c3:#DDAA4B;--c4:#C489B4;--grid:#25352F;--hero:#0F3D31;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
    --bg:#0D1613;--surface:#14211D;--surface2:#1A2B26;--ink:#E7EEE9;--ink2:#B2C0B9;--mute:#84948C;
    --line:#293A34;--line2:#213029;--accent:#3DBB98;--accent2:#5BD1AF;--onaccent:#062119;--brass:#D9A648;
    --pos:#56C796;--posbg:#173A2C;--warn:#E3B04B;--warnbg:#3A2F14;--neg:#F08A78;--negbg:#3F1F1A;--info:#7EB1E6;--infobg:#172F47;--muteBg:#22322C;
    --c1:#6FA6E0;--c2:#3CC49F;--c3:#DDAA4B;--c4:#C489B4;--grid:#25352F;--hero:#0F3D31;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
::selection{background:var(--accent);color:var(--onaccent)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px 16px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:2px 10px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--onaccent);display:grid;place-items:center;flex:none;box-shadow:0 4px 10px -4px var(--accent)}
.logo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand .t{font:600 21px/1.05 var(--serif);letter-spacing:-.01em}
.brand .s{color:var(--mute);font-size:12px;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:14px 12px 5px;font-weight:600}
.nav button{display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;padding:8px 12px;border-radius:9px;cursor:pointer;color:var(--ink2);font-weight:500;position:relative;transition:background .12s,color .12s}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--onaccent);font-weight:600;box-shadow:0 4px 12px -6px var(--accent)}
.nav button[aria-current="page"] svg{opacity:1}
.nav .badge{margin-left:auto;font-size:11px;background:var(--negbg);color:var(--neg);border-radius:20px;padding:1px 8px;font-weight:700}
.nav button[aria-current="page"] .badge{background:rgba(255,255,255,.24);color:inherit}
.side .foot{margin-top:auto;padding:12px 10px 0;color:var(--mute);font-size:12px;line-height:1.5;border-top:1px solid var(--line2)}
.main{min-width:0}
/* filter bar */
.filters{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 24px 10px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:end}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10.5px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.f select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 26px 6px 10px;min-width:92px;max-width:170px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.f select:hover{border-color:var(--mute)}
.f select.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface));font-weight:600;color:var(--accent)}
.f select:disabled{opacity:.5;cursor:not-allowed}
.f.grow{margin-left:auto;flex-direction:row;gap:8px;align-items:center}
.view{padding:22px 22px 60px;max-width:1180px}
.vh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:20px}
.vh h1{font:600 32px/1.1 var(--serif);letter-spacing:-.018em}
.vh .sub{color:var(--ink2);font-size:14px;padding:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.vh .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px 13px;box-shadow:var(--shadow);min-width:0}
.panel>.ph{display:flex;align-items:baseline;gap:4px 12px;margin:-2px 0 14px;padding-bottom:11px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel>.ph h3{font:600 15.5px var(--sans);letter-spacing:-.005em}
.panel>.ph .note{color:var(--mute);font-size:12.5px}
.panel>.ph .right{margin-left:auto}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
/* hero */
.hero{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--hero) 82%,#2E8B6E) 0%,var(--hero) 60%);color:#F2F7F4;border-radius:16px;padding:26px 28px;margin-bottom:22px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.4fr);gap:28px;align-items:center;box-shadow:0 18px 40px -24px rgba(11,69,54,.7);position:relative;overflow:hidden}
.hero .lbl{font-size:12.5px;opacity:.78;letter-spacing:.04em;text-transform:uppercase}
.hero .big{font:600 clamp(38px,5.2vw,58px)/1 var(--serif);letter-spacing:-.025em;margin:8px 0 10px}
.hero .msg{font-size:13.5px;opacity:.9;max-width:48ch;line-height:1.5}
.hero .spark{margin-top:14px;max-width:340px}
.hero .spark svg{display:block;width:100%;height:auto}
.eq{display:grid;gap:0;font-size:14.5px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 16px}
.eq .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.eq .r:last-child{border-bottom:0;font-size:15.5px}
.eq .r span:first-child{opacity:.85}
.eq .r b{font-weight:600}
.eq .r.neg b{color:#FFC8BC}
.hero .pill{background:rgba(255,255,255,.15);color:#fff}
.hero .pill::before{display:none}
/* KPI groups */
.kgroup{margin-bottom:20px}
.kgroup>h2{font:600 11px var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--mute);margin:0 0 9px;display:flex;align-items:center;gap:10px}
.kgroup>h2::after{content:'';flex:1;height:1px;background:var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kgrid.mb{margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px 19px;position:relative;overflow:hidden;box-shadow:var(--shadow);min-width:0}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc,var(--line))}
.kpi.pos{--kc:var(--pos)}.kpi.neg{--kc:var(--neg)}.kpi.warn{--kc:var(--brass)}.kpi.info{--kc:var(--info)}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:500}
.kpi .v{font:600 26px/1.12 var(--serif);margin:4px 0 3px;letter-spacing:-.012em;overflow-wrap:anywhere}
.kpi .d{font-size:12px;color:var(--mute);line-height:1.35}
.kpi.neg .v{color:var(--neg)}.kpi.pos .v{color:var(--pos)}.kpi.warn .v{color:var(--warn)}
/* pills, buttons */
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--muteBg);color:var(--ink2);white-space:nowrap}
.pill.pos,.pill.neg,.pill.warn,.pill.info{padding-left:8px}
.pill.pos::before,.pill.neg::before,.pill.warn::before,.pill.info::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.pill.pos{background:var(--posbg);color:var(--pos)}.pill.neg{background:var(--negbg);color:var(--neg)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.info{background:var(--infobg);color:var(--info)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500;transition:background .12s,border-color .12s,transform .05s}
.btn:hover{background:var(--surface2);border-color:var(--mute)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600;box-shadow:0 4px 12px -6px var(--accent)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* tables */
.tw{overflow-x:auto;border-radius:8px}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.t td{white-space:nowrap}
.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
.t th:first-child{border-top-left-radius:8px}.t th:last-child{border-top-right-radius:8px}
.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.t tbody tr:nth-child(even){background:color-mix(in srgb,var(--surface2) 45%,transparent)}
.t tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.t tr.click{cursor:pointer}
.t .num,.t th.num{text-align:right;white-space:nowrap}
.t tfoot td{font-weight:700;border-top:2px solid var(--ink);background:var(--surface2)}
.t .neg{color:var(--neg)}.t .pos{color:var(--pos)}.t .mute{color:var(--mute)}
.t tr.sel td{background:var(--infobg)}
.t th.sortable{cursor:pointer;user-select:none}
.t th.sortable:hover{color:var(--ink);background:var(--line2)}
.t th.sortable::after{content:'\2195';margin-left:5px;opacity:.35;font-size:11px}
.t th.sortable[aria-sort="ascending"]::after{content:'\25B2';opacity:1;color:var(--accent)}
.t th.sortable[aria-sort="descending"]::after{content:'\25BC';opacity:1;color:var(--accent)}
.t th.num.sortable{text-align:right}
/* charts */
.chart{width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart [data-tip]{transition:opacity .1s,filter .1s}
.chart rect[data-tip]:hover,.chart circle[data-tip]:hover{filter:brightness(1.12)}
.chart path[data-tip]:hover{opacity:.85}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 11px;border-radius:8px;font-size:12.5px;line-height:1.4;max-width:270px;box-shadow:0 8px 24px rgba(0,0,0,.28);white-space:pre-line}
.hb{display:grid;gap:11px}
.hb .row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13.5px}
.hb .track{height:14px;background:var(--surface2);border-radius:7px;position:relative;overflow:hidden}
.hb .fill{position:absolute;top:0;bottom:0;border-radius:7px}
.hb .row .n{text-align:right;white-space:nowrap;min-width:78px;font-weight:600}
.hb .row .n .small{font-weight:400}
.hb .zero{position:absolute;top:-2px;bottom:-2px;width:1.5px;background:var(--mute);z-index:1}
.prog{height:22px;background:var(--surface2);border-radius:11px;position:relative;overflow:hidden;border:1px solid var(--line2)}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:11px;min-width:12px}
.prog .mark{position:absolute;top:0;bottom:0;width:3px;background:var(--brass)}
/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--ink2);font-weight:600}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:0}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--mute)}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.formgrid .span2{grid-column:span 2}.formgrid .span3{grid-column:span 3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--ink2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);font-weight:600}
/* empty */
.empty{padding:54px 24px 46px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;background:var(--surface)}
.empty svg.ill{width:150px;height:auto;margin:0 auto 16px;display:block}
.empty h2{font:600 28px/1.2 var(--serif);margin-bottom:8px}
.empty p{color:var(--ink2);max-width:54ch;margin:0 auto 18px}
.empty .steps{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0 auto 20px;max-width:640px}
.empty .steps span{background:var(--surface2);border:1px solid var(--line2);border-radius:20px;padding:5px 13px;font-size:13px;color:var(--ink2)}
.empty.drag{border-color:var(--accent);background:var(--posbg)}
.callout{border:1px solid var(--line);border-left:4px solid var(--info);background:var(--surface);border-radius:9px;padding:11px 15px;margin-bottom:16px;font-size:14px;box-shadow:var(--shadow)}
.callout.warn{border-left-color:var(--brass);background:color-mix(in srgb,var(--warnbg) 45%,var(--surface))}.callout.neg{border-left-color:var(--neg)}.callout.pos{border-left-color:var(--pos)}
.callout b{font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,16,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;border:1px solid var(--line);width:min(760px,100%);padding:24px 26px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal h2{font:600 24px/1.2 var(--serif);margin-bottom:14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.kv{display:grid;gap:0}.kv .r{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.kv .r.tot{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0;padding-top:9px}
.small{font-size:12.5px;color:var(--mute)}
.mt{margin-top:14px}.mb{margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;left:-9999px}
.tone-neg{color:var(--neg)}.tone-pos{color:var(--pos)}
/* ===== on-screen report (paper) ===== */
.report{--ink:#1B2A24;--ink2:#46564F;--mute:#6B7A73;--line:#D9E0DA;--line2:#E6EBE7;--surface:#fff;--surface2:#F1F5F1;--accent:#0D5B49;--accent2:#0A4638;--brass:#B5822A;--neg:#B03625;--pos:#1B7A52;--warn:#9A6508;--info:#2A5A8C;--posbg:#DDEFE5;--negbg:#F6DDD8;--warnbg:#F6EAD0;--infobg:#DEE8F3;--muteBg:#E7EBE6;--grid:#E3E9E4;--c1:#2A5A8C;--c2:#0F8A69;--c3:#B5822A;--c4:#8A4B7A;
  background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:6px;max-width:860px;box-shadow:0 2px 4px rgba(0,0,0,.05),0 24px 50px -24px rgba(16,32,26,.35);overflow:hidden}
.rp-head{background:#0B4536;color:#fff;padding:26px 32px 24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:5px solid #B5822A}
.rp-head h1{font:600 30px/1.1 var(--serif);letter-spacing:-.01em}
.rp-head .mo{font-size:16px;color:#BFE3D3;margin-top:5px}
.rp-head .meta{text-align:right;font-size:12.5px;color:#CFE6DB;line-height:1.7}
.rp-body{padding:22px 32px 30px}
.rp-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px}
.rp-tile{background:var(--surface2);border-radius:9px;padding:12px 14px 11px 17px;position:relative;overflow:hidden}
.rp-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kc)}
.rp-tile .l{font-size:10.5px;letter-spacing:.07em;font-weight:700;color:var(--mute);text-transform:uppercase}
.rp-tile .v{font:600 22px/1.2 var(--serif);margin:3px 0 1px}
.rp-tile .d{font-size:12px;color:var(--mute)}
.rp-sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.rp-sec::before{content:'';width:5px;height:18px;background:var(--accent);border-radius:2px;align-self:center}
.rp-sec h2{font:600 17px var(--sans);color:#0B4536;margin:0;border:0;padding:0}
.rp-sec .s{margin-left:auto;font-size:12.5px;color:var(--mute)}
.rp-two{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.rp-note{font-size:13px;color:var(--mute);margin-top:9px}
.rp-eq .r{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.rp-eq .close{display:flex;justify-content:space-between;margin-top:8px;padding:10px 12px;border-radius:9px;font-weight:700}
.rp-own{display:flex;height:30px;border-radius:8px;overflow:hidden;margin-bottom:12px}
.rp-own span{display:grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;min-width:0;overflow:hidden}
.rp-leg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rp-leg .b{font-weight:700;font-size:13.5px}.rp-leg .b i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.rp-leg .a{font-size:13px}.rp-leg .m{font-size:11.5px;color:var(--mute)}
.rp-strip{display:flex;flex-wrap:wrap;gap:8px 26px;background:var(--surface2);border-radius:9px;padding:10px 14px;margin-top:12px;font-size:13.5px}
.rp-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.rp-stats .l{font-size:10.5px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}.rp-stats .v{font-weight:700;font-size:15px}
.rp-pts{background:var(--warnbg);border-left:5px solid var(--brass);border-radius:9px;padding:12px 16px 10px;margin-top:24px}
.rp-pts h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.rp-pts li{margin:0 0 5px;font-size:13.5px}.rp-pts ul{margin:0;padding-left:18px}
.rp-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);border-top:1px solid var(--line);margin-top:26px;padding-top:10px}
.report .t th{font-size:11px}
.report .t tbody tr:hover{background:transparent}
@media (max-width:1000px){
  .g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 6px;border-right:0;border-bottom:1px solid var(--line);gap:8px;overflow-x:auto}
  .brand{padding:0 6px 0 2px;flex:none}.brand .s,.side .foot,.nav .grp{display:none}
  .brand .t{font-size:18px}.logo{width:30px;height:30px}
  .nav{flex-direction:row;gap:2px}.nav button{white-space:nowrap;padding:7px 11px}
  .filters{top:44px;padding:8px 12px;position:static}
  .view{padding:16px 12px 60px}
  .g2{grid-template-columns:minmax(0,1fr)}
  .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .formgrid .span3{grid-column:span 2}
  .rp-head,.rp-body{padding-left:16px;padding-right:16px}.rp-two{grid-template-columns:1fr}.rp-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.rp-leg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{padding:20px 18px}
}
@media (max-width:520px){
  .formgrid{grid-template-columns:minmax(0,1fr)}.formgrid .span2,.formgrid .span3{grid-column:auto}
  .kpi .v{font-size:22px}.kgrid{gap:10px}
  .hb .row{grid-template-columns:82px minmax(0,1fr) auto}
  .vh h1{font-size:27px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.hb.stack .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'l n' 't t';row-gap:5px}
.hb.stack .row>span:nth-child(1){grid-area:l}.hb.stack .row>span:nth-child(2){grid-area:t}.hb.stack .row>span:nth-child(3){grid-area:n}
.hb.stack .track{height:12px}
.report .t th{white-space:normal;line-height:1.25;padding:8px 9px}
.report .t td{padding:8px 9px}
.report .t td:first-child{white-space:nowrap}
.brand .s{font-size:11px;white-space:nowrap;letter-spacing:-.005em}
.t td:first-child{white-space:nowrap}
.t select,.t input:not([type=checkbox]){background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:13px}
.t select:focus,.t input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.kv.help .r{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:18px;align-items:baseline}
.kv.help .r span:last-child{color:var(--ink2)}
@media (max-width:700px){.kv.help .r{grid-template-columns:1fr;gap:2px}}

.grid>*,.kgrid>*{min-width:0}

.more-wrap{position:relative}
.popover{position:absolute;top:calc(100% + 6px);left:0;z-index:35;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 16px 38px -14px rgba(16,32,26,.35);display:grid;gap:10px;min-width:230px}
.popover[hidden]{display:none}
.popover .f label{text-transform:none;letter-spacing:0}
.chipcount{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--onaccent);color:var(--accent);font-size:10.5px;font-weight:800;margin-left:5px;vertical-align:1px}
.btn.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.on .chipcount{background:rgba(255,255,255,.92)}
.navsheet{display:grid;gap:8px}
.navsheet .btn{display:flex;align-items:center;gap:10px;justify-content:flex-start}
.navsheet .btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}

.mheader{display:none}
.bottomnav{display:none}
@media (max-width:640px){
  .side{display:none}
  .mheader{display:flex;align-items:center;gap:10px;padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:41}
  .mheader .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,var(--accent),var(--accent2));color:var(--onaccent);display:grid;place-items:center;flex:none}
  .mheader .logo svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mheader .t{font:600 17px var(--serif)}
  .filters{position:static;padding:8px 12px}
  .view{padding:14px 12px 84px}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));justify-content:space-around;box-shadow:0 -8px 20px -14px rgba(16,32,26,.3)}
  .bottomnav button{position:relative;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2);font-size:10px;font-weight:600;padding:5px 4px;border-radius:9px;flex:1}
  .bottomnav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bottomnav button[aria-current="page"]{color:var(--accent)}
  .bottomnav .badge{position:absolute;top:2px;right:14%;font-size:9px;padding:0 4px;min-width:14px;height:14px;line-height:14px;border-radius:8px;background:var(--negbg);color:var(--neg);font-weight:700}
  .toast{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
}

.t td.desc{max-width:300px;color:var(--ink2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

function inr(n, d = 0) {
  if (n == null || Number.isNaN(n)) return '—';
  const a = Math.abs(n), neg = n < 0 && Math.round(a * Math.pow(10, d)) > 0;
  return (neg ? '−' : '') + '₹' + a.toLocaleString('en-IN', {minimumFractionDigits: d, maximumFractionDigits: d});
}
const inr2 = n => inr(n, 2);
function lakh(n) {
  if (n == null || Number.isNaN(n)) return '—';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2) + ' Cr';
  if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2) + ' L';
  return inr(n);
}
const pct = (n, d = 1) => (n == null || !isFinite(n)) ? '—' : (n * 100).toFixed(d) + '%';
function axisFmt(v) {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e7) return s + +(a / 1e7).toFixed(1) + 'Cr';
  if (a >= 1e5) return s + +(a / 1e5).toFixed(1) + 'L';
  if (a >= 1e3) return s + +(a / 1e3).toFixed(1) + 'k';
  return s + Math.round(a);
}

const addMonths = (m, n) => { const y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + n; const yy = y + Math.floor(mo / 12), mm = ((mo % 12) + 12) % 12; return yy + '-' + String(mm + 1).padStart(2, '0'); };

function loadState() {
  try {
    const j = localStorage.getItem(KEY);
    if (j) {
      const o = JSON.parse(j), d = defaults();
      o.cfg = Object.assign(d.cfg, o.cfg || {});
      o.cfg.goal = Object.assign(d.cfg.goal, (o.cfg || {}).goal || {});
      return Object.assign(d, o, {cfg: o.cfg});
    }
  } catch (e) { /* ignore */ }
  return defaults();
}
let S = loadState();
let saveT;
function flushSave() {
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save to this browser. Use Setup → Save backup.', 'warn'); }
}
function persist() { clearTimeout(saveT); saveT = setTimeout(flushSave, 150); }
window.addEventListener('pagehide', () => { if (saveT) flushSave(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) flushSave(); });
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ============ workbook import ============ */
const normH = s => String(s ?? '').toLowerCase().replace(/[^a-z]/g, '');
function serialToISO(v) {
  const d = new Date(Math.round((v - 25569) * 864e5));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function parseDateCell(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  if (typeof v === 'number') return v > 20000 && v < 80000 ? serialToISO(v) : null;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{4})$/);
  if (m) { const mi = MS.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if (mi >= 0) return m[3] + '-' + String(mi + 1).padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
  if (m) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');
  return null;
}
function parseAmt(v) {

  return Object.entries(m).map(([cat, v]) => ({cat, v})).filter(x => Math.abs(x.v) > 0.004).sort((a, b) => b.v - a.v);
}

/* ============ exceptions ============ */
function possibleBankDup(c) {

function buildExceptions() {

  // missing classification

  // missing category (household expenses)

  if (uc.length) add({sev: 'Low', code: 'Missing category', title: uc.length + ' household expense(s) have no category yet', detail: 'Set categories one payee at a time in Household → Categorise payees. Original Purpose is never changed.', ids: uc.map(e => e.id), amount: sum(uc, e => e.amt), count: uc.length, tab: 'household'});
  // missing payment mode

  if (mm.length) add({sev: 'Low', code: 'Missing payment mode', title: mm.length + ' bank row(s) whose payment mode could not be read', detail: 'Shown as "Other". Set the mode in the row editor if you want them counted elsewhere.', ids: mm.map(e => e.id), amount: sum(mm, e => e.amt), count: mm.length, tab: 'transactions'});
  // duplicates

    const refs = e.desc.match(/(?<![\d])\d{12}(?![\d])/g);
    const ref = refs && refs[refs.length - 1];
    if (!ref) continue;
    const k = [ref, e.person, e.purpose, e.type, e.amt].join('|'); (grp[k] = grp[k] || []).push(e);
  }
  for (const k in grp) if (grp[k].length > 1) {
    const g = grp[k];
    const sp = g.map(e => (e.desc.match(/split\s+(\d+)\s*\/\s*\d+/i) || [])[1]);
    if (sp.every(Boolean) && new Set(sp).size === g.length) continue; add({sev: 'Medium', code: 'Duplicate possibility', title: g.length + ' identical rows on ' + dFull(g[0].date) + ' (' + g[0].person + ', ' + inr(g[0].amt) + ')', detail: 'Same bank reference, person, purpose and amount. May be a genuine double payment, or one row may belong to another purpose. Not changed.', ids: g.map(e => e.id), amount: sum(g, e => e.amt), count: g.length, tab: 'transactions', sig: k});
  }
  // medical wording under other purposes
  const mw = led.filter(e => e.src === 'Bank' && e.purpose !== 'Medical Expense' && /medical|pharma|diagnos|hospital|\bdr\b/i.test(e.desc));
  const mwi = mw.filter(e => e.kind === 'invc' || e.kind === 'hhc');
  if (mwi.length) add({sev: 'Medium', code: 'Investment allocation inconsistency', title: mwi.length + ' contribution row(s) mention medical expenses', detail: 'Wording says medical, but the money was booked as ' + [...new Set(mwi.map(e => e.purpose))].join(' / ') + '. These count toward the housing goal and ownership. Decide if that is intended.', ids: mwi.map(e => e.id), amount: sum(mwi, e => e.amt), count: mwi.length, tab: 'transactions'});
  const mwh = mw.filter(e => e.kind === 'hhx');
  if (mwh.length) add({sev: 'Low', code: 'Missing classification', title: mwh.length + ' household expense(s) look medical by payee name', detail: 'Booked as Family Expenses, so they are outside the medical reports. Reclassify in your workbook if they should be medical.', ids: mwh.map(e => e.id), amount: sum(mwh, e => e.amt), count: mwh.length, tab: 'transactions', sig: 'medlook'});
  const toBro = led.filter(e => e.src === 'Bank' && e.kind === 'hhx' && /\b(yaseer|nasir|shakir|zakir)\b/i.test(e.payee));
  if (toBro.length) add({sev: 'Low', code: 'Missing classification', title: toBro.length + ' household payment(s) went to a brother\'s name (' + inr(-sum(toBro, e => e.amt)) + ')', detail: 'Could be reimbursements for something a brother paid. If so, confirm they should reduce the household fund and are not returns of contribution.', ids: toBro.map(e => e.id), amount: sum(toBro, e => e.amt), count: toBro.length, tab: 'transactions', sig: 'tobro'});
  // contribution mismatch (current outstanding)

    if (x.out > tol) add({sev: t === 'Household' ? 'High' : 'Medium', code: 'Contribution mismatch', title: b + ' ' + t.toLowerCase() + ' contribution is short by ' + inr(x.out), detail: 'Required to date ' + inr(x.cumReq) + ', paid to date ' + inr(x.cumPaid) + '.', ids: [], amount: -x.out, count: 1, tab: 'contributions', sig: b + t});
  }

  }
  if (R.N && R.cashCum[last] < -tol) add({sev: 'High', code: 'Negative fund balance', title: 'Cash in hand is negative (' + inr(R.cashCum[last]) + ')', detail: 'Cash payments recorded exceed cash received.', ids: [], amount: R.cashCum[last], count: 1, tab: 'cash', sig: 'cash'});
  // reconciliation

  if (R.N && st == null) add({sev: 'Medium', code: 'Unreconciled amount', title: 'No statement balance to compare with', detail: 'Enter it under Setup so the ledger can be reconciled.', ids: [], amount: 0, count: 1, tab: 'setup', sig: 'nostmt'});
  for (const t of R.splitBroken) add({sev: 'Medium', code: 'Split mismatch', title: 'The category split on ' + dFull(t.date) + ' (' + inr(t.amt) + ') no longer adds up', detail: 'The payment or its kind changed since you split it, so the split is ignored and the whole amount keeps one category. Open the row and split again.', ids: [t.id], amount: t.amt, count: 1, tab: 'transactions', sig: 'split' + t.id});
  // cash ledger checks
  for (const c of S.cash) {
    const e = R.byId[c.id];
    if (!validISO(c.date)) { add({sev: 'High', code: 'Invalid date', title: 'Cash entry has an invalid date', detail: c.desc, ids: [c.id], amount: c.amt, count: 1, tab: 'cash', sig: c.id}); continue; }
    if (!(c.desc || '').trim() && !(c.ref || '').trim() && !(c.note || '').trim()) add({sev: 'Medium', code: 'Cash without explanation', title: 'Cash entry on ' + dFull(c.date) + ' for ' + inr(c.amt) + ' has no description, reference or note', detail: '', ids: [c.id], amount: c.amt, count: 1, tab: 'cash', sig: c.id});
    if (c.acct === 'Cash' && c.mode !== 'Cash') add({sev: 'Medium', code: 'Duplicate possibility', title: 'Cash-ledger entry paid by ' + c.mode + ' on ' + dFull(c.date) + ' (' + inr(c.amt) + ')', detail: 'Non-cash payments normally appear in the bank statement already. Check it is not double counted.', ids: [c.id], amount: c.amt, count: 1, tab: 'cash', sig: 'mode' + c.id});
    const dup = possibleBankDup(c);
    if (dup.length && !/^ATM/i.test(c.src || '')) add({sev: 'Medium', code: 'Duplicate possibility', title: 'Cash entry of ' + inr(c.amt) + ' on ' + dFull(c.date) + ' matches a bank row', detail: 'Bank row: ' + dFull(dup[0].date) + ', ' + inr(dup[0].amt) + ', ' + dup[0].person + '. Remove the cash entry if it is the same money.', ids: [c.id, dup[0].id], amount: c.amt, count: 1, tab: 'cash', sig: 'dup' + c.id});

    if (c.dir === 'Payment' && c.cls !== 'Investment' && (!c.cat || c.cat === 'Uncategorised')) add({sev: 'Low', code: 'Missing category', title: 'Cash payment on ' + dFull(c.date) + ' has no category', detail: c.desc, ids: [c.id], amount: -c.amt, count: 1, tab: 'cash', sig: 'cat' + c.id});

}

/* ============ reconciliation checks ============ */
function buildChecks() {
  const tol = S.cfg.tol, ck = [], last = R.N - 1;
  if (last < 0) return ck;
  const B = S.cfg.brothers;
  const add = (name, exp, act, note, forceStatus) => {
    const diff = r2(act - exp);
    ck.push({name, exp, act, diff, note: note || '', status: forceStatus || (Math.abs(diff) <= tol ? 'Reconciled' : 'Difference')});
  };
  const st = S.meta && S.meta.statementBalance;
  if (st == null) ck.push({name: 'Ledger vs bank statement balance', exp: null, act: R.bankCum[last], diff: null, note: 'No statement balance entered.', status: 'Review Required'});
  else add('Ledger vs bank statement balance', st, R.bankCum[last], 'Sum of every imported row against the statement balance in your workbook.');
  const funds = ['H', 'I', 'S', 'M', 'X'].reduce((a, f) => a + R.F[f][last].close, 0);
  add('Fund balances add up to ledger total (bank + cash)', R.famCum[last], funds, 'Household + Investment + Special + Medical + Unclassified');
  // contributions identity
  for (const t of ['Household', 'Investment']) {
    let req = 0, paid = 0, out = 0, adv = 0;
    for (const b of B) { const x = R.C[b][t][last]; req += x.cumReq; paid += x.cumPaid; out += x.out; adv += x.adv; }
    add(t + ' contributions: required − paid = outstanding − advance', r2(req - paid), r2(out - adv), 'Required ' + inr(req) + ', paid ' + inr(paid));
    const src = sum(R.led.filter(e => e.kind === (t === 'Household' ? 'hhc' : 'invc') && isBro(e.person)), e => e.amt);
    add(t + ' contributions in tracker match source rows', r2(src), r2(paid), 'Tracker total vs transactions tagged ' + (t === 'Household' ? 'Family Expenses' : 'Investments') + ' deposits');
  }
  // household roll-forward
  const H = R.F.H; let o = 0, contrib = 0, rc = 0, sp = 0, adj = 0;
  H.forEach(x => { contrib += x.contrib; rc += x.receipts; sp += x.spend; adj += x.adj; });
  const srcH = sum(R.led.filter(e => e.fund === 'H'), e => e.amt);
  add('Household fund: opening + contributions + other receipts − spending ± adjustments = closing (vs source rows)', r2(srcH), r2(o + contrib + rc - sp + adj), 'Contributions ' + inr(contrib) + ', spending ' + inr(sp));
  const I = R.F.I; let ic = 0, idp = 0, ir = 0;
  I.forEach(x => { ic += x.contrib; idp += x.deployed; ir += x.returned; });
  const srcI = sum(R.led.filter(e => e.fund === 'I'), e => e.amt);
  add('Investment fund: contributions − deployed − withdrawals = closing (vs source rows)', r2(srcI), r2(ic - idp - ir), 'Contributed ' + inr(ic) + ', deployed ' + inr(idp) + ', returned ' + inr(ir));
  const own = ownership(last); const opct = own.rows.reduce((a, r) => a + r.pct, 0);
  add('Ownership percentages add to 100%', own.total > 0 ? 1 : 0, opct, 'Each brother\'s net contribution ÷ total');
  add('Housing goal contributed = net investment contributions', r2(own.total + R.invUnassigned), r2(goalCalc(last).total), '');
  add('Family fund position = fund balances', r2(R.famCum[last]), r2(funds), 'Bank ledger + cash in hand + pending manual bank entries');
  const xf = r2(sum(R.led.filter(e => e.kind === 'xfer' && e.src === 'Bank'), e => e.amt));
  add('Internal transfers net to zero', 0, xf, 'In and out transfers between family accounts');
  const unc = R.led.filter(e => e.kind === 'oth');
  ck.push({name: 'Rows with a usable Purpose', exp: 0, act: unc.length, diff: unc.length, note: unc.length ? unc.length + ' row(s) sit in the Unclassified fund.' : 'Every row is classified.', status: unc.length ? 'Missing Classification' : 'Reconciled'});
  ck.push({name: 'Cash in hand is not negative', exp: 0, act: R.cashCum[last], diff: null, note: '', status: R.cashCum[last] < -tol ? 'Difference' : 'Reconciled'});
  const hn = R.F.H.some(x => x.close < -tol);
  ck.push({name: 'Household fund never below zero', exp: null, act: R.F.H[last].close, diff: null, note: hn ? 'Household fund was overdrawn in ' + R.F.H.filter(x => x.close < -tol).length + ' month-end(s); see Household.' : '', status: hn ? 'Review Required' : 'Reconciled'});
  const atmTot = -sum(R.led.filter(e => e.src === 'Bank' && e.atm && e.kind === 'hhx'), e => e.amt), atmMemo = -sum(R.led.filter(e => e.memo && e.kind === 'hhx'), e => e.amt);
  if (atmTot > 0) ck.push({name: 'ATM cash withdrawn is itemised', exp: atmTot, act: atmMemo, diff: r2(atmMemo - atmTot), note: 'Itemise ATM cash in the Cash ledger so category reports are complete.', status: Math.abs(atmMemo - atmTot) <= tol ? 'Reconciled' : 'Review Required'});
  return ck;
}

/* ============ SVG chart kit (measured, re-rendered on resize, hover tooltips) ============ */

function niceScale(min, max, ticks = 5) {

}

}

}

function barChart(el, W, o) {
  const H = o.h || 240, L = 48, Rr = 10, T = 18, Bm = 28, n = o.labels.length, S_ = o.series;

  }

  const sc = niceScale(mn, mx || 1, 4), pw = W - L - Rr, ph = H - T - Bm;
  const y = v => T + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph, band = pw / Math.max(1, n);

  const zero = y(0); g += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + zero + '" y2="' + zero + '" stroke="var(--mute)" stroke-width="1" opacity=".7"/>';
  const every = Math.ceil(n / Math.max(1, Math.floor(pw / 46)));
  for (let i = 0; i < n; i++) {

    const gw = band * (o.stacked ? .62 : .76), ns = o.stacked ? 1 : S_.length, bw = gw / ns, off = x0 + (band - gw) / 2;
    let pos = 0, neg = 0;
    S_.forEach((s, k) => {

      const t = tip(o.labels[i] + '\n' + s.name + ': ' + inr(v));
      if (o.stacked) {
        const xx = off + .5, ww = Math.max(1, bw - 1);
        if (v >= 0) { const yy = y(pos + v), hh = y(pos) - y(pos + v); const top = !S_.slice(k + 1).some(z => (z.values[i] || 0) > 0); g += top ? rrect(xx, yy, ww, Math.max(.5, hh), 4, s.color, t) : '<rect x="' + xx + '" y="' + yy + '" width="' + ww + '" height="' + Math.max(.5, hh) + '" fill="' + s.color + '"' + t + '/>'; pos += v; }
        else { const yy = y(neg), hh = y(neg + v) - y(neg); g += rrectNeg(xx, yy, ww, Math.max(.5, hh), 4, s.color, t); neg += v; }
      } else {

function lineChart(el, W, o) {

    if (o.endLabel && n) { const p = pts[n - 1], lab = lakh(s.values[n - 1]), w = lab.length * 6.6 + 14; g += '<rect x="' + (p[0] - w + 4) + '" y="' + (p[1] - 28) + '" width="' + w + '" height="19" rx="9.5" fill="' + s.color + '"/><text x="' + (p[0] - w / 2 + 4) + '" y="' + (p[1] - 15) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">' + esc(lab) + '</text>'; }

function donutChart(el, W, o) {
  const size = Math.min(W, o.size || 230), r = size / 2 - 6, cx = size / 2, cy = size / 2, sw = r * .34;
  const tot = o.parts.reduce((a, p) => a + Math.max(0, p.value), 0), gap = o.parts.filter(p => p.value > 0).length > 1 ? .025 : 0;
  let a0 = -Math.PI / 2, g = '';
  if (tot <= 0) g = '<circle cx="' + cx + '" cy="' + cy + '" r="' + (r - sw / 2) + '" fill="none" stroke="var(--line)" stroke-width="' + sw + '"/>';
  o.parts.forEach(p => {
    const v = Math.max(0, p.value); if (!v) return;
    const frac = v / tot, a1 = a0 + frac * Math.PI * 2, rr = r - sw / 2, s0 = a0 + gap, s1 = Math.max(s0 + .001, a1 - gap - (frac > .999 ? .001 : 0));
    const x0 = cx + rr * Math.cos(s0), y0 = cy + rr * Math.sin(s0), x1 = cx + rr * Math.cos(s1), y1 = cy + rr * Math.sin(s1);
    g += '<path d="M' + x0 + ' ' + y0 + ' A' + rr + ' ' + rr + ' 0 ' + ((s1 - s0) > Math.PI ? 1 : 0) + ' 1 ' + x1 + ' ' + y1 + '" fill="none" stroke="' + p.color + '" stroke-width="' + sw + '"' + tip(p.label + '\n' + pct(frac) + ' · ' + inr(v)) + '/>';
    a0 = a1;
  });
  g += '<text x="' + cx + '" y="' + (cy - 1) + '" text-anchor="middle" font-family="var(--serif)" font-size="' + (size / 7.6) + '" font-weight="600" fill="var(--ink)">' + esc(o.center || '') + '</text><text x="' + cx + '" y="' + (cy + size / 10) + '" text-anchor="middle" font-size="12" fill="var(--mute)">' + esc(o.sub || '') + '</text>';
  const leg = o.parts.map(p => '<div class="row" style="justify-content:space-between;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line2);flex-wrap:nowrap"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + p.color + ';margin-right:9px"></i>' + esc(p.label) + '</span><span><b>' + (tot > 0 ? pct(Math.max(0, p.value) / tot) : '—') + '</b> <span class="small">' + lakh(p.value) + '</span></span></div>').join('');
  el.innerHTML = '<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="' + esc(o.aria || 'Donut chart') + '" style="flex:none;width:' + size + 'px;max-width:100%;height:auto">' + g + '</svg><div style="flex:1;min-width:190px">' + leg + '</div></div>';
}

/* horizontal bars (html); supports negatives with a zero line */
function hbarsHTML(rows, o = {}) {

/* tiny trend line for the hero (white on dark) */
function sparkSVG(vals, w = 340, h = 54) {
  if (vals.length < 2) return '';

  const pts = vals.map((v, i) => [pad + i / (vals.length - 1) * (w - 2 * pad), pad + (1 - (v - mn) / rng) * (h - 2 * pad)]);
  const id = 'sp' + (++CH_ID), last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#' + id + ')" points="' + pts.map(p => p.join(',')).join(' ') + ' ' + last[0] + ',' + h + ' ' + pts[0][0] + ',' + h + '"/><polyline fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".92" points="' + pts.map(p => p.join(',')).join(' ') + '"/><circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.6" fill="#fff"/></svg>';

  xs.forEach(x => { o.req += x.req; o.paid += x.paid; o.out += x.out; o.adv += x.adv; o.shortfall += x.shortfall; });
  return statusOf(o, o.req);
}

function txRows() {

  let rows = UI.txIds ? R.led.filter(e => UI.txIds.includes(e.id)) : sel([]);
  if (UI.txsrc !== 'All') rows = rows.filter(e => e.src === UI.txsrc);
  if (UI.txcls === 'Needs review') rows = rows.filter(e => e.flags.length || e.kind === 'oth' || e.cat === 'Uncategorised');
  else if (UI.txcls !== 'All') rows = rows.filter(e => e.kind === UI.txcls);
  if (q) rows = rows.filter(e => (e.desc + ' ' + e.person + ' ' + e.payee + ' ' + e.cat + ' ' + e.purpose + ' ' + e.amt).toLowerCase().includes(q));
  const dflt = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.row || 0) - (a.row || 0);
  const st = UI.txsort;
  if (!st) return rows.slice().sort(dflt);
  const key = {date: e => e.date, src: e => e.src, person: e => e.person || '', purpose: e => e.purpose || '', kind: e => KIND_LABEL[e.kind], cat: e => e.cat || '', mode: e => e.mode || '', amt: e => e.amt, desc: e => (e.desc || '').toLowerCase()}[st.k];
  const dir = st.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((a, b) => { const x = key(a), y = key(b); const c = typeof x === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true}); return c ? c * dir : dflt(a, b); });

function sortVal(td) {
  if (!td) return null;
  if (td.dataset.v != null) { const n = parseFloat(td.dataset.v); return isNaN(n) ? td.dataset.v : n; }
  const t = td.textContent.trim(); if (!t || t === '—') return null;
  let m = t.match(/^(\d{1,2}) ([A-Z][a-z]{2}) (\d{4})/); if (m) return Date.UTC(+m[3], MS.indexOf(m[2]), +m[1]);
  m = t.match(/^([A-Z][a-z]+) (\d{4})/); if (m) { const i = MFULL.indexOf(m[1]); if (i >= 0) return Date.UTC(+m[2], i, 1); }
  m = t.replace(/[,\s]/g, '').match(/^([−-]?)₹?([−-]?)(\d+(?:\.\d+)?)/); if (m) return (m[1] || m[2] ? -1 : 1) * parseFloat(m[3]);
  return t.toLowerCase();
}
function initSortables() {
  $$('#view table.t').forEach((tb, ti) => {
    if (tb.dataset.nosort !== undefined || tb.closest('.report')) return;
    const body = tb.tBodies[0]; if (!body || body.rows.length < 2) return;
    tb.dataset.sid = UI.tab + '#' + ti;

function applySort(tb) {
  const st = UI.sorts[tb.dataset.sid], body = tb.tBodies[0], rows = [...body.rows];
  [...tb.tHead.rows[0].cells].forEach(th => th.removeAttribute('aria-sort'));
  if (!st) rows.sort((a, b) => a.dataset.i - b.dataset.i);
  else {
    const dir = st.dir === 'asc' ? 1 : -1, vals = new Map(rows.map(r => [r, sortVal(r.cells[st.ci])]));
    rows.sort((a, b) => {
      const x = vals.get(a), y = vals.get(b);
      if (x == null && y == null) return a.dataset.i - b.dataset.i;
      if (x == null) return 1; if (y == null) return -1;
      let c;
      if (typeof x === 'number' && typeof y === 'number') c = x - y;
      else if (typeof x === 'number') c = -1; else if (typeof y === 'number') c = 1;
      else c = x.localeCompare(y, undefined, {numeric: true});

    const added = p.tx.filter(t => !prev.has(t.id)).length, removed = S.tx.filter(t => !now.has(t.id)).length, kept = p.tx.length - added;

      (Math.abs(total - (p.meta.statementBalance ?? total)) > S.cfg.tol ? '<div class="callout warn mt">The rows add up to ' + inr2(total) + ' but the statement says ' + inr2(p.meta.statementBalance) + '. The difference will show as an exception.</div>' : '<div class="callout pos mt">' + (p.meta.statementBalance != null ? 'Rows add up to the statement balance.' : 'Rows read cleanly.') + '</div>') +

      if (parts.some(x => !x.cat)) err.push('Choose a category for every part.');
      if (parts.some(x => !(x.amt > 0))) err.push('Every part needs an amount above zero.');
      if (Math.abs(tot - total) > 0.005) err.push('The parts add up to ' + inr2(tot) + ' but the payment is ' + inr2(total) + '.');
      if (err.length) { const m = $('#tx-msg'); m.style.display = ''; m.innerHTML = err.map(esc).join('<br>'); return; }
      o.split = parts;
    }
    if (g('#tx-cat')) o.cat = g('#tx-cat'); if (g('#tx-mode')) o.mode = g('#tx-mode'); if (g('#tx-med')) o.med = g('#tx-med');
    if ($('#tx-inv') && g('#tx-inv') !== 'Deployed') o.inv = g('#tx-inv'); if (g('#tx-note').trim()) o.note = g('#tx-note').trim();
    if (Object.keys(o).length) S.overlay[id] = o; else delete S.overlay[id];
    closeModal(); persist(); refresh(); toast('Saved');
  },
  clearOv: el => { delete S.overlay[el.dataset.arg]; closeModal(); persist(); refresh(); },
  exportTx: () => { const rows = txRows(); saveFile('transactions.csv', toCSV([['Date', 'Source', 'Person', 'Original purpose', 'Treated as', 'Category', 'Mode', 'Amount', 'Description']].concat(rows.map(e => [e.date, e.src, e.person, e.purpose, KIND_LABEL[e.kind], e.cat, e.mode, e.amt, e.desc]))), 'text/csv'); },
  addCash: () => { openModal(cashModal()); cashModalSync(); },
  editCash: el => { openModal(cashModal(el.dataset.arg)); const c = S.cash.find(x => x.id === el.dataset.arg); if (c) $('#cf-sub').dataset.cur = c.sub || ''; cashModalSync(); },
  delCash: el => confirmModal('Delete cash entry', '<p>Remove this cash entry? Bank rows are not affected.</p>', 'Delete', () => { S.cash = S.cash.filter(c => c.id !== el.dataset.arg); persist(); refresh(); }, true),
  saveCash: el => {
    const id = el.dataset.arg, g = s => $(s).value, dir = g('#cf-dir'), cls = g('#cf-cls'), amt = parseFloat(g('#cf-amt')), msg = $('#cf-msg');
    const errs = [], warns = [];
    if (!validISO(g('#cf-date'))) errs.push('Enter a valid date.');
    if (!(amt > 0)) errs.push('Enter an amount greater than zero.');
    if (dir === 'Receipt' && !isBro(g('#cf-person'))) errs.push('Choose which brother the cash came from.');
    if (dir === 'Payment' && cls !== 'Investment' && !g('#cf-cat')) errs.push('Choose a category.');
    if (!g('#cf-desc').trim()) errs.push('Add a short description so the entry can be explained later.');
    const acct = g('#cf-acct') === 'Cash' ? 'Cash' : ACCOUNTS[1];
    if (errs.length) { msg.style.display = ''; msg.className = 'callout neg'; msg.innerHTML = errs.map(esc).join('<br>'); return; }
    if (acct === 'Cash' && g('#cf-mode') !== 'Cash') warns.push('The payment mode is ' + g('#cf-mode') + ', which normally shows in the bank statement. Change the mode to Cash if this was real cash.');
    const entry = {id: id || uid(), date: g('#cf-date'), dir, by: g('#cf-by'), person: g('#cf-person'), mode: g('#cf-mode'), acct, cls, cat: dir === 'Payment' && cls !== 'Investment' ? g('#cf-cat') : '', sub: g('#cf-sub'), med: cls === 'Medical' ? g('#cf-med') : '', src: dir === 'Payment' ? g('#cf-src') : 'Cash in hand', desc: g('#cf-desc').trim(), amt: r2(amt), ref: g('#cf-ref').trim(), note: g('#cf-note').trim()};
    if (!/^ATM/i.test(entry.src)) { const dup = possibleBankDup(entry); if (dup.length) warns.push('A bank row of the same amount exists on ' + dFull(dup[0].date) + ' (' + dup[0].person + '). If this is the same money, do not add it here.'); }
    if (warns.length && !el.dataset.ok) { msg.style.display = ''; msg.className = 'callout warn'; msg.innerHTML = warns.map(esc).join('<br>') + '<br><b>Click Save again to keep it anyway.</b>'; el.dataset.ok = '1'; return; }
    const i = S.cash.findIndex(c => c.id === entry.id); if (i >= 0) S.cash[i] = entry; else S.cash.push(entry);
    closeModal(); persist(); refresh(); toast('Cash entry saved');
  },
  exportCash: () => saveFile('cash-ledger.csv', toCSV([['Date', 'Direction', 'By', 'Person', 'Mode', 'Account', 'Class', 'Category', 'Subcategory', 'Source of cash', 'Amount', 'Description', 'Reference', 'Notes']].concat(S.cash.map(c => [c.date, c.dir, c.by, c.person, c.mode, c.acct, c.cls, c.cat, c.sub, c.src, c.amt, c.desc, c.ref, c.note]))), 'text/csv'),
  pdfReport: async () => { const P = periodInfo(), d = reportData(P.sel); try { const buf = makeReportPDF(d); await saveFile('family-fund-report-' + d.m + '.pdf', buf, 'application/pdf'); } catch (e) { toast('Could not build the PDF: ' + e.message); } },
  copyReport: async () => { const t = whatsappText(reportData(periodInfo().sel)); try { await navigator.clipboard.writeText(t); toast('Copied. Paste it into WhatsApp.'); } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied. Paste it into WhatsApp.'); } catch (e2) { openModal('<div class="modal-bg" data-modal><div class="modal"><h2>Copy this text</h2><div class="field"><textarea rows="14" readonly>' + esc(t) + '</textarea></div><div class="foot"><button class="btn primary" data-act="closeModal">Close</button></div></div></div>'); } ta.remove(); } },
  addPlan: () => { const last = R.months.length ? R.months[R.months.length - 1] : todayISO().slice(0, 7); S.cfg.plan.push({id: uid(), from: addMonths(last, 1), brother: 'All', type: 'Household', amount: 10000, status: 'Active'}); persist(); refresh(); },
  delPlan: el => { S.cfg.plan = S.cfg.plan.filter(p => p.id !== el.dataset.arg); persist(); refresh(); },
  saveCats: () => {
    const cats = {}; $('#cat-t').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => { const [k, ...r] = l.split(':'); cats[k.trim()] = r.join(':').split(',').map(s => s.trim()).filter(Boolean); });
    if (!Object.keys(cats).length) { toast('Add at least one category.'); return; }
    S.cfg.categories = cats; persist(); refresh(); toast('Categories saved');
  },
  addRule: () => { const k = $('#rl-k').value.trim(); if (!k) { toast('Enter the text to match.'); return; } S.cfg.rules.push({kw: k, cat: $('#rl-c').value}); persist(); refresh(); },
  delRule: el => { S.cfg.rules.splice(+el.dataset.arg, 1); persist(); refresh(); },
  backup: () => saveFile('family-fund-backup-' + todayISO() + '.json', JSON.stringify(S), 'application/json'),
  pickBackup: () => $('#file').click(),
  resetAll: () => confirmModal('Erase everything', '<p>This deletes the imported transactions, cash entries, plan and notes from this browser. Save a backup first if unsure.</p>', 'Erase', () => { S = defaults(); persist(); UI.f = {year: 'All', month: 'All', brother: 'All', ctype: 'All', cat: 'All', mode: 'All', ttype: 'All'}; refresh(); toast('Erased'); }, true)
};
ACT.editTx = el => {
  const e = R.byId[el.dataset.arg]; if (!e) return;
  if (e.src === 'Cash') { ACT.editCash({dataset: {arg: e.id}}); return; }
  openModal(txModal(e.parentId || e.id)); splitRem();
};
function splitRem() {
  const box = $('#sp-box'), r = $('#sp-rem'); if (!box || !r) return;
  if (!$$('.sp-row').length) { r.textContent = ''; return; }
  const rem = r2(+box.dataset.total - $$('.sp-amt').reduce((a, i) => a + (parseFloat(i.value) || 0), 0));
  r.innerHTML = Math.abs(rem) < 0.005 ? '<b class="tone-pos">Adds up to ' + inr2(+box.dataset.total) + '</b>' : '<b class="' + (rem < 0 ? 'tone-neg' : '') + '">' + (rem > 0 ? 'Still to allocate ' : 'Over by ') + inr2(Math.abs(rem)) + '</b>';
}

/* ============ delegated events ============ */
document.addEventListener('click', ev => {
  const sth = ev.target.closest('th.sortable'); if (sth && !sth.dataset.act && sth.closest('table').dataset.sid) { toggleSort(sth); return; }
  const bg = ev.target.closest('[data-modal]'); if (bg && ev.target === bg) { closeModal(); return; }
  const insideMore = ev.target.closest('.more-wrap');
  const el = ev.target.closest('select.qedit') ? null : ev.target.closest('[data-act]');
  if (UI.filtersOpen && !insideMore) { UI.filtersOpen = false; renderFilters(); }
  if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if ($('#modalRoot').firstChild) closeModal(); else if (UI.filtersOpen) { UI.filtersOpen = false; renderFilters(); } }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches) {
    if (ev.target.matches('tr[data-act],th[data-act]')) { ev.preventDefault(); ACT[ev.target.dataset.act](ev.target); }
    else if (ev.target.matches('th.sortable') && ev.target.closest('table').dataset.sid) { ev.preventDefault(); toggleSort(ev.target); }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'file') { const f = t.files[0]; t.value = ''; handleFile(f); return; }
  if (t.dataset.qcat !== undefined || t.dataset.qmode !== undefined) {
    const id = t.dataset.qcat !== undefined ? t.dataset.qcat : t.dataset.qmode, key = t.dataset.qcat !== undefined ? 'cat' : 'mode';
    const ov = Object.assign({}, S.overlay[id]);
    if (t.value) ov[key] = t.value; else delete ov[key];
    if (Object.keys(ov).length) S.overlay[id] = ov; else delete S.overlay[id];
    persist(); refresh(); return;
  }
  if (t.dataset.f) {
    const k = t.dataset.f; UI.f[k] = t.value; if (k !== 'year' && k !== 'month') t.classList.toggle('on', t.value !== 'All');
    if (k === 'year') { if (t.value === 'All') UI.f.month = 'All'; else if (UI.f.month === 'All') UI.f.month = String(+R.months[R.months.length - 1].slice(5, 7)); renderFilters(); }
    if (EXTRA_KEYS.includes(k)) { const btn = $('.more-wrap [data-act="moreFilters"]'); if (btn) { const n = activeExtraCount(); btn.innerHTML = 'Filters' + (n ? ' <span class="chipcount">' + n + '</span>' : ''); btn.classList.toggle('on', n > 0); } }
    UI.txpage = 0; renderView(); return;
  }
  if (t.dataset.ruleP !== undefined || t.dataset.rulePayee !== undefined) { if (!t.value) return; S.cfg.rules.unshift({kw: t.dataset.rulePayee.toLowerCase(), cat: t.value}); persist(); refresh(); toast('Rule added for ' + t.dataset.rulePayee); return; }
  if (t.dataset.plan) { const p = S.cfg.plan.find(x => x.id === t.dataset.plan); if (!p) return; let v = t.value; if (t.dataset.k === 'amount') v = Math.max(0, +v || 0); if (t.dataset.k === 'from' && !/^\d{4}-\d{2}$/.test(v)) return; p[t.dataset.k] = v; persist(); refresh(); return; }
  if (t.dataset.goal) { if (t.dataset.goal === 'ret') S.cfg.goal.ret = Math.max(0, +t.value || 0); else S.cfg.goal.basis = t.value; persist(); renderView(); return; }
  if (t.dataset.txf) { UI[t.dataset.txf] = t.value; UI.txpage = 0; $('#txBody').innerHTML = txTableHTML(); return; }
  if (t.dataset.cfg) {
    const k = t.dataset.cfg; if (k === 'cats') return;
    if (k === 'stmt') { if (!S.meta) S.meta = {file: '', sheet: '', importedAt: new Date().toISOString(), statementBalance: null}; S.meta.statementBalance = t.value === '' ? null : +t.value; }
    else if (k === 'tol') S.cfg.tol = Math.max(0, +t.value || 0);
    else if (k === 'gtarget') S.cfg.goal.target = Math.max(1, +t.value || 1);
    else if (k === 'gstart' && /^\d{4}-\d{2}$/.test(t.value)) S.cfg.goal.start = t.value;
    else if (k === 'gyears') S.cfg.goal.years = Math.min(40, Math.max(1, +t.value || 10));
    else if (k === 'meddef') S.cfg.medicalDefault = t.value;
    persist(); refresh(); return;
  }
  if (t.id === 'cf-dir' || t.id === 'cf-cls' || t.id === 'cf-cat') { if (t.id === 'cf-cat') $('#cf-sub').dataset.cur = ''; cashModalSync(); }
});
let sT;
document.addEventListener('input', ev => {
  if (ev.target.classList && ev.target.classList.contains('sp-amt')) { splitRem(); const m = $('#tx-msg'); if (m) m.style.display = 'none'; }
  if (ev.target.id === 'txq') { UI.txq = ev.target.value; UI.txpage = 0; clearTimeout(sT); sT = setTimeout(() => { $('#txBody').innerHTML = txTableHTML(); }, 180); }
});
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(drawCharts, 150); });
['dragover', 'dragenter'].forEach(n => document.addEventListener(n, ev => { const d = $('#drop'); if (d) { ev.preventDefault(); d.classList.add('drag'); } }));
document.addEventListener('dragleave', () => { const d = $('#drop'); if (d) d.classList.remove('drag'); });
document.addEventListener('drop', ev => { const d = $('#drop'); if (!d) return; ev.preventDefault(); d.classList.remove('drag'); handleFile(ev.dataTransfer.files[0]); });

/* ============ chart tooltips ============ */
const tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.style.display = 'none'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
function placeTip(t, ev) {
  tipEl.textContent = t.dataset.tip; tipEl.style.display = 'block';
  const r = tipEl.getBoundingClientRect(); let x = ev.clientX + 14, y = ev.clientY - r.height - 12;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14; if (y < 8) y = ev.clientY + 18;
  tipEl.style.left = Math.max(8, x) + 'px'; tipEl.style.top = y + 'px';
}
document.addEventListener('mouseover', ev => { const t = ev.target.closest && ev.target.closest('[data-tip]'); if (t) placeTip(t, ev); });
document.addEventListener('mousemove', ev => { if (tipEl.style.display === 'none') return; const t = ev.target.closest && ev.target.closest('[data-tip]'); if (t) placeTip(t, ev); });
document.addEventListener('mouseout', ev => { if (ev.target.closest && ev.target.closest('[data-tip]')) tipEl.style.display = 'none'; });
document.addEventListener('click', ev => { const t = ev.target.closest && ev.target.closest('[data-tip]'); if (t && !ev.target.closest('[data-act]')) { placeTip(t, ev); clearTimeout(placeTip.h); placeTip.h = setTimeout(() => { tipEl.style.display = 'none'; }, 2200); } });

/* ============ start ============ */
derive();
if (R.months.length) defaultFilters();
persist();
renderNav(); renderFilters(); renderView();

</script>
</body>
</html>
