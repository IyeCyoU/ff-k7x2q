<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money status">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Money status</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--ink:#15233b;--muted:#5d6c85;--line:#dde4ee;--soft:#eef2f8;
  --navy:#0f1c33;--navy2:#1a2b48;--blue:#2f5be7;--teal:#0d9793;--violet:#7057d6;
  --red:#b23a4d;--green:#0a7a64;--amber:#8f5a0b;--focus:#3d8bff;
  --on-accent:#fff;--hero-up:#73e2bb;--hero-down:#ff9fae;--hero-line:#8fb0ff;--pad:20px;--rowpad:12px;--gap:20px;--r:12px;--rs:8px;
  --good-bg:#e4f4ec;--good-fg:#156643;--warn-bg:#fff0d2;--warn-fg:#7d4e0c;--bad-bg:#fbe8ec;--bad-fg:#a53a4c;--info-bg:#e8f0ff;--info-fg:#33507f;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1322;--surface:#131e33;--ink:#e5ebf6;--muted:#93a3bf;--line:#25344f;--soft:#1a2740;
    --navy:#08111f;--navy2:#16263f;--blue:#7b9dff;--teal:#39c4bf;--violet:#a08cf5;
    --red:#f08497;--green:#4fcaa6;--amber:#e3b062;--focus:#6db0ff;--on-accent:#0b1322;
    --good-bg:#12362c;--good-fg:#7fe0bd;--warn-bg:#3b2f14;--warn-fg:#f0c77a;--bad-bg:#3d1c26;--bad-fg:#f5a0b0;--info-bg:#1a2c50;--info-fg:#a9c2f5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1322;--surface:#131e33;--ink:#e5ebf6;--muted:#93a3bf;--line:#25344f;--soft:#1a2740;
  --navy:#08111f;--navy2:#16263f;--blue:#7b9dff;--teal:#39c4bf;--violet:#a08cf5;
  --red:#f08497;--green:#4fcaa6;--amber:#e3b062;--focus:#6db0ff;--on-accent:#0b1322;
  --good-bg:#12362c;--good-fg:#7fe0bd;--warn-bg:#3b2f14;--warn-fg:#f0c77a;--bad-bg:#3d1c26;--bad-fg:#f5a0b0;--info-bg:#1a2c50;--info-fg:#a9c2f5;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num,.tabular{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:13.5px;margin:4px 0 0}
h1,h2,h3{margin:0;font-weight:650}
h1{font-family:var(--serif);font-size:32px;line-height:1.15;letter-spacing:-.4px;font-weight:600}
h2{font-size:17px;letter-spacing:-.1px}
h3{font-size:15px}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--navy);color:#b7c6df;position:sticky;top:0;height:100vh;padding:28px 14px 20px;display:flex;flex-direction:column}
.brand{font-family:var(--serif);font-size:23px;color:#fff;padding:0 12px 4px;letter-spacing:-.3px}
.brand-sub{font-size:12.5px;color:#8ea4c6;padding:0 12px 26px}
.rail nav{display:grid;gap:4px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:#b7c6df;padding:11px 12px;border-radius:8px;font-size:14.5px}
.nav-btn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn:hover{background:var(--navy2);color:#fff}
.nav-btn[aria-current="page"]{background:#243b62;background:color-mix(in srgb,var(--navy),#fff 14%);color:#fff}
.rail-foot{margin-top:auto;padding:16px 12px 0;font-size:12.5px;color:#8ea4c6;line-height:1.45}
main{padding:32px 40px 60px;min-width:0;max-width:1320px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.tabbar{display:none}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:9px 14px;line-height:1.2}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.small{padding:6px 11px;font-size:13.5px}
.btn.icon{padding:9px 12px;font-size:17px;line-height:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:var(--gap)}
.stepper{display:flex;align-items:flex-end;gap:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.fld select,.fld input,.search{border:1px solid var(--line);background:var(--surface);border-radius:var(--rs);padding:8px 10px;min-width:0;color:var(--ink)}
.controls .note{margin-left:auto;font-size:13px;color:var(--muted);align-self:center}

/* cards + kpis */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0}
.block{margin-top:var(--gap)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:var(--gap);margin-top:var(--gap)}
.grid.two{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.grid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid>.card{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--gap) - 4px);margin-top:var(--gap)}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:calc(var(--pad) - 2px) var(--pad)}
.kpi .label{font-size:13.5px;color:var(--muted)}
.kpi strong{display:block;font-size:26px;letter-spacing:-.6px;font-weight:680;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.kpi .detail{font-size:13px;color:var(--muted)}
.chg{font-weight:600;white-space:nowrap}
.chg.up{color:var(--green)}.chg.down{color:var(--red)}.chg.flat{color:var(--muted)}

/* hero */
.hero{background:var(--navy);color:#e8effc;border-radius:calc(var(--r) + 4px);padding:28px 30px 20px;border:1px solid var(--navy2)}
.hero-top{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap}
.hero .eyebrow{font-size:14px;color:#9db0d0}
.hero .big{font-family:var(--serif);font-size:56px;line-height:1.05;letter-spacing:-1.5px;font-weight:600;margin:6px 0 8px;font-variant-numeric:lining-nums tabular-nums}
.hero .big small{font-size:.38em;letter-spacing:0;color:#9db0d0;margin-right:8px;font-family:var(--sans);font-weight:500}
.hero .delta{font-size:14.5px;color:#b7c6df}
.hero .delta .up{color:var(--hero-up);font-weight:600}.hero .delta .down{color:var(--hero-down);font-weight:600}
.hero-stats{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:14px 32px;align-content:start}
.hero-stats div{font-size:13px;color:#9db0d0}
.hero-stats strong{display:block;font-size:19px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}
.hero .chart{margin-top:14px}
.hero .readout{font-size:13px;color:#9db0d0;min-height:20px;margin-top:6px}
.hero .chart text{fill:#8ea3c4}
.hero .gl{stroke:var(--navy2)}

/* charts */
.chart{width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font:11.5px var(--sans);fill:var(--muted)}
.gl{stroke:var(--line);stroke-width:1}
.f-blue{fill:var(--blue)}.f-teal{fill:var(--teal)}.f-red{fill:var(--red)}.f-violet{fill:var(--violet)}
.bar{cursor:pointer}.bar:hover{opacity:.72}
.nw-line{fill:none;stroke:var(--hero-line);stroke-width:2.4;stroke-linejoin:round}
.nw-area{fill:var(--hero-line);fill-opacity:.13}
.nw-dot{fill:var(--hero-line);stroke:var(--navy);stroke-width:2}
.nw-guide{stroke:var(--hero-line);stroke-opacity:.5;stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}

/* tracks / rows */
.track{height:8px;border-radius:8px;background:var(--soft);position:relative;overflow:visible}
.track b{display:block;height:100%;border-radius:8px}
.track .tick{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);opacity:.55;border-radius:2px}
.share-row{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:12px;align-items:center;margin:16px 0 4px;font-size:14px}
.share-row .num{text-align:right}
.share-note{font-size:12.5px;color:var(--muted);margin:0 0 4px 108px}
.list{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:var(--rowpad) 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;border-radius:0}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--soft)}
.row .t{font-weight:560;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:560}
.row .amt small{text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}.neu{color:var(--muted)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 2px 6px;border-bottom:2px solid var(--line);margin-top:6px;font-weight:650}
.section-h:first-child{padding-top:0;margin-top:0}
.section-h span:last-child{font-variant-numeric:tabular-nums}

/* spending tree */
.cat{border-bottom:1px solid var(--line)}
.cat .bar-cell{display:block}
.cat summary,.cat .leaf{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(96px,auto);gap:14px;align-items:center;padding:var(--rowpad) 2px;cursor:pointer;list-style:none}
.cat summary::-webkit-details-marker{display:none}
.cat summary:hover,.cat .leaf:hover{background:var(--soft)}
.cat .name{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.cat summary .name::before{content:'';width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);flex:none;transition:transform .12s}
.cat[open] summary .name::before{transform:rotate(45deg)}
.cat .leaf .name{padding-left:15px}
.cat .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:560;white-space:nowrap}
.cat .amt small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cat .kids{padding:0 0 6px 22px;background:transparent}
.cat .kids .leaf{grid-template-columns:minmax(0,1fr) auto;font-size:14px;padding:9px 2px}
.cat .kids .leaf .name{padding-left:0}

/* pills, notices */
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--muted);font-weight:560}
.pill.good{background:var(--good-bg);color:var(--good-fg)}.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.notice{padding:11px 15px;border-radius:10px;font-size:14px;margin-bottom:16px;background:var(--warn-bg);color:var(--warn-fg)}
.notice.info{background:var(--info-bg);color:var(--info-fg)}
.notice button{background:none;border:0;padding:0;text-decoration:underline;color:inherit}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}

/* statements */
.tabs,.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:14px}
.seg button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tabs{margin-bottom:18px;align-items:center}
.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){.tools{margin-left:0;width:100%}}
table.stmt{width:100%;border-collapse:collapse;font-size:14.5px}
table.stmt th,table.stmt td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
table.stmt td{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.stmt tr.st-head th{padding-top:20px;font-weight:650;border-bottom:2px solid var(--line)}
table.stmt tr.st-sub th{padding-left:18px;color:var(--muted)}
table.stmt tr.st-total th,table.stmt tr.st-total td{font-weight:700;background:var(--soft)}
table.stmt tr.st-check th,table.stmt tr.st-check td{color:var(--muted);font-size:13px}
.footnote{font-size:13px;color:var(--muted);margin:14px 0 0}

/* activity */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.search{flex:1;min-width:200px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px;color:var(--muted);gap:10px}
.pager div{display:flex;gap:8px}

/* welcome */
.drop{border:2px dashed var(--line);border-radius:14px;padding:38px 24px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--blue);background:var(--info-bg)}
.drop strong{display:block;font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:8px}
.drop p{margin:0 auto 18px;max-width:46ch;color:var(--muted)}
.drop .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
ol.steps{margin:0;padding-left:20px;color:var(--muted)}
ol.steps li{margin:8px 0}
ol.steps b{color:var(--ink);font-weight:600}
.check{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.check:last-child{border-bottom:0}
.check .pill{align-self:start;justify-self:end}
.check p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:14.5px;margin:0}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-variant-numeric:tabular-nums}
.pref-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}

/* dialog + toast */
dialog{border:0;border-radius:calc(var(--r) + 4px);width:min(720px,94vw);max-height:88vh;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 24px 80px rgba(8,17,31,.35)}
dialog::backdrop{background:rgba(8,17,31,.55)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-body{padding:18px 22px;overflow:auto;max-height:60vh}
.dlg-actions{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:90vw;font-size:14px}

@media (max-width:1100px){
  main{padding:26px 26px 56px}
  .kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.two,.grid.even{grid-template-columns:minmax(0,1fr)}
  .hero .big{font-size:48px}
}
@media (max-width:860px){
  .app{display:block}
  .rail{display:none}
  main{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  h1{font-size:27px}
  .top{margin-bottom:16px}
  .top .btn{padding:8px 12px;font-size:14px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--navy2)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#98abcb;font-size:10.5px;padding:6px 0;border-radius:8px}
  .tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current="page"]{color:#fff;background:#243b62;background:color-mix(in srgb,var(--navy),#fff 14%)}
  .controls{padding:12px;gap:10px}
  .controls .fld{flex:1;min-width:110px}
  .controls .fld select,.controls .fld input{width:100%}
  .controls .note{margin-left:0;width:100%;order:4}
  .controls .fld.mode{order:1}.controls .fld.cur{order:2}.controls .stepper{order:3;width:100%}
  .stepper .fld{flex:1}
  .kpis,.kpis.four{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpis .kpi:first-child:nth-last-child(3){grid-column:1/-1}
  .kpi{padding:15px}.kpi strong{font-size:22px}
  :root{--pad:16px}
  .hero{padding:22px 18px 14px;border-radius:14px}
  .hero .big{font-size:40px;letter-spacing:-1px}
  .hero-stats{width:100%;grid-template-columns:repeat(2,1fr);gap:12px 16px}
  .share-row{grid-template-columns:78px minmax(0,1fr) 54px}
  .share-note{margin-left:90px}
  .cat summary,.cat .leaf{grid-template-columns:minmax(0,1fr) minmax(84px,auto)}
  .cat .bar-cell{display:none}
  .pref-grid{grid-template-columns:1fr}
  .head{flex-wrap:wrap}
}
@media (max-width:860px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}

.top-actions{display:flex;gap:8px;align-items:center}
.icon-btn{padding:8px 10px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.num-in{width:120px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink)}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.goal{border:1px solid var(--line);border-radius:12px;padding:16px}
.goal .btn{margin-top:10px}
.goal-amt{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.lc-light .nw-line{stroke:var(--blue)}.lc-light .nw-area{fill:var(--blue);fill-opacity:.10}.lc-light .nw-dot{fill:var(--blue);stroke:var(--surface)}.lc-light .nw-guide{stroke:var(--muted)}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
details.fx{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
details.fx summary{cursor:pointer}
.diff-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.diff-grid div{background:var(--soft);border-radius:10px;padding:10px 12px}
.diff-grid strong{font-size:20px;font-variant-numeric:tabular-nums}
.dlg-body details summary{cursor:pointer;padding:4px 0}
.lock{position:fixed;inset:0;z-index:60;background:var(--navy);display:grid;place-items:center;padding:24px}
.lock-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:28px;width:min(380px,100%);display:grid;gap:12px;text-align:center}
.lock-card .brand{font-size:24px}

<body>
<div class="app">

<script>
'use strict';
/* ============================================================
   Engine: Moneydance tab-delimited export -> ledger, balances
   ============================================================ */
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
const iso=d=>d.toISOString().slice(0,10);
const D=s=>new Date(s+'T12:00:00Z');
const addMonths=(d,n)=>{const a=D(d);a.setUTCDate(1);a.setUTCMonth(a.getUTCMonth()+n);return iso(a)};
const monthStart=d=>d.slice(0,7)+'-01';
const endMonth=d=>iso(new Date(D(addMonths(d,1)).getTime()-86400000));
const addDays=(d,n)=>iso(new Date(D(d).getTime()+n*86400000));
const daysBetween=(a,b)=>Math.round((D(b)-D(a))/86400000)+1;
const shiftYear=(d,n)=>{const a=D(d),day=a.getUTCDate(),m=a.getUTCMonth();a.setUTCDate(1);a.setUTCFullYear(a.getUTCFullYear()+n);a.setUTCMonth(m);const last=new Date(Date.UTC(a.getUTCFullYear(),m+1,0)).getUTCDate();a.setUTCDate(Math.min(day,last));return iso(a)};
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;

const clean=x=>String(x||'').replace(/\*\*/g,'').replace(/^\d+\.\s*/,'').trim();
const GROUPS={BANK:'Asset',ASSET:'Asset',INVESTMENT:'Asset',SECURITY:'Asset','CREDIT CARD':'Liability',LIABILITY:'Liability',LOAN:'Liability',INCOME:'Income',EXPENSE:'Expense',EQUITY:'Equity'};
function classify(name,type){
  const parts=name.split(':').map(clean),last=parts.at(-1)||'';
  const cm=last.match(/^(\d{4})\s*[-.]/);
  return{group:GROUPS[String(type).toUpperCase()]||'Other',main:parts[0]||'',level2:parts[1]||'',label:last.replace(/^\d{4}\s*[-.]\s*/,''),code:cm?cm[1]:'',leaf:true};
}
function rate(d,c){
  const v=d.fx[c]??d.fx[Object.keys(d.fx).find(k=>k.toUpperCase()===String(c).toUpperCase())];
  return Number.isFinite(v)&&v>0?v:null;
}

/* Rate in force for a currency on a date: the user's own monthly rates when entered
   (base currency per 1 unit), otherwise the current rate saved in the export. */
function fxAt(d,c,date){
  const h=d.fxh&&d.fxh[String(c).toUpperCase()];
  if(h){const key=date.slice(0,7);let best=null;for(const k in h){if(k<=key&&(best===null||k>best)&&Number.isFinite(h[k])&&h[k]>0)best=k}if(best!==null)return h[best]}
  return rate(d,c);
}
function baseCurrency(d){const k=Object.keys(d.fx).find(c=>Math.abs(d.fx[c]-1)<1e-9);return k?k.toUpperCase():''}

function parseTXT(text,filename){
  text=text.replace(/^\uFEFF/,'');
  if(!text.includes('#Currency\t')||!text.includes('#Account\t')||!text.includes('#Date\t'))
    throw new Error('This does not look like a Moneydance tab-delimited export. Export all accounts as tab-delimited text and try again.');
  const lines=[],accounts=[],fx={},errors=[],warnings=[],occ={},seen=new Set();
  let mode='',account=null,refs=0;
  const rows=text.split(/\r?\n/);
  for(let i=0;i<rows.length;i++){
    const raw=rows[i];if(!raw.trim())continue;
    const c=raw.split('\t');
    if(c[0]==='#Currency'){mode='currency';continue}
    if(c[0]==='#Account'){mode='account';continue}
    if(c[0]==='#Date'){mode='transactions';continue}
    if(c[0].startsWith('#')){mode='';continue}
    if(mode==='currency'){
      const r=Number(c[3]);
      if(c[0]&&Number.isFinite(r)&&r>0)fx[c[0]]=1/r;
      else warnings.push('No usable exchange rate for '+(c[0]||'a currency')+' (row '+(i+1)+').');
      continue;
    }
    if(mode==='account'){
      if(!c[0]&&!c[1]){mode='';continue}
      if(c.length<5||!c[1]){errors.push('Invalid account at row '+(i+1));continue}
      if(seen.has(c[1]))errors.push('Duplicate account ID at row '+(i+1));
      seen.add(c[1]);
      account={id:c[1],name:c[0],type:c[2],currency:c[3],opening:Number(c[4]),...classify(c[0],c[2])};
      if(!Number.isFinite(account.opening))errors.push('Invalid opening balance at row '+(i+1));
      accounts.push(account);mode='';continue;
    }
    if(mode==='transactions'){
      if(c[0]==='-'){refs++;continue}
      if(!account||!/^\d{4}\.\d{2}\.\d{2}$/.test(c[0])||!c[2]||c.length<9||c[8].trim()===''){errors.push('Invalid posting at row '+(i+1));continue}
      const date=c[0].replace(/\./g,'-'),parsed=new Date(date+'T12:00:00Z');
      if(!Number.isFinite(parsed.getTime())||iso(parsed)!==date){errors.push('Invalid date at row '+(i+1));continue}
      if(c[6]!==account.name)errors.push('Posting does not match account header at row '+(i+1));
      const amount=Number(c[8].replace(/,/g,''));
      if(!Number.isFinite(amount)){errors.push('Invalid amount at row '+(i+1));continue}
      const tx='TX|'+c[2],key=tx+'|'+account.id,n=occ[key]=(occ[key]||0)+1;
      lines.push({id:key+'|'+String(n).padStart(3,'0'),tx,date,account:account.id,amount,description:c[4]||'',memo:c[7]||'',status:(c[5]||'').trim(),sourceRow:i+1});
    }
  }
  if(!lines.length)errors.push('No dated postings found');
  const names=new Set(accounts.map(a=>a.name));
  for(const a of accounts)a.leaf=![...names].some(n=>n.startsWith(a.name+':'));
  const txCount=new Set(lines.map(l=>l.tx)).size;
  if(refs!==2*(lines.length-txCount))warnings.push('Split references do not add up exactly. Make sure you exported every account.');
  let latest='',earliest='9999-12-31';
  for(const l of lines){if(l.date>latest)latest=l.date;if(l.date<earliest)earliest=l.date}
  return{filename,lines,accounts,fx,errors:errors.slice(0,200),warnings,refs,txCount,latest,earliest};
}

const NW=/^(needs?|wants?)$/i;
const isCash=a=>a.type==='BANK'||(a.type==='ASSET'&&/cash/i.test(a.main));
const pathOf=l=>[l.main,...(l.level2&&l.level2!==l.label?[l.level2]:[]),l.label].filter((x,i,a)=>x&&a.indexOf(x)===i);

function summarize(tx,ls){
  const inc=-sum(ls.filter(l=>l.group==='Income'),l=>l.value),exp=sum(ls.filter(l=>l.group==='Expense'),l=>l.value);
  const cats=ls.filter(l=>l.group==='Income'||l.group==='Expense');
  let kind,amount,cat='';
  if(cats.length){
    kind=inc!==0&&Math.abs(inc)>=Math.abs(exp)?'income':'expense';amount=inc-exp;
    const top=cats.reduce((a,b)=>Math.abs(b.value)>Math.abs(a.value)?b:a);cat=pathOf(top).join(' › ');
  }else{kind='transfer';amount=Math.max(0,...ls.map(l=>Math.abs(l.value)))}
  const accts=[...new Set(ls.filter(l=>!(l.group==='Income'||l.group==='Expense')).map(l=>l.label))];
  const first=ls[0];
  return{tx,date:first.date,description:first.description||'(no description)',kind,amount,cat,accts,ids:new Set(ls.map(l=>l.account)),
    q:(ls.map(l=>l.description+' '+l.memo+' '+l.label+' '+l.main).join(' ')).toLowerCase(),lines:ls};
}

function buildIndex(d){
  const accounts=Object.fromEntries(d.accounts.map(a=>[a.id,a]));
  const cache={},r=(c,date)=>{const key=c+'|'+date.slice(0,7);return key in cache?cache[key]:(cache[key]=fxAt(d,c,date))};
  const lines=d.lines.map(l=>{
    const a=accounts[l.account];
    if(!a)return{...l,a:null,group:'Unknown',value:null};
    const k=r(a.currency,l.date);
    let cat=a;
    if(a.group==='Income'||a.group==='Expense'){const tid=(d.recat&&d.recat[l.id])||(d.catMap&&d.catMap[a.id]),t=tid&&accounts[tid];if(t&&(t.group==='Income'||t.group==='Expense'))cat=t}
    return{...l,a,catId:cat.id,group:cat.group,main:cat.main,level2:cat.level2,label:cat.label,code:cat.code,recat:cat!==a,value:k===null?null:l.amount*k};
  });
  const groups={};for(const l of lines)(groups[l.tx]??=[]).push(l);
  const errors=[],multi=[],good=[],txs=[];
  for(const [tx,ls] of Object.entries(groups)){
    const cur=new Set(ls.map(l=>l.a?.currency));
    const bad=ls.some(l=>!l.a||l.value===null||!DATE_RE.test(l.date)||!Number.isFinite(l.amount));
    const bal=sum(ls,l=>l.amount);
    if(bad||(cur.size===1&&Math.abs(bal)>.02)){
      errors.push({tx,date:ls[0].date,description:ls[0].description,reason:bad?'Missing account or exchange rate':'Debits and credits differ by '+bal.toFixed(2)});continue;
    }
    for(const l of ls)good.push(l);
    if(cur.size>1)multi.push({tx});
    txs.push(summarize(tx,ls));
  }
  txs.sort((a,b)=>b.date.localeCompare(a.date)||a.tx.localeCompare(b.tx));
  let latest='',earliest='9999-12-31';
  for(const l of lines){if(l.date>latest)latest=l.date;if(l.date<earliest)earliest=l.date}
  const ix={accounts,lines,good,groups,errors,multi,txs,latest,earliest,errTx:new Set(errors.map(e=>e.tx))};
  ix.nw=netWorthSeries(d,ix);
  return ix;
}

function netWorthSeries(d,ix){
  if(!ix.good.length)return[];
  const months=[];for(let m=monthStart(ix.earliest);m<=ix.latest;m=addMonths(m,1))months.push(m);
  const mv={};
  for(const l of ix.good){const k=l.date.slice(0,7)+'-01',o=(mv[l.account]??={});o[k]=(o[k]||0)+l.amount}
  const cum={};
  const track=d.accounts.filter(a=>a.group==='Asset'||a.group==='Liability').map(a=>({a,bal:a.opening||0}));
  const kc={},kf=(c,m)=>{const key=c+'|'+m.slice(0,7);return key in kc?kc[key]:(kc[key]=fxAt(d,c,m))};
  return months.map(m=>{
    let assets=0,debt=0;
    for(const t of track){t.bal+=(mv[t.a.id]?.[m]||0);const k=kf(t.a.currency,m);if(k===null)continue;const v=t.bal*k;if(t.a.group==='Asset')assets+=v;else debt-=v}
    return{month:m,assets,debt,net:assets-debt};
  });
}

function balances(d,end,ix){
  const native={};for(const a of d.accounts)native[a.id]=a.opening||0;
  for(const l of ix.good)if(l.date<=end)native[l.account]+=l.amount;
  const kc={},rows=d.accounts.filter(a=>a.leaf||Math.abs(native[a.id])>1e-5).map(a=>{const k=a.currency in kc?kc[a.currency]:(kc[a.currency]=fxAt(d,a.currency,end));return{...a,native:native[a.id],value:k===null?null:native[a.id]*k}});
  const S_=(f)=>sum(rows.filter(f),a=>a.value||0);
  const assets=S_(a=>a.group==='Asset'),debt=-S_(a=>a.group==='Liability'),cash=S_(isCash),
        investments=S_(a=>a.type==='SECURITY'||a.type==='INVESTMENT'),cards=-S_(a=>a.type==='CREDIT CARD');
  return{rows,assets,debt,cash,investments,cards,loans:debt-cards,other:assets-cash-investments,networth:assets-debt,asOf:end>ix.latest?ix.latest:end,missing:rows.filter(a=>a.value===null).length};
}

function actual(d,start,end,ix){
  const lines=ix.good.filter(l=>l.date>=start&&l.date<=end);
  const income=-sum(lines.filter(l=>l.group==='Income'),l=>l.value);
  const ex=lines.filter(l=>l.group==='Expense');
  const expense=sum(ex,l=>l.value);
  const cmap=d.classMap||null,ck=l=>NW.test(l.main)?l.main+' › '+(l.level2||l.label):(l.main||'Uncategorised'),cls=l=>(cmap&&cmap[ck(l)])||(/^needs?$/i.test(l.main)?'needs':/^wants?$/i.test(l.main)?'wants':'other');
  const needs=sum(ex.filter(l=>cls(l)==='needs'),l=>l.value),wants=sum(ex.filter(l=>cls(l)==='wants'),l=>l.value);
  return{income,expense,needs,wants,surplus:income-expense,savingsRate:income>0?(income-expense)/income:null,lines,exLines:ex,incLines:lines.filter(l=>l.group==='Income')};
}

function cashflow(d,start,end,ix){
  const r={operating:0,investing:0,financing:0,translation:0,review:0};
  for(const ls of Object.values(ix.groups)){
    if(ls[0].date<start||ls[0].date>end||ix.errTx.has(ls[0].tx))continue;
    const cash=ls.filter(l=>isCash(l.a));if(!cash.length)continue;
    const net=sum(cash,l=>l.value),non=ls.filter(l=>!isCash(l.a)&&Math.abs(l.amount)>1e-6);
    let key='review';
    if(!non.length)key='translation';
    else if(non.some(l=>l.group==='Income'||l.group==='Expense'))key='operating';
    else if(non.some(l=>l.group==='Liability'||l.group==='Equity'))key='financing';
    else if(non.some(l=>l.group==='Asset'))key='investing';
    r[key]+=net;
  }
  r.opening=balances(d,addDays(start,-1),ix).cash;r.closing=balances(d,end,ix).cash;
  r.net=r.operating+r.investing+r.financing+r.translation+r.review;
  r.difference=r.opening+r.net-r.closing;
  return r;
}

function sampleText(){

  const A={

    add(ds(4),'Family support',[[A.ind,-18000],[A.fam,18000]]);
    add(ds(5),'Electricity and water',[[A.main,-pick(300,460)],[A.util,pick(300,460)]].map((x,i,a)=>i?[x[0],-a[0][1]]:x));
    for(const dd of [4,11,18,25]){const v=pick(210,430);add(ds(dd),'Supermarket',[[A.visa,-v],[A.groc,v]]);visaOwed+=v}
    for(const dd of [8,22]){const v=pick(110,190);add(ds(dd),'Fuel',[[A.visa,-v],[A.fuel,v]]);visaOwed+=v}
    for(const dd of [6,14,27]){const v=pick(55,190);add(ds(dd),'Restaurant',[[A.visa,-v],[A.dine,v]]);visaOwed+=v}
    add(ds(9),'Streaming and apps',[[A.visa,-72],[A.subs,72]]);visaOwed+=72;
    if(rnd()>.35){const v=pick(150,720);add(ds(16),'Shopping',[[A.visa,-v],[A.shop,v]]);visaOwed+=v}
    if(k===3||k===9){const v=pick(1800,2600);add(ds(20),'Flights and hotel',[[A.visa,-v],[A.trip,v]]);visaOwed+=v}
    if(ds(28)<='2026-09-18'){
      add(ds(24),'Card payment',[[A.main,-visaOwed],[A.visa,visaOwed]]);visaOwed=0;
      add(ds(26),'Car loan payment',[[A.main,-900],[A.loan,900]]);
      add(ds(27),'Move to savings',[[A.main,-2000],[A.sav,2000]]);
      add(ds(27),'Monthly investment',[[A.main,-1500],[A.fund,1500]]);
      add(ds(28),'Savings interest',[[A.sav,pick(30,45)],[A.int,-0]].map((x,i,a)=>i?[x[0],-a[0][1]]:x));
      const g=pick(-300,650);add(ds(28),'Fund valuation',[[A.fund,g],[A.gain,-g]]);
    }
  }
  const out=[];
  out.push('#Currency\tID\tName\tRate');

        out.push(['-','','','','','','','',''].join('\t'));
      }
    }
    out.push('');
  }
  return out.join('\n');
}

/* Optional passcode: AES-GCM encryption of everything saved on this device */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let t='';for(let i=0;i<u.length;i++)t+=String.fromCharCode(u[i]);return btoa(t)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const CR={
  available:()=>!!(window.crypto&&crypto.subtle),
  async derive(pass,salt){const km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  async enc(key,text){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text)));return{iv,ct}},
  async dec(key,o){return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:o.iv},key,o.ct))}
};
async function pack(text,key=S.key){return key?{enc:true,...(await CR.enc(key,text))}:{enc:false,text}}
async function unpack(o,key=S.key){if(!o)throw new Error('Nothing saved');if(!o.enc)return o.text;if(!key)throw new Error('Locked');return CR.dec(key,o)}

async function rewrap(newKey){
  const cur=await DB.get('export'),hist=(await DB.get('history'))||[],pl=await DB.get('plan'),out={};
  if(cur&&!cur.text)out.export={...cur,payload:await pack(await unpack(cur.payload),newKey)};
  if(hist.length)out.history=await Promise.all(hist.map(async h=>({...h,payload:await pack(await unpack(h.payload),newKey)})));
  if(pl)out.plan=await pack(await unpack(pl),newKey);
  return out;
}
async function setPasscode(pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await CR.derive(pass,salt),chk=await CR.enc(key,'ok'),data=await rewrap(key);
  store.setLock({salt:b64(salt),check:{iv:b64(chk.iv),ct:b64(chk.ct)}});
  if(Object.keys(data).length)await DB.putMany(data);
  S.key=key;
}
async function clearPasscode(){
  const data=await rewrap(null);
  if(Object.keys(data).length)await DB.putMany(data);
  store.setLock(null);S.key=null;
}

function savePlan(){S.plan.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(async()=>{try{await DB.put('plan',await pack(JSON.stringify(S.plan)))}catch(e){toast('Your plan could not be saved in this browser.')}},250)}
function rebuild(){S.data.fxh=S.plan.fxh;S.data.classMap=S.plan.classMap;S.data.recat=S.plan.recat;S.data.catMap=S.plan.catMap;S.ix=buildIndex(S.data)}

async function loadAll(){
  S.plan=defaultPlan();S.hist=[];
  try{S.hist=(await DB.get('history'))||[]}catch(e){}
  try{const pl=await DB.get('plan');if(pl)S.plan=mergePlan(JSON.parse(await unpack(pl)))}catch(e){}
  try{
    const saved=await DB.get('export');
    if(saved){const text=saved.text??await unpack(saved.payload),p=parseTXT(text,saved.filename);if(!p.errors.length)applyParsed(p,text,saved.importedAt)}
  }catch(e){}
}

function currencies(){
  const set=new Map();for(const a of S.data.accounts)if(a.type!=='SECURITY'&&rate(S.data,a.currency)!==null){const u=String(a.currency).toUpperCase();if(!set.has(u))set.set(u,u)}
  const list=[...set.keys()];list.sort((a,b)=>Math.abs((rate(S.data,a)||0)-1)<1e-9?-1:Math.abs((rate(S.data,b)||0)-1)<1e-9?1:a.localeCompare(b));
  return list;
}
function initPeriod(){
  const L=S.ix.latest;let m=monthStart(L);
  /* current month, unless only the first few days of it are in the data: then the month before */
  if(+L.slice(8,10)<=7&&addMonths(m,-1)>=monthStart(S.ix.earliest))m=addMonths(m,-1);
  S.per={mode:'month',y:+m.slice(0,4),m:+m.slice(5,7),from:m,to:endMonth(m)>L?L:endMonth(m)};S.ctlOpen=false;
}
function applyParsed(p,text,importedAt,sample){
  S.plan??=defaultPlan();
  S.data={accounts:p.accounts,lines:p.lines,fx:p.fx,fxh:S.plan.fxh,classMap:S.plan.classMap,recat:S.plan.recat,catMap:S.plan.catMap};
  S.ix=buildIndex(S.data);S.raw=text||'';
  S.meta={filename:p.filename,importedAt:importedAt||new Date().toISOString(),accounts:p.accounts.length,txCount:p.txCount,postings:p.lines.length,earliest:S.ix.earliest,latest:S.ix.latest,warnings:p.warnings,sample:!!sample};
  const cs=currencies();if(!cs.includes(S.cur))S.cur=cs[0]||'';
  initPeriod();S.q='';S.acct='';S.pg=0;S.mv=null;navReset();
}
async function commitImport(p,text){
  const prev=S.data&&!S.meta.sample?{meta:S.meta,raw:S.raw}:null;
  applyParsed(p,text);
  try{
    if(prev){
      const h=(await DB.get('history'))||[];
      h.unshift({filename:prev.meta.filename,importedAt:prev.meta.importedAt,accounts:prev.meta.accounts,txCount:prev.meta.txCount,latest:prev.meta.latest,payload:await pack(prev.raw)});
      await DB.put('history',h.slice(0,3));
    }
    await DB.put('export',{filename:p.filename,importedAt:S.meta.importedAt,payload:await pack(text)});
    S.hist=(await DB.get('history'))||[];
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  }catch(e){toast('Imported, but this browser would not save it, so it will be gone when you close the page.')}
}

/* Compare a new export with what is loaded now */
function diffData(p){
  const oldD=S.data,oldIx=S.ix;
  const om=new Map(oldD.lines.map(l=>[l.id,l])),nm=new Map(p.lines.map(l=>[l.id,l]));
  const added=[],removed=[],changed=[];
  for(const[id,l]of nm){const o=om.get(id);if(!o)added.push(l);else if(o.amount!==l.amount||o.date!==l.date||o.description!==l.description||o.memo!==l.memo||o.account!==l.account)changed.push({o,l})}
  for(const[id,l]of om)if(!nm.has(id))removed.push(l);
  const oa=new Map(oldD.accounts.map(a=>[a.id,a])),na=new Map(p.accounts.map(a=>[a.id,a]));
  const missing=[...oa.values()].filter(a=>!na.has(a.id)),fresh=[...na.values()].filter(a=>!oa.has(a.id));
  const opening=[...na.values()].filter(a=>oa.has(a.id)&&Math.abs(oa.get(a.id).opening-a.opening)>.005);
  const nd={accounts:p.accounts,lines:p.lines,fx:p.fx,fxh:S.plan.fxh,classMap:S.plan.classMap,recat:S.plan.recat,catMap:S.plan.catMap},nix=buildIndex(nd);
  const before=balances(oldD,oldIx.latest,oldIx).networth,after=balances(nd,nix.latest,nix).networth;
  const txs=a=>new Set(a.map(x=>(x.l||x).tx)).size;
  const flags=[];
  if(missing.length)flags.push(missing.length+' account'+(missing.length>1?'s':'')+' in your current data '+(missing.length>1?'are':'is')+' missing from this file. It may be a partial export.');
  if(p.earliest>oldIx.earliest)flags.push('This file starts later ('+fdate(p.earliest)+') than your current history ('+fdate(oldIx.earliest)+'). Older transactions would disappear.');
  if(p.latest<oldIx.latest)flags.push('This file ends '+fdate(p.latest)+', earlier than your current data ('+fdate(oldIx.latest)+').');
  if(removed.length>Math.max(10,oldD.lines.length*.05))flags.push('More than 5% of your current postings are not in this file.');
  for(const x of closedStatus(nd,nix).filter(x=>x.changed))flags.push('Closed month '+fmonLong(x.mk+'-01')+' would change ('+x.diffs.map(d=>d[0].toLowerCase()).join(', ')+').');
  if(opening.length)flags.push(opening.length+' account'+(opening.length>1?'s have':' has')+' a different opening balance.');
  return{added,removed,changed,missing,fresh,opening,before,after,flags,txAdded:txs(added),txRemoved:txs(removed),txChanged:txs(changed)};
}

/* ============================================================
   Formatting
   ============================================================ */
const conv=v=>v/(rate(S.data,S.cur)||1);
const nf=(dec)=>new Intl.NumberFormat(S.cur==='INR'?'en-IN':'en-GB',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmt=(v,dec=0)=>{if(v===null||v===undefined||!Number.isFinite(v))return'—';if(S.mask)return'••••';let n=conv(v);if(Math.abs(n)<.5*Math.pow(10,-dec))n=0;return nf(dec).format(n).replace('-','−')};
const natf=(v,min,max)=>S.mask?'••••':new Intl.NumberFormat('en-GB',{minimumFractionDigits:min,maximumFractionDigits:max}).format(v).replace('-','−');
const compact=v=>{if(S.mask)return'•';const n=conv(v),a=Math.abs(n);return a>=1e7&&S.cur==='INR'?(n/1e7).toFixed(1)+'Cr':a>=1e6?(n/1e6).toFixed(1)+'m':a>=1e3?(n/1e3).toFixed(0)+'k':n.toFixed(0)};
const pct=v=>v===null||!Number.isFinite(v)?'—':(v*100).toFixed(1)+'%';
const fdate=s=>s?D(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):'—';
const fmon=s=>D(s).toLocaleDateString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'});
const fmonLong=s=>D(s).toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'});
const sign=v=>Math.abs(v)<.005?'neu':v>0?'pos':'neg';
const pill=(t,k='')=>`<span class="pill ${k}">${esc(t)}</span>`;
function change(cur,prev,invert=false){
  if(prev===null||prev===undefined||!Number.isFinite(prev)||Math.abs(prev)<1e-9)return'';
  const d=(cur-prev)/Math.abs(prev),good=invert?d<0:d>0,flat=Math.abs(d)<.0005;
  return`<span class="chg ${flat?'flat':good?'up':'down'}">${flat?'• no change':(d>0?'▲':'▼')+' '+fmt(Math.abs(cur-prev))+' · '+Math.abs(d*100).toFixed(1)+'%'}</span>`;
}

/* ---- variances against your own average ---- */
const monthStatCache=new WeakMap();
function monthStat(m){
  let c=monthStatCache.get(S.ix);if(!c){c={};monthStatCache.set(S.ix,c)}
  const k=m.slice(0,7);if(c[k])return c[k];
  const a=actual(S.data,m,endMonth(m),S.ix),byMain={},byKey={},byCat={},incMain={},byAcct={};
  const ex=a.exLines.filter(l=>!isOneoff(l.tx)),inc=a.incLines.filter(l=>!isOneoff(l.tx));
  for(const l of ex){const mn=l.main||'Uncategorised',kn=l.level2||l.label;byMain[mn]=(byMain[mn]||0)+l.value;byKey[mn+'|'+kn]=(byKey[mn+'|'+kn]||0)+l.value;const ck=catKey(l);byCat[ck]=(byCat[ck]||0)+l.value;const ai=l.catId||l.account;byAcct[ai]=(byAcct[ai]||0)+l.value}
  for(const l of inc){const mn=l.main||'Uncategorised';incMain[mn]=(incMain[mn]||0)-l.value}
  return c[k]={income:-sum(inc,l=>l.value),expense:sum(ex,l=>l.value),needs:sum(ex.filter(l=>lineClass(l)==='needs'),l=>l.value),wants:sum(ex.filter(l=>lineClass(l)==='wants'),l=>l.value),byMain,byKey,byCat,incMain,byAcct};
}
function baseline(s){
  const ix=S.ix,ms=[];
  for(let m=addMonths(monthStart(s),-1);ms.length<3&&m>=monthStart(ix.earliest);m=addMonths(m,-1))if(m>=ix.earliest&&endMonth(m)<=ix.latest)ms.push(m);
  if(!ms.length)return null;
  const st=ms.map(monthStat),n=st.length,avg=fn=>sum(st,fn)/n,map=k=>{const o={};for(const x of st)for(const[kk,v]of Object.entries(x[k]))o[kk]=(o[kk]||0)+v/n;return o};
  return{n,income:avg(x=>x.income),expense:avg(x=>x.expense),needs:avg(x=>x.needs),wants:avg(x=>x.wants),byMain:map('byMain'),byKey:map('byKey'),byCat:map('byCat'),incMain:map('incMain'),byAcct:map('byAcct')};
}
function pace(s,e){const cap=e>S.ix.latest?S.ix.latest:e,days=Math.max(1,daysBetween(s,cap));return S.per.mode==='month'?days/daysBetween(monthStart(s),endMonth(s)):days/30.4375}
function vd(diff,lowerIsGood,kind='avg'){
  if(diff===null||diff===undefined||!Number.isFinite(diff))return null;
  const flat=Math.abs(conv(diff))<.5,good=lowerIsGood?diff<0:diff>0;
  const word=kind==='avg'?(diff>0?' above avg':' below avg'):kind==='budget'?(diff>0?' over budget':' under budget'):kind==='plan'?(diff>0?' above plan':' below plan'):kind==='prev'?' vs prev':' vs last year';
  return{dir:flat?'flat':diff>0?'up':'down',tone:flat?'flat':good?'good':'bad',text:flat?(kind==='budget'?'On budget':kind==='plan'?'On plan':'On average'):fmt(Math.abs(diff))+word,title:(flat?'About the same as ':(diff>0?'Higher than ':'Lower than '))+(kind==='avg'?'your recent average':kind==='budget'?'your budget':'the comparison period')};
}
function chipHTML(d){return d?`<span class="vchip ${d.tone}" title="${d.title}">${d.dir==='flat'?'•':d.dir==='up'?'▲':'▼'} ${d.text}</span>`:''}
const vchip=(diff,low,kind)=>chipHTML(vd(diff,low,kind));
function ptsd(rate,bl){
  if(!bl||bl.income<=0||rate===null||!Number.isFinite(rate))return null;
  const pts=(rate-(bl.income-bl.expense)/bl.income)*100,flat=Math.abs(pts)<.05;
  return{dir:flat?'flat':pts>0?'up':'down',tone:flat?'flat':pts>0?'good':'bad',text:flat?'On average':Math.abs(pts).toFixed(1)+' pts '+(pts>0?'above':'below')+' avg',title:'Compared with your recent average savings rate'};
}
const ptsChip=(rate,bl)=>chipHTML(ptsd(rate,bl));
function vlegend(bl){
  return`<p class="vlegend">${bl?`Compared with your average of the last ${bl.n} full month${bl.n>1?'s':''}, scaled to the days counted.`:'There is not enough earlier history for an average yet.'} <strong>${S.look&&S.look.variance==='bo'?'Blue is better for you, orange is worse.':'Green is better for you, red is worse.'}</strong> Spending <span class="vchip bad">▲ above avg</span> <span class="vchip good">▼ below avg</span> Income and savings are the reverse.${oneoffCount()?` ${oneoffCount()} one-off item${oneoffCount()>1?'s are':' is'} left out of the average.`:''}</p>`;
}

/* ============================================================
   Period handling
   ============================================================ */
const MODES=[['month','Month'],['year','Year'],['ytd','Year to date'],['12m','Last 12 months'],['all','All time'],['custom','Custom']];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function range(){
  const p=S.per,L=S.ix.latest,E=S.ix.earliest;let s,e;
  switch(p.mode){
    case'month':s=`${p.y}-${String(p.m).padStart(2,'0')}-01`;e=endMonth(s);break;
    case'year':s=p.y+'-01-01';e=p.y+'-12-31';break;
    case'ytd':s=L.slice(0,4)+'-01-01';e=L;break;
    case'12m':s=addMonths(monthStart(L),-11);e=L;break;
    case'all':s=E;e=L;break;
    default:s=p.from;e=p.to;
  }
  return[s,e];
}
function prevRange(s,e){
  const p=S.per;let r=null;
  if(p.mode==='month'){const ps=addMonths(s,-1),pe=endMonth(ps);r=[ps,e>S.ix.latest?(()=>{const n=Math.max(1,daysBetween(s,S.ix.latest)),x=addDays(ps,n-1);return x<pe?x:pe})():pe]}
  else if(p.mode==='year'||p.mode==='ytd')r=[shiftYear(s,-1),shiftYear(e,-1)];
  else if(p.mode==='12m')r=[addMonths(s,-12),shiftYear(e,-1)];
  else if(p.mode==='custom'){const n=daysBetween(s,e),pe=addDays(s,-1);r=[addDays(pe,-(n-1)),pe]}
  return r&&r[1]>=S.ix.earliest?r:null;
}
const prevText=e=>S.per.mode==='month'&&e>S.ix.latest?'vs same days last month':'vs previous period';
function years(){const a=+S.ix.earliest.slice(0,4),b=+S.ix.latest.slice(0,4),o=[];for(let y=b;y>=a;y--)o.push(y);return o}

function controlsHTML(){
  const p=S.per;
  let h=`<label class="fld mode"><span>Period</span><select id="c-mode">${MODES.map(([v,t])=>`<option value="${v}" ${p.mode===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
  if(p.mode==='month')h+=`<div class="stepper"><button class="btn icon" data-step="-1" aria-label="Previous month">‹</button><label class="fld"><span>Month</span><select id="c-m">${MONTHS.map((n,i)=>`<option value="${i+1}" ${p.m===i+1?'selected':''}>${n}</option>`).join('')}</select></label><label class="fld"><span>Year</span><select id="c-y">${years().map(y=>`<option ${p.y===y?'selected':''}>${y}</option>`).join('')}</select></label><button class="btn icon" data-step="1" aria-label="Next month">›</button></div>`;
  if(p.mode==='year')h+=`<div class="stepper"><button class="btn icon" data-step="-1" aria-label="Previous year">‹</button><label class="fld"><span>Year</span><select id="c-y">${years().map(y=>`<option ${p.y===y?'selected':''}>${y}</option>`).join('')}</select></label><button class="btn icon" data-step="1" aria-label="Next year">›</button></div>`;
  if(p.mode==='custom')h+=`<label class="fld"><span>From</span><input id="c-from" type="date" value="${p.from}"></label><label class="fld"><span>To</span><input id="c-to" type="date" value="${p.to}"></label>`;
  const cs=currencies();

  const age=Math.max(0,Math.floor((Date.now()-D(S.ix.latest).getTime())/864e5)),fresh=S.meta&&S.meta.sample?'':(age<=3?pill('Up to date','good'):age<=14?pill(age+' days old',''):pill(age+' days old','warn'));
  h+=`<div class="note">Data through <strong>${fdate(S.ix.latest)}</strong> ${fresh}</div><button class="btn small pb-done" id="pb-done" type="button">Done</button>`;

function bindControls(){
  const p=S.per,el=$('controls');

    if(m==='custom'){p.from=s;p.to=en}

/* ============================================================
   Charts (hand-drawn SVG, sized to their container)
   ============================================================ */
function barChart(w,spec){
  const rows=spec.rows,series=spec.series,H=spec.h||230,L=44,R=8,T=12,B=28;
  const vals=rows.flatMap(r=>series.map(s=>r[s.key])).filter(Number.isFinite);
  if(!vals.length)return'<div class="empty">No values for this period.</div>';
  let min=Math.min(0,...vals),max=Math.max(1,...vals);const pad=(max-min)*.08;max+=pad;if(min<0)min-=pad;
  const y=v=>T+(max-v)/(max-min)*(H-T-B),step=(w-L-R)/Math.max(1,rows.length),bw=Math.max(4,Math.min(26,step/(series.length+.8)));
  let svg=`<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="${esc(spec.label)}">`;
  for(let i=0;i<5;i++){const v=min+(max-min)*i/4;svg+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  const every=Math.max(1,Math.ceil(rows.length/Math.max(1,Math.floor((w-L)/52))));
  rows.forEach((r,i)=>{
    const cx=L+step*i+step/2;
    series.forEach((s,j)=>{
      const v=r[s.key];if(!Number.isFinite(v))return;
      const yy=Math.min(y(v),y(0)),hh=Math.max(1,Math.abs(y(v)-y(0)));
      svg+=`<rect class="bar ${s.cls}" ${spec.click?`data-month="${r.month}" tabindex="0" role="button" aria-label="Open ${esc(fmon(r.month))}"`:''}${spec.tip?` data-tip="${esc(spec.tip(r))}"`:''} x="${cx-series.length*bw/2+j*bw+.5}" y="${yy}" width="${bw-1.5}" height="${hh}" rx="2"><title>${esc(fmon(r.month)+' · '+s.label+': '+S.cur+' '+fmt(v))}</title></rect>`;
    });
    if(i%every===0)svg+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(fmon(r.month))}</text>`;
  });
  return svg+'</svg>';
}
function lineChart(w,spec){
  const pts=spec.points,H=spec.h||190,L=46,R=10,T=12,B=26;
  if(pts.length<2)return'<div class="empty" style="padding:24px 0">Net worth history appears once there are two months of data.</div>';
  const vs=pts.map(p=>p.v).concat(Number.isFinite(spec.ref)?[spec.ref]:[]);let min=Math.min(...vs),max=Math.max(...vs);const pad=(max-min||Math.abs(max)||1)*.12;min-=pad;max+=pad;
  const x=i=>L+i*(w-L-R)/(pts.length-1),y=v=>T+(max-v)/(max-min)*(H-T-B);
  const id=spec.id||'nw';
  let svg=`<svg class="${spec.tone==='light'?'lc-light':''}" viewBox="0 0 ${w} ${H}" role="img" aria-label="${esc(spec.label)}" data-w="${w}">`;
  for(let i=0;i<4;i++){const v=min+(max-min)*i/3;svg+=`<line class="gl" x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  const base=H-B;
  if(Number.isFinite(spec.ref))svg+=`<line class="ref" x1="${L}" x2="${w-R}" y1="${y(spec.ref)}" y2="${y(spec.ref)}"/><text x="${w-R-4}" y="${y(spec.ref)-5}" text-anchor="end" class="ref-t">Reserve</text>`;
  svg+=`<path class="nw-area" d="M${x(0)},${base} ${pts.map((p,i)=>'L'+x(i)+','+y(p.v)).join(' ')} L${x(pts.length-1)},${base}Z"/>`;
  svg+=`<path class="nw-line" d="${pts.map((p,i)=>(i?'L':'M')+x(i)+','+y(p.v)).join(' ')}"/>`;
  const every=Math.max(1,Math.ceil(pts.length/Math.max(1,Math.floor((w-L)/58))));
  pts.forEach((p,i)=>{if(i%every===0||i===pts.length-1&&every===1)svg+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${esc(fmon(p.month))}</text>`});
  svg+=`<line class="nw-guide" id="${id}-guide" x1="0" x2="0" y1="${T}" y2="${base}" style="display:none"/><circle class="nw-dot" id="${id}-dot" r="5" cx="0" cy="0" style="display:none"/>`;
  svg+=`<rect id="${id}-hit" x="${L}" y="${T}" width="${w-L-R}" height="${base-T}" fill="transparent"/>`;
  return svg+'</svg>';
}
function legend(series){return`<div class="legend">${series.map(s=>`<span><i class="${s.cls}" style="background:var(--${s.color})"></i>${esc(s.label)}</span>`).join('')}</div>`}
function paintCharts(){
  document.querySelectorAll('[data-chart]').forEach(el=>{
    const spec=S.charts[el.dataset.chart];if(!spec)return;
    const w=Math.max(280,Math.floor(el.clientWidth));
    el.innerHTML=spec.type==='line'?lineChart(w,spec):barChart(w,spec);
    if(spec.type==='line'){
      const id=spec.id||'nw',svg=el.querySelector('svg'),hit=el.querySelector('#'+id+'-hit');if(!svg||!hit)return;
      const pts=spec.points,L=46,R=10,H=spec.h||190,T=12,B=26,readout=$(id+'-read');
      const move=ev=>{
        const rect=svg.getBoundingClientRect(),px=(ev.clientX-rect.left)*(w/rect.width);
        const i=Math.max(0,Math.min(pts.length-1,Math.round((px-L)/((w-L-R)/(pts.length-1)))));
        const xx=L+i*(w-L-R)/(pts.length-1);
        const vs=pts.map(p=>p.v).concat(Number.isFinite(spec.ref)?[spec.ref]:[]);let mn=Math.min(...vs),mx=Math.max(...vs);const pad=(mx-mn||Math.abs(mx)||1)*.12;mn-=pad;mx+=pad;
        const yy=T+(mx-pts[i].v)/(mx-mn)*(H-T-B);
        const g=$(id+'-guide'),d=$(id+'-dot');g.setAttribute('x1',xx);g.setAttribute('x2',xx);g.style.display='';d.setAttribute('cx',xx);d.setAttribute('cy',yy);d.style.display='';
        if(readout)readout.textContent=fmonLong(pts[i].month)+' · '+S.cur+' '+fmt(pts[i].v);
      };
      const leave=()=>{$(id+'-guide').style.display='none';$(id+'-dot').style.display='none';if(readout)readout.textContent=spec.rest||''};
      hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);hit.addEventListener('pointerleave',leave);
    }
  });
  document.querySelectorAll('[data-month]').forEach(el=>{
    const go=()=>{const m=el.dataset.month;S.per.mode='month';S.per.y=+m.slice(0,4);S.per.m=+m.slice(5,7);render()};
    el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
  });
}

function pieHTML(slices,label){
  const tot=slices.reduce((a,x)=>a+x.v,0),sl=slices.filter(x=>x.v>0.005);
  if(!(tot>0)||!sl.length)return'<div class="empty" style="padding:24px 0">Nothing to show for this period.</div>';
  const C=100,R=92,pt=a=>[C+R*Math.sin(a),C-R*Math.cos(a)];let a0=0,paths='';
  for(const x of sl){
    const fr=x.v/tot,a1=a0+fr*2*Math.PI,tip=esc(x.label+': '+S.cur+' '+fmt(x.v)+' ('+(fr*100).toFixed(1)+'%)');
    if(sl.length===1)paths+=`<circle class="sl" cx="${C}" cy="${C}" r="${R}" fill="${x.color}" tabindex="0"><title>${tip}</title></circle>`;
    else{const[p,q]=[pt(a0),pt(a1)];paths+=`<path d="M${C} ${C}L${p[0].toFixed(2)} ${p[1].toFixed(2)}A${R} ${R} 0 ${fr>.5?1:0} 1 ${q[0].toFixed(2)} ${q[1].toFixed(2)}Z" fill="${x.color}" tabindex="0"><title>${tip}</title></path>`}
    a0=a1;
  }
  return`<div class="pie-wrap"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(label)}">${paths}</svg><div class="pie-leg">${sl.map(x=>`<div><i style="background:${x.color}"></i><span>${esc(x.label)}</span><b>${(x.v/tot*100).toFixed(1)}%</b><small>${esc(S.cur)} ${fmt(x.v)}${x.note?' · '+esc(x.note):''}</small></div>`).join('')}</div></div>`;
}
function overviewPies(){
  const[s,e]=range(),d=S.data,ix=S.ix,a=actual(d,s,e,ix),b=balances(d,e,ix);
  const other=Math.max(0,a.expense-a.needs-a.wants),saved=Math.max(0,a.surplus),T=S.targets;
  const sp=[{label:'Needs',v:a.needs,color:'var(--blue)',note:a.income>0?'target '+T.needs+'% of income':''},{label:'Wants',v:a.wants,color:'var(--teal)',note:a.income>0?'target '+T.wants+'% of income':''}];
  if(other>Math.max(1,a.income*.01))sp.push({label:'Other spending',v:other,color:'var(--muted)'});
  sp.push({label:'Savings',v:saved,color:'var(--violet)',note:a.income>0?'target '+T.save+'% of income':''});
  const deficit=a.surplus<0?`<p class="footnote" style="margin-top:10px">Spending was ${esc(S.cur)} ${fmt(-a.surplus)} more than income, so there is no saving to show. Shares are of total spending.</p>`:`<p class="footnote" style="margin-top:10px">Shares of income. Needs, wants and savings add up to 100%.</p>`;
  const kind=r=>r.type==='SECURITY'||r.type==='INVESTMENT'?'Investments':isCash(r)?'Cash and bank':null;
  const al={};for(const r of b.rows){if(r.group!=='Asset'||!(r.value>0.005))continue;const k=kind(r)||(r.type==='ASSET'?'Other assets':String(r.type||'Other').charAt(0)+String(r.type||'other').slice(1).toLowerCase());al[k]=(al[k]||0)+r.value}
  const pal=['var(--blue)','var(--teal)','var(--violet)','var(--muted)','#c9892b','#b4506b'],order=['Cash and bank','Investments'];
  const keys=Object.keys(al).sort((x,y)=>(order.indexOf(x)<0?9:order.indexOf(x))-(order.indexOf(y)<0?9:order.indexOf(y))||al[y]-al[x]);
  const asl=keys.map((k,i)=>({label:k,v:al[k],color:pal[i%pal.length]}));
  return`<div class="pies"><section class="card" data-blk="spend"><div class="head"><div><h2>Needs, wants and savings</h2><p class="sub">Where income went · ${esc(periodLabel())}</p></div></div>${a.expense>0||a.income>0?pieHTML(a.surplus<0?sp.map(x=>x.label==='Savings'?{...x,v:0}:x):sp,'Needs, wants and savings'):'<div class="empty" style="padding:24px 0">No activity in this period.</div>'}${deficit}</section>
  <section class="card" data-blk="assets"><div class="head"><div><h2>Asset allocation</h2><p class="sub">What you own · as of ${esc(fdate(b.asOf))}</p></div></div>${pieHTML(asl,'Asset allocation')}<p class="footnote" style="margin-top:10px">Total assets ${esc(S.cur)} ${fmt(b.assets)}. Liabilities are not included.</p></section></div>`;
}

/* ---- Overview layout: drag, resize and reorder the cards ---- */
const OV_DEFAULT=[['hero',2],['kpis',2],['health',2],['spend',1],['assets',1],['flow',1],['went',1],['att',1],['coming',1]];
const OV_NAMES={hero:'Net worth and chart',kpis:'Income, spending and savings rate',health:'Financial health',spend:'Needs, wants and savings',assets:'Asset allocation',flow:'Income and spending chart',went:'Where the income went',att:'Needs attention',coming:'Coming up'};
function ovLayout(avail){
  const saved=(S.layout&&Array.isArray(S.layout.ov)?S.layout.ov:[]).filter(x=>x&&OV_NAMES[x.id]),out=[],seen=new Set();
  for(const x of saved)if(avail.includes(x.id)&&!seen.has(x.id)){seen.add(x.id);out.push({id:x.id,w:x.w===2?2:1})}
  for(const[id,w]of OV_DEFAULT)if(avail.includes(id)&&!seen.has(id)){seen.add(id);out.push({id,w})}
  return out;
}
function ovSave(order){
  const all=(S.layout&&Array.isArray(S.layout.ov)?S.layout.ov:[]).filter(x=>!order.some(o=>o.id===x.id));
  S.layout={ov:[...order,...all]};store.set();
}
function arrangeOverview(){
  const view=$('view'),els=[...view.querySelectorAll('[data-blk]')];if(!els.length)return;
  const avail=els.map(x=>x.dataset.blk),order=ovLayout(avail),byId={};els.forEach(x=>byId[x.dataset.blk]=x);
  const arranging=!!S.arr;
  const bar=document.createElement('div');bar.className='arrbar';
  bar.innerHTML=arranging?`<span class="hint">Drag the blue handle to move a card, or use the arrows. “Half” and “Full” set its width on wide screens.</span><button class="btn small" id="arr-reset">Reset</button><button class="btn small primary" id="arr-done">Done</button>`:`<button class="btn small" id="arr-btn" title="Move and resize the cards on this page">Arrange layout</button>`;
  const grid=document.createElement('div');grid.className='ovgrid'+(arranging?' arranging':'');grid.id='ovgrid';
  for(const o of order){
    const w=document.createElement('div');w.className='blk w'+o.w;w.dataset.id=o.id;w.appendChild(byId[o.id]);
    if(arranging){
      const t=document.createElement('div');t.className='arrtools';
      t.innerHTML=`<button class="grab" aria-label="Move ${esc(OV_NAMES[o.id])}. Drag, or press the arrow keys." title="Drag to move">⠿ Move</button><button data-up aria-label="Move ${esc(OV_NAMES[o.id])} up" title="Move up">↑</button><button data-dn aria-label="Move ${esc(OV_NAMES[o.id])} down" title="Move down">↓</button><button class="wtog" data-w aria-label="Make ${esc(OV_NAMES[o.id])} ${o.w===2?'half':'full'} width">${o.w===2?'Half':'Full'}</button>`;
      w.prepend(t);
    }
    grid.appendChild(w);
  }
  /* remove the old wrappers and place the new grid */
  [...view.children].forEach(c=>c.remove());view.appendChild(bar);view.appendChild(grid);
  const cur=()=>[...grid.children].map(b=>({id:b.dataset.id,w:b.classList.contains('w2')?2:1}));
  const redo=()=>{ovSave(cur());render()};
  if(!arranging){$('arr-btn').onclick=()=>{S.arr=true;render()};return}
  $('arr-done').onclick=()=>{S.arr=false;render()};
  $('arr-reset').onclick=()=>{S.layout={...(S.layout||{}),ov:[]};store.set();render()};
  grid.querySelectorAll('.blk').forEach(b=>{
    const t=b.querySelector('.arrtools'),grab=t.querySelector('.grab');
    t.querySelector('[data-w]').onclick=()=>{b.classList.toggle('w2');redo()};
    t.querySelector('[data-up]').onclick=()=>{const p=b.previousElementSibling;if(p){grid.insertBefore(b,p);redo()}};
    t.querySelector('[data-dn]').onclick=()=>{const n=b.nextElementSibling;if(n){grid.insertBefore(n,b);redo()}};
    grab.onkeydown=ev=>{if(ev.key==='ArrowUp'||ev.key==='ArrowLeft'){ev.preventDefault();const p=b.previousElementSibling;if(p){grid.insertBefore(b,p);ovSave(cur());render();setTimeout(()=>{const g=$('ovgrid')&&$('ovgrid').querySelector('[data-id="'+b.dataset.id+'"] .grab');g&&g.focus()},30)}}
      if(ev.key==='ArrowDown'||ev.key==='ArrowRight'){ev.preventDefault();const n=b.nextElementSibling;if(n){grid.insertBefore(n,b);ovSave(cur());render();setTimeout(()=>{const g=$('ovgrid')&&$('ovgrid').querySelector('[data-id="'+b.dataset.id+'"] .grab');g&&g.focus()},30)}}};
    let drag=false,px=0,py=0,raf=0;
    const tick=()=>{if(!drag)return;if(py<80)window.scrollBy(0,-16);else if(py>window.innerHeight-80)window.scrollBy(0,16);raf=requestAnimationFrame(tick)};
    const over=()=>{
      const one=getComputedStyle(grid).gridTemplateColumns.split(' ').length<2;
      const hit=[...grid.children].filter(x=>x!==b).find(x=>{const r=x.getBoundingClientRect();return px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom});
      if(!hit)return;const r=hit.getBoundingClientRect(),wide=one||hit.classList.contains('w2')||b.classList.contains('w2');
      const after=wide?py>r.top+r.height/2:px>r.left+r.width/2;
      const ref=after?hit.nextElementSibling:hit;if(ref!==b&&(after?hit.nextElementSibling!==b:hit.previousElementSibling!==b))grid.insertBefore(b,ref);
    };
    grab.onpointerdown=ev=>{if(ev.button>0)return;ev.preventDefault();try{grab.setPointerCapture(ev.pointerId)}catch(e){}drag=true;px=ev.clientX;py=ev.clientY;b.classList.add('drag');raf=requestAnimationFrame(tick)};
    grab.onpointermove=ev=>{if(!drag)return;px=ev.clientX;py=ev.clientY;over()};
    const end=()=>{if(!drag)return;drag=false;cancelAnimationFrame(raf);b.classList.remove('drag');ovSave(cur());render()};
    grab.onpointerup=end;grab.onpointercancel=end;
  });
}

function vSpending(){
  const d=S.data,ix=S.ix,[s,e]=range(),a=actual(d,s,e,ix),pr=prevRange(s,e),pa=pr?actual(d,pr[0],pr[1],ix):null;
  if(e<ix.earliest){$('view').innerHTML='<div class="card empty">No data covers this period. Your history starts '+fdate(ix.earliest)+'.</div>';return}
  const tree={};
  const add=(t,l)=>{
    const m=l.main||'Uncategorised',lv=l.level2||l.label,lb=l.label;
    const M=(t[m]??={v:0,kids:{}});M.v+=l.value;const K=(M.kids[lv]??={v:0,leaves:{},codes:{}});K.v+=l.value;K.leaves[lb]=(K.leaves[lb]||0)+l.value;if(l.code)K.codes[lb]=l.code;
  };
  for(const l of a.exLines)add(tree,l);
  const ptree={};if(pa)for(const l of pa.exLines)add(ptree,l);
  const total=a.expense,mains=Object.entries(tree).sort((x,y)=>y[1].v-x[1].v);
  const days=daysBetween(s,e>ix.latest?ix.latest:e);
  const bl=baseline(s),f=pace(s,e);
  const prevChg=(cur,prev)=>prev?change(cur,prev,true):'';
  const bar=(v,c)=>`<div class="track"><b style="width:${total>0?Math.max(0,Math.min(100,v/total*100)):0}%;background:${c}"></b></div>`;
  const cols=['var(--blue)','var(--teal)','var(--violet)','var(--amber)','var(--red)'];
  const body=mains.map(([mn,M],mi)=>{
    const c=cols[mi%cols.length],pm=ptree[mn];
    const kids=Object.entries(M.kids).sort((x,y)=>y[1].v-x[1].v).map(([kn,K])=>{
      const leaves=Object.entries(K.leaves).sort((x,y)=>y[1]-x[1]),single=leaves.length===1&&leaves[0][0]===kn;
      const share=`<span class="bar-cell">${bar(K.v,c)}</span>`;
      const pk=pm&&pm.kids[kn]?prevChg(K.v,pm.kids[kn].v):'';
      const amt=`<span class="amt">${fmt(K.v)}${bl?`<small>${vchip(K.v-(bl.byKey[mn+'|'+kn]||0)*f,true,'avg')}</small>`:''}<small>${pct(total>0?K.v/total:null)} of total</small>${pk?`<small>${pk} vs prev</small>`:''}</span>`;
      if(single)return`<div class="cat"><div class="leaf" role="button" tabindex="0" data-lines="${esc(mn+'|'+kn+'|'+kn)}"><span class="name">${K.codes[kn]?`<span class="code">${esc(K.codes[kn])}</span>`:''}${esc(kn)}</span>${share}${amt}</div></div>`;
      return`<details class="cat"><summary><span class="name">${esc(kn)}</span>${share}${amt}</summary><div class="kids">${leaves.map(([ln,lv])=>`<div class="leaf" role="button" tabindex="0" data-lines="${esc(mn+'|'+kn+'|'+ln)}"><span class="name">${K.codes[ln]?`<span class="code">${esc(K.codes[ln])}</span>`:''}${esc(ln)}</span><span class="amt">${fmt(lv)}</span></div>`).join('')}</div></details>`;
    }).join('');
    return`<div class="section-h"><span>${esc(mn)}</span><span>${S.cur} ${fmt(M.v)} <span class="muted" style="font-weight:400">· ${pct(total>0?M.v/total:null)}</span> ${bl?vchip(M.v-(bl.byMain[mn]||0)*f,true,'avg'):''}</span></div>${kids}`;
  }).join('');
  $('view').innerHTML=`
  <div class="kpis four">
    ${kpi('Total spending',fmt(total),(bl?`<div class="chips">${vchip(total-bl.expense*f,true,'avg')}</div>`:'')+(pa?`<div class="cmp">${prevChg(total,pa.expense)} ${prevText(e)}</div>`:(bl?'':'Selected period')))}
    ${kpi('Needs',a.needs||a.wants?fmt(a.needs):'—',(bl&&(a.needs||a.wants)?`<div class="chips">${vchip(a.needs-bl.needs*f,true,'avg')}</div>`:'')+(a.income>0&&(a.needs||a.wants)?`<div class="cmp">${pct(a.needs/a.income)} of income</div>`:''))}
    ${kpi('Wants',a.needs||a.wants?fmt(a.wants):'—',(bl&&(a.needs||a.wants)?`<div class="chips">${vchip(a.wants-bl.wants*f,true,'avg')}</div>`:'')+(a.income>0&&(a.needs||a.wants)?`<div class="cmp">${pct(a.wants/a.income)} of income</div>`:''))}
    ${kpi('Per day',fmt(total/Math.max(1,days)),days+' days counted')}
  </div>
  <section class="card block"><div class="head"><div><h2>Spending by category</h2><p class="sub">${esc(S.cur)} · ${esc(periodLabel())}. Select a category to see its transactions. Under each amount: how far it is above or below your average, then its share of the total and the change vs ${S.per.mode==="month"&&e>ix.latest?"the same days last month":"the previous period"}.</p></div></div>${vlegend(bl)}${mains.length?body:'<div class="empty">No spending recorded in this period.</div>'}</section>${donutCard(a)}${payeesCard(a)}`;
  document.querySelectorAll('[data-payee]').forEach(el=>el.onclick=()=>{S.q=el.dataset.payee;S.type='expense';S.acct='';S.pg=0;S.anim=true;S.page='activity';render()});
  document.querySelectorAll('[data-lines]').forEach(el=>{
    const run=()=>{const[mn,kn,ln]=el.dataset.lines.split('|');openLines(mn,kn,ln)};
    el.onclick=run;el.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();run()}};
  });
}

/* ============================================================
   Financial ratios: balance-sheet strength and income health
   ============================================================ */
function ratioSet(s,e){
  const d=S.data,ix=S.ix,b=balances(d,e,ix),a=actual(d,s,e,ix),bl=baseline(s),pr=prevRange(s,e),pa=pr?actual(d,pr[0],pr[1],ix):null;
  const b0=balances(d,addDays(s,-1),ix),T=S.targets;
  const months=Math.max(.2,daysBetween(s,e>ix.latest?ix.latest:e)/30.4375);
  const mSpend=bl&&bl.expense>0?bl.expense:(a.expense/months),mInc=a.income/months;
  let debtPay=0;try{for(const l of loanList()){const c=S.plan.loans[l.id]||{},p=c.payment!=null&&c.payment!==''?+c.payment:l.detected;debtPay+=(p||0)*(fxAt(d,l.cur,ix.latest)||1)}}catch(x){}
  const safe=(n,m)=>m>0.0001?n/m:null;
  const fl=(inc,exp,needs,wants,spendM,incM)=>({ie:safe(inc,exp),sr:inc>0?(inc-exp)/inc:null,ni:safe(needs,inc),wi:safe(wants,inc),di:safe(debtPay,incM)});
  const cur=fl(a.income,a.expense,a.needs,a.wants,mSpend,mInc);
  const prv=pa?fl(pa.income,pa.expense,pa.needs,pa.wants):null;
  const avg=bl?fl(bl.income,bl.expense,bl.needs,bl.wants,0,bl.income):null;
  const bal=(x)=>({al:safe(x.assets,x.debt),da:safe(x.debt,x.assets),cc:x.cards>0.5?safe(x.cash,x.cards):null,cm:safe(x.cash,mSpend),ia:safe(x.investments,x.assets)});
  const B=bal(b),B0=bal(b0);
  const R=[];
  const add=(o)=>R.push(o);
  const times=v=>v===null?'—':v.toFixed(2)+'×',pc=v=>v===null?'—':(v*100).toFixed(1)+'%',mo=v=>v===null?'—':v.toFixed(1)+' months';
  /* band(value) -> good|watch|risk; thresholds are shown on the card */
  const hi=(g,w)=>v=>v===null?null:v>=g?'good':v>=w?'watch':'risk';
  const lo=(g,w)=>v=>v===null?null:v<=g?'good':v<=w?'watch':'risk';
  add({k:'al',grp:'Balance sheet',name:'Assets to liabilities',v:B.al,prev:B0.al,f:times,band:hi(1.5,1)(B.al),hb:true,scale:[0,2.5],t:[1,1.5],rule:'Healthy 1.5× or more · watch 1.0–1.5× · risk below 1.0×',what:'For every 1 you owe, how much you own. Below 1.0× means you owe more than you own.',pvLabel:'since start of period'});
  add({k:'da',grp:'Balance sheet',name:'Debt to assets',v:B.da,prev:B0.da,f:pc,band:lo(.4,1)(B.da),hb:false,scale:[0,2],t:[.4,1],rule:'Healthy up to 40% · watch 40–100% · risk above 100%',what:'Share of everything you own that is financed by debt. Above 100% means net worth is negative.',pvLabel:'since start of period'});
  add({k:'cc',grp:'Balance sheet',name:'Cash to credit-card balance',v:B.cc,prev:B0.cc,f:times,band:hi(1,.5)(B.cc),hb:true,scale:[0,2],t:[.5,1],rule:'Healthy 1.0× or more · watch 0.5–1.0× · risk below 0.5×',what:'Could your cash and bank balances clear the cards today? Card interest is usually your costliest debt.',pvLabel:'since start of period',skip:B.cc===null});
  add({k:'cm',grp:'Balance sheet',name:'Cash runway',v:B.cm,prev:B0.cm,f:mo,band:hi(6,3)(B.cm),hb:true,scale:[0,9],t:[3,6],rule:'Healthy 6+ months · watch 3–6 · risk below 3',what:'How many months your cash and bank balances would cover at your recent monthly spending.',pvLabel:'since start of period'});
  add({k:'ia',grp:'Balance sheet',name:'Investments share of assets',v:B.ia,prev:B0.ia,f:pc,band:null,hb:true,scale:[0,1],t:[.15,.3],rule:'No pass or fail. A higher share means more of your wealth can grow.',what:'How much of what you own is invested rather than sitting in cash, property or other assets.',pvLabel:'since start of period'});
  add({k:'ie',grp:'Income and spending',name:'Income to spending',v:cur.ie,prev:prv&&prv.ie,avg:avg&&avg.ie,f:times,band:hi(1.2,1)(cur.ie),hb:true,scale:[0,2],t:[1,1.2],rule:'Healthy 1.2× or more · watch 1.0–1.2× · risk below 1.0×',what:'For every 1 you spend, how much comes in. Below 1.0× means you spent more than you earned.'});
  add({k:'sr',grp:'Income and spending',name:'Savings rate',v:cur.sr,prev:prv&&prv.sr,avg:avg&&avg.sr,f:pc,band:hi(T.save/100,T.save/200)(cur.sr),hb:true,scale:[-.2,.4],t:[T.save/200,T.save/100],rule:`Healthy ${T.save}% or more (your target) · watch ${T.save/2}–${T.save}% · risk below`,what:'Share of income left after spending.'});
  add({k:'ni',grp:'Income and spending',name:'Needs to income',v:cur.ni,prev:prv&&prv.ni,avg:avg&&avg.ni,f:pc,band:lo(T.needs/100,T.needs/100+.1)(cur.ni),hb:false,scale:[0,1.2],t:[T.needs/100,T.needs/100+.1],rule:`Healthy up to ${T.needs}% (your target) · watch up to ${T.needs+10}% · risk above`,what:'Share of income taken by essentials such as rent, bills, groceries and loan costs.'});
  add({k:'wi',grp:'Income and spending',name:'Wants to income',v:cur.wi,prev:prv&&prv.wi,avg:avg&&avg.wi,f:pc,band:lo(T.wants/100,T.wants/100+.1)(cur.wi),hb:false,scale:[0,1],t:[T.wants/100,T.wants/100+.1],rule:`Healthy up to ${T.wants}% (your target) · watch up to ${T.wants+10}% · risk above`,what:'Share of income going to choices rather than essentials.'});
  add({k:'di',grp:'Income and spending',name:'Debt payments to income',v:cur.di,prev:null,f:pc,band:lo(.2,.36)(cur.di),hb:false,scale:[0,.8],t:[.2,.36],rule:'Healthy up to 20% · watch 20–36% · risk above 36%',what:'Monthly loan payments (from your Debt plan) compared with monthly income.',skip:!(debtPay>0)});
  return{list:R.filter(r=>!r.skip),b,a,asOf:b.asOf,months,debtPay,hasIncome:a.income>0};
}
function ratioChip(r,kind){
  const base=kind==='avg'?r.avg:r.prev;if(base===null||base===undefined||r.v===null)return'';
  const diff=r.v-base,flat=Math.abs(diff)<(r.k==='al'||r.k==='cc'||r.k==='ie'?.005:r.k==='cm'?.05:.0005);
  const good=r.hb?diff>0:diff<0;
  let t;if(r.k==='al'||r.k==='cc'||r.k==='ie')t=Math.abs(diff).toFixed(2)+'×';else if(r.k==='cm')t=Math.abs(diff).toFixed(1)+' mo';else t=(Math.abs(diff)*100).toFixed(1)+' pts';
  const lab=kind==='avg'?'avg':kind==='pv'?(r.pvLabel||'prev'):'prev';
  const word=kind==='avg'?(diff>0?' above avg':' below avg'):kind==='pv'?(diff>0?' higher '+lab:' lower '+lab):(diff>0?' higher than prev':' lower than prev');
  return`<span class="vchip ${flat?'flat':good?'good':'bad'}">${flat?'•':diff>0?'▲':'▼'} ${flat?(kind==='avg'?'On average':'No change'):t+word}</span>`;
}
function ratioCard(r){
  const tone=r.band==='good'?'good':r.band==='watch'?'warn':r.band==='risk'?'bad':'';
  const word=r.band==='good'?'Healthy':r.band==='watch'?'Watch':r.band==='risk'?'Risk':'Info';
  const [lo,hi]=r.scale,pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100)),t1=pos(r.t[0]),t2=pos(r.t[1]);
  const c=(r.hb?['var(--bad-fg)','var(--warn-fg)','var(--good-fg)']:['var(--good-fg)','var(--warn-fg)','var(--bad-fg)']);
  const seg=r.band===null?'<b style="left:0;width:100%;background:var(--line)"></b>':`<b style="left:0;width:${t1}%;background:${c[0]}"></b><b style="left:${t1}%;width:${t2-t1}%;background:${c[1]}"></b><b style="left:${t2}%;width:${100-t2}%;background:${c[2]}"></b>`;
  const mk=r.v===null?'':`<i class="rmark" style="left:${pos(r.v)}%"></i>`;
  const chips=[r.prev!==undefined&&r.prev!==null&&r.pvLabel?ratioChip(r,'pv'):'',r.prev!==undefined&&r.prev!==null&&!r.pvLabel?ratioChip(r,'prev'):'',r.avg!==undefined&&r.avg!==null?ratioChip(r,'avg'):''].join('');
  return`<div class="card ratio ${tone}"><div class="rhead"><span class="rname">${esc(r.name)}</span>${pill(word,tone)}</div><strong class="rval">${r.f(r.v)}</strong><div class="rtrack" role="img" aria-label="${esc(r.name)} ${r.f(r.v)}, ${word}">${seg}${mk}</div><div class="chips">${chips}</div><p class="rwhat">${esc(r.what)}</p><p class="rrule">${esc(r.rule)}</p></div>`;
}
function ratioSummary(rs){
  const bands=rs.list.filter(r=>r.band),g=bands.filter(r=>r.band==='good').length,w=bands.filter(r=>r.band==='watch').length,k=bands.filter(r=>r.band==='risk').length;
  return{g,w,k,n:bands.length};
}
function vRatiosHTML(){
  const[s,e]=range(),rs=ratioSet(s,e),sm=ratioSummary(rs),grp=n=>rs.list.filter(r=>r.grp===n);
  const head=`<section class="card"><div class="head"><div><h2>Financial ratios</h2><p class="sub">Balance sheet as of ${esc(fdate(rs.asOf))} · income and spending for ${esc(periodLabel())}. Ratios are unitless, so they do not change with the currency you view.</p></div></div>
   <div class="rsum"><span class="pill good">${sm.g} healthy</span><span class="pill warn">${sm.w} watch</span><span class="pill bad">${sm.k} at risk</span><span class="muted"> of ${sm.n} rated</span></div>
   <p class="footnote" style="margin-top:8px">Bands are common rules of thumb, not advice. Your own targets for needs, wants and saving come from Settings.</p></section>`;
  const sec=(n,sub)=>`<h3 class="rgrp">${n}<small>${sub}</small></h3><div class="rgrid">${grp(n).map(ratioCard).join('')}</div>`;
  return head+sec('Balance sheet','How strong your position is today')+sec('Income and spending','How the selected period performed')+(rs.hasIncome?'':'<p class="footnote">There is no income in this period, so income-based ratios show a dash.</p>');

function reportModel(kind,s,e){

const monthsBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const median=a=>{const b=[...a].sort((x,y)=>x-y),n=b.length;return n?(n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2):0};
const normDesc=t=>String(t||'').toLowerCase().replace(/[0-9#*\-_/.,]+/g,' ').replace(/\s+/g,' ').trim();
const toBase=(amount,cur,date)=>{const r=fxAt(S.data,cur,date);return r===null?null:amount*r};
const fromBase=(v,cur,date)=>{const r=fxAt(S.data,cur,date||S.ix.latest);return r?v/r:null};
const fmtIn=(v,cur,dec=0)=>S.mask?'••••':new Intl.NumberFormat(cur==='INR'?'en-IN':'en-GB',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v).replace('-','−');
const catKey=l=>NW.test(l.main)?l.main+' › '+(l.level2||l.label):(l.main||'Uncategorised');
const monthOptions=(sel,from,to)=>{const o=[];for(let m=from;m<=to;m=addMonths(m,1))o.push(`<option value="${m.slice(0,7)}" ${m.slice(0,7)===sel?'selected':''}>${esc(fmonLong(m))}</option>`);return o.join('')};

/* ---- repeating payments ---- */
function detectRecurring(){
  const ix=S.ix,L=ix.latest,from=addDays(L,-240),g={};
  for(const t of ix.txs){
    if(t.date<from||isOneoff(t.tx))continue;
    let src,amt;
    if(t.kind==='income'){if(t.amount<=0)continue;src='income';amt=t.amount}
    else if(t.kind==='expense'){if(t.amount>=0)continue;src='spending';amt=t.amount}
    else{
      if(t.lines.some(l=>l.a.type==='CREDIT CARD'))continue;
      const cd=sum(t.lines.filter(l=>isCash(l.a)),l=>l.value);
      const other=t.lines.some(l=>!isCash(l.a)&&(l.group==='Asset'||l.group==='Liability'));
      if(!other||cd>-.01)continue;
      src='transfer';amt=cd;
    }
    const k=src+'|'+(normDesc(t.description)||t.description);
    (g[k]??=[]).push({date:t.date,amt,desc:t.description,cat:t.cat});
  }
  const out=[];
  for(const[k,arr]of Object.entries(g)){
    if(arr.length<2)continue;
    arr.sort((a,b)=>a.date.localeCompare(b.date));
    const gaps=[];for(let i=1;i<arr.length;i++)gaps.push(daysBetween(arr[i-1].date,arr[i].date)-1);
    const mi=median(gaps);
    let every=null;
    if(mi>=26&&mi<=35&&arr.length>=3)every='monthly';else if(mi>=84&&mi<=97)every='quarterly';
    if(!every)continue;
    if(gaps.filter(x=>Math.abs(x-mi)<=6).length<gaps.length/2)continue;
    const last=arr.at(-1);
    if(daysBetween(last.date,L)-1>mi*1.6)continue;
    const prevAmts=arr.slice(0,-1).map(x=>x.amt),prevMed=median(prevAmts),lastAmt=last.amt,stable=prevAmts.every(v=>Math.abs(v-prevMed)<=Math.max(.5,Math.abs(prevMed)*.02)),changed=arr.length>=3&&stable&&Math.abs(lastAmt-prevMed)>Math.max(.5,Math.abs(prevMed)*.03);
    out.push({key:k,src:k.split('|')[0],desc:last.desc,cat:last.cat,amt:median(arr.map(x=>x.amt)),every,interval:Math.round(mi),last:last.date,n:arr.length,lastAmt,prevMed,changed,ignored:!!(S.plan.ignoreRec&&S.plan.ignoreRec[k])});
  }
  return out;
}
function upcoming(rec,days){
  const L=S.ix.latest,end=addDays(L,days),out=[];
  for(const r of rec){
    let d=addDays(r.last,r.interval);
    if(d<=L){if(daysBetween(d,L)-1>10){while(d<=L)d=addDays(d,r.interval)}else d=addDays(L,1)}
    while(d<=end){out.push({...r,date:d});d=addDays(d,r.interval)}
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
